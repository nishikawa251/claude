  if (code.length !== 5){ Net.error = '部屋コードは5文字。'; render(); return; }
  netReset(); Net.error = ''; Net.status = '部屋に接続しています…'; Net.code = code; render();
  try { await loadPeerJS(); } catch { return netFail('通信ライブラリを読み込めなかった。ネットワークを確かめてほしい。'); }
  const peer = new Peer(undefined, peerOptions());
  Net.peer = peer;
  let token = store.get('ss-token-' + code);
  if (!token){ token = randToken(); store.set('ss-token-' + code, token); }
  peer.on('open', () => {
    const conn = peer.connect(NET_PREFIX + code, { reliable:true });
    Net.host = conn;
    conn.on('open', () => {
      send(conn, { t:'hello', name:myName(), token, char:UI.setup.char });
      Net.lastHost = Date.now();
      clearInterval(Net.beat);
      Net.beat = setInterval(() => {
        if (Net.host !== conn) return;
        if (Net.role === 'client' && Date.now() - Net.lastHost > LOST_MS) return netFail('ホストとの接続が切れた。');
        send(conn, { t:'ping' });
      }, BEAT_MS);
    });
    conn.on('data', d => { Net.lastHost = Date.now(); netClientData(d); });
    conn.on('close', () => { if (Net.host === conn) netFail('ホストとの接続が切れた。'); });
    conn.on('error', () => { if (Net.host === conn) netFail('ホストとの接続が切れた。'); });
  });
  peer.on('error', e => { if (Net.peer === peer) netFail(netErrText(e)); });
  Net.joinTimer = setTimeout(() => { if (Net.peer === peer && Net.role !== 'client') netFail('部屋に接続できなかった。部屋コードとネットワークを確かめてほしい。'); }, 15000);
}

  if (prob){

/* ---------- 攻撃の矢印 ---------- */
// いまの攻撃で「攻撃している人」「狙われている人」
function duelLinks(){
  const s = G && G.stage, out = [];
  if (!s || !s.src) return out;
  const color = s.atk ? `var(--el-${s.atk.el})` : 'var(--rose)';
  if (s.dst && s.dst !== s.src) out.push({ from:s.src, to:s.dst, color });
  if (s.flips) s.flips.filter(x => x.ok).forEach(x => out.push({ from:s.src, to:x.t, color }));
  return out;
}
function duelRole(p){
  const links = duelLinks(), r = [];
  if (links.some(l => l.from === p)) r.push('attacker');
  if (links.some(l => l.to === p)) r.push('defender');
  return r;
}
function panelOf(p){ return document.querySelector(p === me() ? '#mePanel' : `.pl[data-pid="${p.i}"]`); }
function edgePoint(r, tx, ty, pad){
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2, dx = tx - cx, dy = ty - cy;
  const k = Math.min(dx ? (r.width / 2 + pad) / Math.abs(dx) : Infinity, dy ? (r.height / 2 + pad) / Math.abs(dy) : Infinity, 1);
  return [cx + dx * k, cy + dy * k];
}
function arrowSVG(a, b, color, cls){
  const ra = a.getBoundingClientRect(), rb = b.getBoundingClientRect();
  if (!ra.width || !rb.width) return '';
  const ca = [ra.left + ra.width / 2, ra.top + ra.height / 2], cb = [rb.left + rb.width / 2, rb.top + rb.height / 2];
  const p0 = edgePoint(ra, cb[0], cb[1], 2), p1 = edgePoint(rb, ca[0], ca[1], 6);
  const dx = p1[0] - p0[0], dy = p1[1] - p0[1], len = Math.hypot(dx, dy) || 1;
  const bend = Math.max(26, Math.min(90, len * 0.25));
  const c = [(p0[0] + p1[0]) / 2 - dy / len * bend, (p0[1] + p1[1]) / 2 + dx / len * bend];
  // 矢じり：曲線の終点での向き
  const tx = p1[0] - c[0], ty = p1[1] - c[1], tl = Math.hypot(tx, ty) || 1, ux = tx / tl, uy = ty / tl;
  const hl = cls ? 12 : 18, hw = cls ? 7 : 10;
  const base = [p1[0] - ux * hl, p1[1] - uy * hl];
  const head = `${p1[0]},${p1[1]} ${base[0] - uy * hw},${base[1] + ux * hw} ${base[0] + uy * hw},${base[1] - ux * hw}`;
  const d = `M${p0[0]},${p0[1]} Q${c[0]},${c[1]} ${base[0]},${base[1]}`;
  return `<g class="${cls}" style="color:${color}"><path class="glow" d="${d}"/><path class="shaft" d="${d}"/><polygon class="head" points="${head}"/></g>`;
}
function drawArrows(){
  const svg = $('#arrows');
  if (!svg) return;
  let h = '';
  if (G && !$('#game').hidden){
    for (const l of duelLinks()){ const a = panelOf(l.from), b = panelOf(l.to); if (a && b) h += arrowSVG(a, b, l.color, ''); }
    // 自分の番：選んだ対象へ点線の矢印
    if (UI.mode === 'action' && UI.target && UI.target !== me() && UI.target.alive){
      const plan = actionPlan();
      if (plan.ok && plan.tk && plan.tk !== 'none'){ const a = panelOf(me()), b = panelOf(UI.target); if (a && b) h += arrowSVG(a, b, 'var(--rose)', 'preview'); }
    }
  }
  svg.innerHTML = h;
}

  if (s.dst && s.dst !== s.src){
    h += `<div class="duel"><div class="who">${gem(s.src)}<span>${esc(s.src.name)}</span></div><span class="arrow">➝</span><div class="who">${gem(s.dst)}<span>${esc(s.dst.name)}</span></div></div>`;
  } else {
    h += `<div class="duel"><div class="who">${gem(s.src)}</div><div class="stitle">${esc(s.title)}</div></div>`;
  }
  if (s.art) h += `<img class="art" src="${s.art}" alt="">`;

  if (s.atk) h += `<div class="power"><b style="color:var(--el-${s.atk.el})">〔${EL[s.atk.el]}〕</b> ${s.atk.instakill ? '<b>即死</b>' : `攻撃力 <b>${s.atk.power}</b>`}${s.atk.magic ? '・魔法' : ''}${s.atk.kiss ? '・防御1枚まで' : ''}</div>`;

function renderControls(plan){
  const p = me();
  let prompt = '', ctrl = '';
  if (UI.mode === 'action'){
    prompt = UI.extra.magicOnly
      ? '<strong>《活力》</strong>　続けて☆魔法をもう1枚使える（HP消費なし）。'
      : `<strong>あなたのターン</strong>　カードを選んで使うか、パスする。${plan.tk && plan.tk !== 'none' ? '対象はプレイヤーをタップ。' : ''}`;
    ctrl += `<button type="button" class="btn" data-ctl="go" ${plan.ok ? '' : 'disabled'}>${esc(plan.label)}</button>`;
    ctrl += `<button type="button" class="btn sub" data-ctl="pass">パス</button>`;
    if (!UI.extra.magicOnly && !G.ts.played && G.round > 1){
      if (p.role === 'succubus' && !p.revealed) ctrl += `<button type="button" class="btn sub" data-ctl="manifest">顕現する</button>`;
      if (!G.ts.gifted && canGift(p)) ctrl += `<button type="button" class="btn sub" data-ctl="gift">供与する</button>`;
    }
  } else if (UI.mode === 'defend'){
    const { atk, src } = UI.extra;
    const faces = [...selCards(), ...selField()].map(c => faceFor(p, c));
    const pr = predict(p, atk, faces, faces.some(f => f.sp === 'choose') ? 'choose' : null);
    prompt = `<strong>${esc(src.name)}の${esc(atk.name)}</strong>（${atkLabel(atk)}）があなたを狙う！ 光っているカードで防御できる。${atk.kiss ? '防御は1枚まで。' : ''}`;
    ctrl = `<button type="button" class="btn holy" data-ctl="def">${faces.length ? `防御する（${pr.text}）` : `そのまま受ける（${pr.text}）`}</button>`;
  } else if (G.ending && Net.role === 'host' && Net.pending.size){
    prompt = 'ほかのプレイヤーの確認を待っています…';
  } else if (!G.ending){
    const cur = G.players[G.turn];
    prompt = !p.alive ? 'あなたは昇天した。ゲームの行方を見守ろう。' : cur && cur !== p ? `${esc(cur.name)}のターン…` : '';
  }
  $('#prompt').innerHTML = prompt;
  $('#controls').innerHTML = ctrl;

  let info;
  const f = UI.focus && (p.hand.includes(UI.focus) || usableField(p).includes(UI.focus)) ? UI.focus : null;
  if (f){
    info = cardInfo(f, p) + `<button type="button" class="btn-ghost zoombtn" data-zoom="${cardSrc(f.def)}">実物カードを見る</button>`;
    if (UI.mode === 'action'){ const why = p.hand.includes(f) ? playProblem(p, f, UI.extra.magicOnly) : fieldProblem(p, f, UI.extra.magicOnly); if (why) info += `\n（${why}）`; }
  } else if (UI.mode === 'defend'){
    info = '属性つきの攻撃は同じ属性の防御カードでしか守れない。無属性の攻撃はどの防御カードでも守れる。防御カードは何枚でも重ねられる。';
  } else if (UI.mode === 'action'){
    info = '《追撃》カードを選ぶと、続けて▲カードを重ねられる（番号の順に使う）。使えないカードを1枚選ぶと、捨ててパスできる。';
  } else info = 'カードをタップすると説明が出る。';
  $('#info').innerHTML = info;
}

function renderHand(){
  const p = me();
  const fieldCards = usableField(p);
  if (fieldCards.length){
    $('#myField').innerHTML = `<span class="rowlabel">場の魔法</span>` + fieldCards.map(c => {
      const f = faceFor(p, c); const own = p.field.includes(c);
      let cls = '';
      if (UI.fsel.includes(c.uid)) cls = 'sel';
      else if (UI.mode === 'action' && fieldProblem(p, c, UI.extra.magicOnly)) cls = 'off';
      else if (UI.mode === 'defend' && !defenseSelectable(c)) cls = 'off';
      return `<button type="button" class="fcard el-${f.el} ${cls}" data-fuid="${c.uid}">${own ? '' : '他人の場：'}${esc(f.name)}　HP${magicCost(p, f)}</button>`;
    }).join('');
  } else $('#myField').innerHTML = '';

  if (!p.alive){ $('#hand').innerHTML = '<div class="empty">あなたは昇天した。</div>'; return; }
  if (!p.hand.length){ $('#hand').innerHTML = '<div class="empty">手札がない。</div>'; return; }
  $('#hand').innerHTML = p.hand.map(c => {
    const cls = [];
    const oi = UI.sel.indexOf(c.uid);
    if (oi >= 0) cls.push('sel');
    if (UI.mode === 'action'){
      const cur = selCards();
      const last = cur.length ? faceFor(p, cur[cur.length - 1]) : null;
      const canAdd = last && last.kw.chain && faceFor(p, cur[0]).isAtk && chainable(p, c);
      if (oi < 0 && !canAdd && playProblem(p, c, UI.extra.magicOnly)) cls.push('off');
      if (oi < 0 && canAdd) cls.push('usable');
    } else if (UI.mode === 'defend'){
      if (oi < 0) cls.push(defenseSelectable(c) ? 'usable' : 'off');
    }
    return cardHTML(c, p, cls.join(' '), UI.mode === 'action' && UI.sel.length > 1 && oi >= 0 ? oi + 1 : 0);
  }).join('');
}

function renderModal(){
  const m = $('#modal');
  let h = '';
  if (UI.zoom) h = `<div class="sheet zoom"><img src="${UI.zoom}" alt="" onerror="this.replaceWith('画像がありません')">${zoomNote(UI.zoom)}<div class="row"><button type="button" class="btn" data-zoomclose="1">閉じる</button></div></div>`;
  else if (UI.rules) h = rulesHTML();
  else if (UI.mode === 'notice'){
    const x = UI.extra;
    h = `<div class="sheet"><h2>${esc(x.title)}</h2>${x.role ? `<div class="bigrole ${x.role}">${ROLE[x.role]}</div>` : ''}${x.art ? `<img class="art" src="${x.art}" alt="">` : ''}<p style="white-space:pre-line">${esc(x.body)}</p>
      <div class="row"><button type="button" class="btn" data-ok="1">わかった</button></div></div>`;
  } else if (UI.mode === 'option'){
    const x = UI.extra;
    h = `<div class="sheet"><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p>${x.card ? `<div class="hand">${cardHTML(x.card, me())}</div>` : ''}
      <div class="row">${x.options.map((o, i) => `<button type="button" class="btn ${o.cls || ''}" data-opt="${i}">${esc(o.label)}</button>`).join('')}</div></div>`;
  } else if (UI.mode === 'cards'){
    const x = UI.extra;
    const n = UI.sel.length, okN = n >= x.min && n <= x.max;
    const fc = UI.mfocus ? x.cards.find(c => c.uid === UI.mfocus) : null;
    h = `<div class="sheet"><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p>
      <div class="hand">${x.cards.map(c => cardHTML(c, x.owner, UI.sel.includes(c.uid) ? 'sel' : '')).join('')}</div>
      <div class="info">${fc ? cardInfo(fc, x.owner) + `<button type="button" class="btn-ghost zoombtn" data-zoom="${cardSrc(fc.def)}">実物カードを見る</button>` : 'カードをタップして選ぶ。'}</div>
      <div class="row"><span class="muted" style="margin-right:auto">${n}枚選択${x.min === x.max ? `（${x.min}枚選ぶ）` : `（${x.min}〜${x.max}枚）`}</span>
      <button type="button" class="btn" data-mc="ok" ${okN ? '' : 'disabled'}>${n ? '決定' : '選ばずに決定'}</button></div></div>`;
  } else if (UI.mode === 'player'){
    const x = UI.extra;
    h = `<div class="sheet"><h2>${esc(x.title)}</h2><p>${esc(x.body)}</p>
      <div class="plist">${x.players.map(q => `<button type="button" data-pick="${q.i}">${gem(q)}<span>${esc(q.name)}　HP ${q.hp}</span>${roleBadge(q, me())}</button>`).join('')}</div></div>`;
  } else if (UI.mode === 'result' && G.result){
    const r = G.result;
    h = `<div class="sheet"><h2>第${M.game}戦 終了</h2><p>${esc(r.text)}</p>
      <div class="tbl-wrap"><table class="score"><tr><th>プレイヤー</th><th>神託</th><th>状態</th><th>内訳</th><th class="num">今回</th><th class="num">合計</th></tr>
      ${G.players.map(p => { const g = r.gain.get(p); const d = g.reduce((s, x) => s + x.v, 0);
        return `<tr><td class="nm">${esc(p === me() ? `あなた（${p.char.short}）` : p.name)}</td><td><span class="role ${p.role}">${ROLE[p.role]}</span></td><td>${p.alive ? '生存' : '昇天'}</td>
        <td>${g.map(x => `${esc(x.why)} ${x.v > 0 ? '+' : ''}${x.v}`).join('、') || '—'}</td><td class="num ${d > 0 ? 'plus' : d < 0 ? 'minus' : ''}">${d > 0 ? '+' : ''}${d}</td><td class="num">${p.vp}</td></tr>`; }).join('')}
      </table></div>
      <div class="row"><button type="button" class="btn" data-ok="1">${M.game < GAMES ? `第${M.game + 1}戦へ` : '最終結果へ'}</button></div></div>`;
  } else if (UI.mode === 'final'){
    const ranked = M.players.slice().sort((a, b) => b.vp - a.vp);
    const top = ranked[0].vp;
    const winners = ranked.filter(p => p.vp === top);
    h = `<div class="sheet"><h2>${winners.includes(M.players[0]) ? 'あなたが天界の覇者！' : `天界の覇者：${esc(winners.map(p => p.name).join('・'))}`}</h2>
      <div class="tbl-wrap"><table class="score"><tr><th>順位</th><th>プレイヤー</th>${M.players[0].history.map((_, i) => `<th class="num">${i + 1}戦</th>`).join('')}<th class="num">合計</th></tr>
      ${ranked.map(p => `<tr><td>${ranked.filter(q => q.vp > p.vp).length + 1}位</td><td class="nm">${esc(p === me() ? `あなた（${p.char.short}）` : p.name)}</td>${p.history.map(v => `<td class="num">${v > 0 ? '+' : ''}${v}</td>`).join('')}<td class="num">${p.vp}</td></tr>`).join('')}
      </table></div>
      <div class="row"><button type="button" class="btn sub" data-home="1">${Net.role ? '部屋を出る' : 'タイトルへ'}</button>${Net.role === 'client' ? '' : `<button type="button" class="btn" data-again="1">${Net.role ? '同じメンバーでもう一度' : '同じ設定でもう一度'}</button>`}</div></div>`;
  }
  m.hidden = !h;
  if (h) m.innerHTML = h;
}

function rulesHTML(){
  return `<div class="sheet"><h2>ルール（260717版）</h2>
    <h3>勝ち方</h3>
    <ul>
      <li>神託でサキュバス1人・シスター・堕天使（4人以上で1人）に分かれる。3〜6人で遊ぶ。自分の神託だけが見える。</li>
      <li>サキュバスが昇天すればシスター陣営の勝ち。サキュバスが最後の1人になるか、生き残りがサキュバスと堕天使だけになればサキュバス陣営の勝ち。山札が尽きても終わる。</li>
      <li>3戦して勝利点の合計を競う。</li>
    </ul>
    <h3>ターン</h3>
    <ul>
      <li>【ドロー】手札が6枚になるまで引く（引けなければゲーム終了）。</li>
      <li>【オラクル】2巡目から。サキュバスは【顕現】（HPが30に戻る・手札上限＋1・攻撃がすべて《吸収》・手札を補充）。堕天使は顕現に合わせて【告解】でき、以後【供与】でカードをサキュバスに渡せる。</li>
      <li>【アタック】カードを1枚使う。《追撃》があれば▲カードを続けて重ね、ダメージを足せる（属性は最初のカード、範囲は最後のカード）。</li>
      <li>攻撃された人は防御カードを何枚でも出せる。属性つきの攻撃は同じ属性の防御でしか守れない。無属性の攻撃はどの防御でも守れる。</li>
      <li>☆魔法はHPを払って使い、使ったあとは自分の場に残る。場の魔法はまたHPを払えば何度でも使える。</li>
      <li>ランダム範囲（例：〔A B C〕）は、自分以外の全員が山札を1枚めくり、そのトリガーが一致した人にだけ当たる。</li>
      <li>†カードはシスター専用（断罪）。♥カードはシスター・堕天使は上の効果、サキュバスは下の効果を使う。どちらも1巡目は使えず、使うと正体が明かされる。</li>
    </ul>
    <h3>勝利点</h3>
    <ul>
      <li>サキュバスが最後の1人、または生き残りがサキュバスと堕天使だけ：サキュバスと堕天使に＋3。</li>
      <li>サキュバスが昇天：生存者全員＋1、サキュバスと堕天使は−2、断罪を成功させた人＋1、生存者が1人ならその人に＋3。</li>
      <li>山札切れ：生存者全員＋1、サキュバス−2。全員昇天なら計算なし。</li>
    </ul>
    <h3>デジタル版で解釈したところ</h3>
    <ul>
      <li>文書で名前が入れ替わっている「天罰／必殺」は、シートの記号どおり †＝シスター専用（断罪）、♥＝両面カードとして扱う。</li>
      <li>†カードは使う時点で正体を明かす（まだなら自動で明かす）。</li>
      <li>《反撃》の「受けたダメージ」は、防御したあとに実際に受けたダメージ。</li>
      <li>《反射》《無効》《除去》や「立場をわからせる」は、効果が働く攻撃なら属性に関係なく出せる。</li>
      <li>《追撃》で重ねた杖の「属性を変えてもよい」は、常に変える。</li>
      <li>昇天はダメージを受けた時点ですぐに処理する。</li>
      <li>回復カードは自分にだけ使える。</li>
      <li>仮ルール：何もしないときはパスでき、そのとき手札を1枚捨ててもよい（手札が回らなくなるのを防ぐため）。</li>
    </ul>
    <div class="row"><button type="button" class="btn" data-closerules="1">閉じる</button></div></div>`;
}

function fx(p, text, cls){
  if (Net.role === 'host') netBroadcast({ t:'fx', p:p.i, text, cls });
  const el = document.querySelector(p === me() ? '#mePanel' : `.pl[data-pid="${p.i}"]`);
  if (!el) return;
  const r = el.getBoundingClientRect();
  if (!r.width) return;
  const s = document.createElement('span');
  s.className = `float ${cls}`;
  s.textContent = text;
  s.style.left = `${r.left + r.width / 2 + (Math.random() * 30 - 15)}px`;
  s.style.top = `${r.top + Math.min(r.height / 2, 30)}px`;
  $('#fx').appendChild(s);
  setTimeout(() => s.remove(), 1200);
}

/* ================================================================
   イベント
   ================================================================ */
document.addEventListener('click', e => {
  const t = e.target.closest('button');
  if (!t) return;
  const d = t.dataset;
  if (d.zoom){ UI.zoom = d.zoom; render(); return; }
  if (d.zoomclose){ UI.zoom = null; render(); return; }
  if (d.closerules){ UI.rules = false; render(); return; }
  if (t.id === 'btnRules2'){ UI.rules = true; render(); return; }
  if (d.online !== undefined){ UI.setup.online = d.online === '1'; Net.error = ''; render(); return; }
  if (d.host){ netHost(); return; }
  if (d.join){ netJoin(UI.setup.joinCode); return; }
  if (d.leave){ netLeave(); render(); return; }
  if (d.copy){ const u = inviteURL(); (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(() => { t.textContent = 'コピーした'; }, () => { const i = $('#netURL'); if (i){ i.focus(); i.select(); } }); return; }
  if (d.count){ if (Net.role === 'client') return; UI.setup.count = +d.count; if (Net.role === 'host') netLobbyBroadcast(); render(); return; }
  if (d.char){ UI.setup.char = +d.char; if (Net.role === 'client') send(Net.host, { t:'char', char:UI.setup.char }); if (Net.role === 'host') netLobbyBroadcast(); render(); return; }
  if (d.start){ if (Net.role === 'host') netStartMatch(); else { UI.mode = 'wait'; startMatch(); } return; }
  if (d.again){ if (Net.role === 'host') netStartMatch(); else startMatch(); return; }
  if (d.home){ gameId++; if (Net.role) netLeave(); UI.mode = 'setup'; UI.resolve = null; G = null; render(); return; }
  if (d.ok && UI.resolve){ UI.resolve(true); return; }
  if (d.opt !== undefined && UI.resolve){ UI.resolve(UI.extra.options[+d.opt].value); return; }
  if (d.pick !== undefined && UI.resolve){ UI.resolve(G.players[+d.pick]); return; }
  if (d.mc === 'ok' && UI.resolve){ const x = UI.extra; UI.resolve(UI.sel.map(uid => x.cards.find(c => c.uid === uid))); return; }
  if (d.uid && t.closest('#modal')){
    const uid = +d.uid;
    if (UI.mode === 'cards'){
      UI.mfocus = uid;
      const i = UI.sel.indexOf(uid);
      if (i >= 0) UI.sel.splice(i, 1);
      else if (UI.extra.max === 1) UI.sel = [uid];
      else if (UI.sel.length < UI.extra.max) UI.sel.push(uid);
      render();
    }
    return;
  }
  if (d.uid){ onCard(+d.uid); return; }
  if (d.fuid){ onFieldCard(+d.fuid); return; }
  if (d.ctl){ onControl(d.ctl); return; }
  if (d.pid !== undefined) onPlayer(+d.pid);
});
document.addEventListener('click', e => {
  // 自分のパネル（button ではない）を対象に選ぶ
  const mp = e.target.closest('#mePanel');
  if (mp && !e.target.closest('button') && G) onPlayer(me().i);
});
window.addEventListener('resize', drawArrows);
window.addEventListener('scroll', drawArrows, { passive:true });
$('#btnRules').addEventListener('click', () => { UI.rules = true; render(); });
$('#btnSpeed').addEventListener('click', e => {
  speed = speed === 1 ? 0.45 : speed === 0.45 ? 0.15 : 1;
  e.currentTarget.textContent = `速度：${speed === 1 ? '普通' : speed === 0.45 ? '速い' : '最速'}`;
});
$('#btnRestart').addEventListener('click', () => { gameId++; if (Net.role) netLeave(); UI.mode = 'setup'; UI.rules = false; UI.resolve = null; G = null; render(); });
document.addEventListener('input', e => {
  if (e.target.id === 'netName'){ UI.setup.name = cleanName(e.target.value); store.set('ss-name', UI.setup.name); }
  if (e.target.id === 'netCode'){ UI.setup.joinCode = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'netCode') netJoin(UI.setup.joinCode); });
window.addEventListener('beforeunload', () => { if (Net.role === 'host') netBroadcast({ t:'bye' }); else if (Net.host) send(Net.host, { t:'bye' }); });
// 招待URL（?room=コード）から開いたら、オンライン対戦の画面にする
UI.setup.name = cleanName(store.get('ss-name') || '');
{ const room = new URLSearchParams(location.search).get('room'); if (room){ UI.setup.online = true; UI.setup.joinCode = room.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 5); } }

render();
</script>
