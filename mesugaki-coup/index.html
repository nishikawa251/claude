<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メスガキ・クー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#1a1020;
  --panel:#261a30;
  --panel2:#31223d;
  --line:#4e3658;
  --line2:#6a4a78;
  --ink:#fff1f7;
  --dim:#b79fb8;
  --pink:#ff5fa8;
  --pink2:#ff2d7a;
  --pinkDark:#b8336f;
  --heart:#ff4d8d;
  --gold:#ffd166;
  --blue:#7fc1ff;
  --green:#8ee0a0;
  --boro:#8a7a86;
  --f:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{min-height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 20% 10%,#2d1738 0,transparent 40%),radial-gradient(circle at 80% 90%,#2a1240 0,transparent 45%)}
button{font:inherit;color:inherit}

.pxbox{--c:var(--line2);background:var(--panel);box-shadow:0 -3px 0 0 var(--c),0 3px 0 0 var(--c),-3px 0 0 0 var(--c),3px 0 0 0 var(--c)}

#app{max-width:1100px;margin:0 auto;padding-block:10px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.top h1{margin:0;font-size:22px;font-weight:400;letter-spacing:.12em;color:var(--pink)}
.top h1 small{font-size:12px;color:var(--dim);margin-left:8px;letter-spacing:.05em}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.btn{font-family:var(--f);font-size:14px;background:var(--panel2);border:none;color:var(--ink);padding:6px 12px;cursor:pointer;letter-spacing:.05em;margin:2px;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.btn:hover{background:#3d2b4a}
.btn:focus-visible{outline:none;box-shadow:0 -2px 0 0 var(--pink),0 2px 0 0 var(--pink),-2px 0 0 0 var(--pink),2px 0 0 0 var(--pink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--pink);color:#2a0b18;box-shadow:0 -2px 0 0 var(--pinkDark),0 2px 0 0 var(--pinkDark),-2px 0 0 0 var(--pinkDark),2px 0 0 0 var(--pinkDark),inset 0 -3px 0 0 var(--pinkDark)}
.btn.primary:hover{background:#ff7ebb}
.btn.danger{background:#5a1f33}
.btn.small{padding:4px 9px;font-size:13px}
.btn .sub{display:block;font-size:11px;color:var(--dim);margin-top:2px}
.btn.primary .sub{color:#5a1b36}

/* ---------- players ---------- */
/* 円卓：上段＝奥の相手、中段＝左右の相手と中央のログ、下段＝あなた。フェルトは後ろに敷く */
.table{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-rows:auto auto auto;gap:14px 12px;align-items:center;justify-items:center;padding-top:6px}
.seats{display:contents}
.seat-top{grid-area:1/1/2/4;display:flex;gap:18px;justify-content:center;align-items:flex-start;flex-wrap:wrap;z-index:2}
.seat-left{grid-area:2/1/3/2;z-index:2}
.seat-right{grid-area:2/3/3/4;z-index:2}
.center{grid-area:2/2/3/3;width:100%;max-width:460px;z-index:1}
.meseat{grid-area:3/1/4/4;z-index:3}
.felt{position:absolute;left:5%;right:5%;top:90px;bottom:150px;border-radius:50%;z-index:0;
  background:radial-gradient(ellipse at 50% 35%,#6c2f60 0,#4a1f45 45%,#30142d 100%);
  box-shadow:inset 0 0 0 12px #6b4a36,inset 0 0 0 16px #3a2419,inset 0 0 90px rgba(0,0,0,.55),0 26px 60px rgba(0,0,0,.6)}
.felt::after{content:'';position:absolute;inset:26px;border-radius:50%;border:1px dashed rgba(255,150,200,.16)}
.seats .pl{width:336px;position:relative}
.pl:not(.me) .hand{flex-direction:column}
.pl:not(.me) .cards{flex:0 0 auto}
.me .cards{flex:1 1 340px}
.center{display:flex;flex-direction:column;gap:8px}
.meseat{width:max-content;max-width:100%}

.pl{position:relative;padding:8px 10px 10px;--c:var(--line2);transition:opacity .3s}
.pl.cur{--c:var(--pink)}
.pl.dead{opacity:.45}
.pl.target{--c:var(--gold)}
.pl.pickable{cursor:pointer;--c:var(--gold);box-shadow:0 -3px 0 0 var(--c),0 3px 0 0 var(--c),-3px 0 0 0 var(--c),3px 0 0 0 var(--c),0 0 24px rgba(255,209,102,.35)}
.pl.pickable:hover{filter:brightness(1.12)}
.pl.pickable::after{content:'クリックで選ぶ';position:absolute;right:10px;bottom:6px;font-size:11px;color:var(--gold);letter-spacing:.05em}
.plhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.plhead .nm{letter-spacing:.08em}
.plhead .nm .tag{font-size:11px;color:var(--dim);margin-left:6px}
.hearts{display:inline-flex;align-items:baseline;gap:5px;background:rgba(255,77,141,.16);padding:1px 12px 1px 9px;box-shadow:0 0 0 2px var(--heart) inset;color:var(--heart);font-size:18px;line-height:1.25;white-space:nowrap}
.hearts b{color:#fff;font-weight:400;font-size:30px;font-variant-numeric:tabular-nums;text-shadow:0 0 10px rgba(255,77,141,.6)}
.me .hearts{font-size:22px;padding:2px 14px 2px 11px}
.me .hearts b{font-size:40px}
.hearts.bump{animation:bump .5s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.25)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.hearts.bump{animation:none}}
.plbody{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.figure{display:flex;flex-direction:column;gap:2px;flex:none;align-items:flex-start}
.figure.sm{--cw:112px}
.figure.md{--cw:150px}
.figure.lg{--cw:224px}
.figure.xl{--cw:260px}
.figure .ccard{width:max-content}
.figrow{display:flex;gap:6px;align-items:flex-start;flex:none;--cw:150px}
.figrow.lg{--cw:184px}
.figrow.md{--cw:112px}
.trigcol{display:flex;flex-direction:column;gap:2px}
.trigcol .tc{height:calc(var(--cw) * 0.7164 + 6px);min-height:0;width:150px;overflow:hidden}
.trigcol .tc .tt{font-size:10px;line-height:1.3}
.trigcol .tc.sm{width:68px;padding:3px 4px}
.trigcol .tc.sm .tn{font-size:10px;white-space:normal;line-height:1.2}
.trigcol .tc.back{font-size:10px;letter-spacing:.05em}
.ccard img{display:block;width:var(--cw);height:auto;aspect-ratio:416/298;background:#2d1a3a;user-select:none;-webkit-user-drag:none}
.ccard.noimg{width:var(--cw);aspect-ratio:416/298;display:grid;place-items:center}
.ccard.noimg .ph{font-size:12px;color:var(--dim);text-align:center;white-space:pre-line;line-height:1.5}
.ccard{position:relative;padding:3px;background:#3a2548;box-shadow:0 0 0 2px var(--pink) inset}
.ccard.boro{background:#2a2228;box-shadow:0 0 0 2px var(--boro) inset}
.ccard .lbl{position:absolute;left:2px;top:2px;font-size:10px;line-height:1;padding:2px 3px;background:rgba(0,0,0,.45);color:var(--dim)}
.ccard.boro .lbl{color:#d6c2cc}
.cards{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.hand,.trigs{display:flex;gap:5px;flex-wrap:wrap}
.me .hand{gap:6px}
.lbl2{font-size:11px;color:var(--dim);margin-bottom:2px;letter-spacing:.05em}

/* role card */
.rc{width:164px;min-height:112px;padding:5px 6px 4px;background:#fff6fa;color:#3a1a2c;font-size:11.5px;line-height:1.3;display:flex;flex-direction:column;gap:4px;position:relative;
  box-shadow:0 0 0 2px var(--rcol,#ff5fa8) inset,0 2px 0 0 rgba(0,0,0,.4)}
.rc .rn{font-size:13px;font-weight:400;color:#fff;background:var(--rcol,#ff5fa8);margin:-5px -6px 1px;padding:4px 6px 3px;letter-spacing:.04em;white-space:nowrap}
.rc .rl{color:#6d4a5c;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.rc .rl b{font-weight:400;color:#3a1a2c}
.rc .ph{margin-top:auto;font-size:10px;color:var(--rcol,#ff5fa8);border-top:1px dashed #e7cbd8;padding-top:3px}
.rc.back{background:repeating-linear-gradient(45deg,#4c2a5e 0 6px,#3b1f4b 6px 12px);box-shadow:0 0 0 2px #7a4a8e inset,0 2px 0 0 rgba(0,0,0,.4);color:#d9b8e6;align-items:center;justify-content:center;font-size:18px}
.rc.back span{font-size:10px;letter-spacing:.1em}
.rc.lost{filter:grayscale(.9) brightness(.7)}
.rc.lost::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:48px;color:#ff2d7a;opacity:.75}
.rc.faceup{box-shadow:0 0 0 2px var(--gold) inset,0 2px 0 0 rgba(0,0,0,.4)}
.rc .fu{position:absolute;right:4px;top:4px;font-size:9px;background:var(--gold);color:#3a2a00;padding:1px 4px}
.rc.faceup .rn{padding-right:28px}
.rc.sm.faceup .rn{padding-right:4px}
.rc.sm .fu{top:auto;bottom:3px;right:3px}
.rc.peek{box-shadow:0 0 0 2px #8090d8 inset,0 2px 0 0 rgba(0,0,0,.4)}
.pooled{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.pfrom{font-size:11px;color:var(--dim)}
.rc .fu.pk{background:#8090d8;color:#101430}
.rc.sel{cursor:pointer;transition:transform .12s}
.rc.sel:hover{transform:translateY(-4px)}
.rc.sm{width:100px;min-height:84px;font-size:10px;padding:4px}
.rc.sm .rn{font-size:11px;margin:-4px -4px 1px;padding:3px 4px 2px}
.rc.sm .ph{display:none}
.rc.sm .rl{flex-direction:column;gap:0;white-space:normal;line-height:1.3}
.rc.sm .rl b{padding-left:6px}
.rc.sm.back{font-size:14px}

/* trigger card */
.tc{width:84px;min-height:54px;padding:4px 5px;font-size:10px;line-height:1.25;background:#2b3148;color:#cdd8ff;box-shadow:0 0 0 2px #5a6aa8 inset;position:relative}
.tc .tn{font-size:11px;color:#fff;margin-bottom:2px;letter-spacing:.04em}
.tc.back{background:repeating-linear-gradient(-45deg,#2b3148 0 6px,#232842 6px 12px);display:grid;place-items:center;color:#8a98d6;letter-spacing:.1em;font-size:11px}
.tc.peek{opacity:.8;box-shadow:0 0 0 2px #8090d8 inset}
.tc.peek::before{content:'👁';position:absolute;right:3px;top:2px;font-size:9px;opacity:.7}
.tc.on{background:#3a3f6a;box-shadow:0 0 0 2px var(--blue) inset}
.tc.none{color:#8a8a9a;background:#2a2a36;box-shadow:0 0 0 2px #4a4a5c inset}
.tc.sm{width:64px;min-height:44px;font-size:9px}
.tc.sm .tn{font-size:10px}
.tc .tt{display:block}
.tc.sm .tt{display:none}
.tc.sel{cursor:pointer}
.tc.sel:hover{filter:brightness(1.2)}

.bubble{position:absolute;right:8px;top:-14px;background:#fff;color:#2a0b18;padding:4px 10px;font-size:13px;border-radius:12px;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;z-index:4;max-width:80%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble::after{content:'';position:absolute;left:14px;bottom:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble.show{opacity:1;transform:translateY(0)}

/* ---------- middle ---------- */
.deck{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--dim)}
.deck span{background:rgba(10,4,14,.55);padding:3px 9px}
.deck b{color:var(--ink);font-weight:400}
.minilog{padding:6px 12px;font-size:12px;line-height:1.5;height:96px;overflow:auto;color:var(--dim);background:rgba(22,10,26,.94);--c:var(--line)}
@media (max-width:640px){ .minilog{height:66px;font-size:11px} }
.minilog div{padding:1px 0;border-bottom:1px dotted #3a2a44}
.minilog div:last-child{color:var(--ink);border:none}
.minilog .me{color:var(--pink)}
.minilog .sys{color:var(--gold)}
.minilog .hurt{color:#ff8da8}

/* ---------- prompt ---------- */
.prompt{padding:12px 14px;min-height:64px;--c:var(--pink)}
.prompt.idle{--c:var(--line)}
.pmsg{font-size:15px;line-height:1.5;margin-bottom:8px}
.pmsg small{color:var(--dim);display:block;font-size:12px}
.popts{display:flex;gap:6px;flex-wrap:wrap;align-items:stretch}
.pcards{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.pcards .wrap{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim)}

/* ---------- action tiles (カードとアクションの対応) ---------- */
.agroup{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.agroup .gl{font-size:11px;color:var(--dim);letter-spacing:.08em}
.atiles{display:flex;gap:10px;flex-wrap:wrap}
.at{--rcol:var(--line2);width:156px;padding:0 0 6px;background:var(--panel2);border:2px solid var(--rcol);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:3px;position:relative;font-family:var(--f);color:var(--ink)}
.at .ah{background:var(--rcol);color:#fff;padding:4px 7px;font-size:14px;letter-spacing:.04em}
.at .ar{font-size:11px;padding:2px 7px 0;color:var(--dim)}
.at .ar b{color:var(--ink);font-weight:400}
.at .ae{font-size:11px;padding:0 7px;line-height:1.35;color:var(--ink)}
.at .ab{font-size:10px;padding:0 7px;color:var(--dim)}
.at .ast{position:absolute;right:-2px;top:-10px;font-size:10px;padding:1px 6px;background:var(--green);color:#0b2a14}
.at.bluff{border-style:dashed}
.at.bluff .ah{background:transparent;color:var(--rcol);box-shadow:inset 0 0 0 1px var(--rcol)}
.at.bluff .ast{background:#4a3a52;color:var(--dim)}
.at.basic .ah{background:#3d2b4a;color:var(--ink)}
.at:hover{filter:brightness(1.15)}
.at:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.at:disabled{opacity:.3;cursor:not-allowed;filter:none}
.at.linked,.rc.linked{outline:3px solid var(--gold);outline-offset:2px}
.at.rec{outline:3px solid var(--gold);outline-offset:2px;animation:rec 1.2s ease-in-out infinite}
.at.rec .ah::before{content:'👉 '}
.rc.playable{cursor:pointer;box-shadow:0 0 0 2px var(--rcol,#ff5fa8) inset,0 0 0 3px var(--gold),0 2px 0 0 rgba(0,0,0,.4)}
.rc.playable:hover{transform:translateY(-4px)}
.rc .play{font-size:11px;color:#fff;background:var(--rcol,#ff5fa8);padding:3px 4px;text-align:center;margin:2px -6px -4px;letter-spacing:.04em}
.rc.playable.rec{animation:rec 1.2s ease-in-out infinite}
.rc .rl.act b{color:var(--rcol,#ff5fa8)}
.claim{display:flex;gap:10px;align-items:center;margin:4px 0 8px}
.claim .cl{font-size:11px;color:var(--dim);line-height:1.5}

/* ---------- effects ---------- */
.pl.shake{animation:shake .55s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{10%,90%{transform:translate(-2px,0)}20%,80%{transform:translate(4px,0) rotate(.4deg)}30%,50%,70%{transform:translate(-8px,1px) rotate(-.6deg)}40%,60%{transform:translate(8px,-1px) rotate(.6deg)}}
.pl.hit::after{content:'';position:absolute;inset:0;background:rgba(255,45,122,.5);pointer-events:none;animation:flash .7s ease-out forwards;z-index:4}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.fxp{position:absolute;left:50%;top:50%;pointer-events:none;z-index:5;font-size:24px;color:var(--pink2);text-shadow:0 0 8px #fff;animation:burst .8s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.5);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.5) rotate(var(--rot));opacity:0}}
.rc.lost.just{animation:drop .6s ease-out}
@keyframes drop{0%{transform:translateY(-22px) rotate(-10deg)}55%{transform:translateY(5px) rotate(4deg)}100%{transform:none}}
.tc.reveal{animation:glow 1s ease-out}
@keyframes glow{0%{box-shadow:0 0 0 2px var(--gold) inset,0 0 28px var(--gold);transform:scale(1.08)}100%{transform:none}}
.btn.sfx-off{color:var(--dim)}
@media (prefers-reduced-motion:reduce){.pl.shake,.pl.hit::after,.fxp,.rc.lost.just,.tc.reveal{animation:none}}

/* ---------- card flip (3D) ---------- */
.figure{perspective:700px}
.ccard.flipcard{overflow:visible}
.flipper{position:relative;width:var(--cw);aspect-ratio:416/298;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.1,.2,1)}
/* ドアップ演出 */
.zoom{position:fixed;inset:0;z-index:38;display:grid;place-items:center;align-content:center;gap:14px;background:rgba(10,4,14,0);transition:background .35s;cursor:pointer;padding:16px}
.zoom.in{background:rgba(10,4,14,.72)}
.zoom.out{animation:cutout .3s ease-in forwards}
.zoomcard{--cw:100%;width:min(78vw,calc(58vh * 416 / 298));aspect-ratio:416/298;perspective:1400px;transform-origin:center;will-change:transform;filter:drop-shadow(0 24px 50px rgba(0,0,0,.7))}
.zoomcard .flipper{width:100%;height:100%}
.zoomcard .face{box-shadow:0 0 0 3px #e9d8ff inset}
.zoomcard .face.back{box-shadow:0 0 0 3px var(--boro) inset}
.zoomwho{font-size:15px;color:var(--ink);letter-spacing:.08em;opacity:0;transition:opacity .3s .3s}
.zoom.in .zoomwho{opacity:1}
.flipper.go{transform:rotateY(180deg)}
.flipper .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipper .face img{width:100%;height:100%;display:block}
.flipper .face.back{transform:rotateY(180deg)}
.flipper.go .face.back{box-shadow:0 0 0 2px var(--boro) inset}
.ccard.flipcard .lbl{display:none}

/* ---------- trigger cutscene ---------- */
.cut{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(10,4,14,.74);animation:cutin .25s ease-out;cursor:pointer;padding:16px}
.cut.out{animation:cutout .3s ease-in forwards}
@keyframes cutin{from{opacity:0}to{opacity:1}}
@keyframes cutout{to{opacity:0}}
.cut .rays{position:absolute;left:50%;top:50%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,95,168,.28) 0 9deg,transparent 9deg 22deg);-webkit-mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 25%,transparent 55%);mask:radial-gradient(circle,#000 0,rgba(0,0,0,.5) 25%,transparent 55%);animation:spin 9s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.cut.dud .rays{display:none}
.cutbox{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;max-width:min(560px,100%)}
.cutwho{font-size:15px;color:var(--ink);letter-spacing:.08em;animation:rise .4s ease-out both}
.cutlabel{font-size:clamp(30px,6vw,52px);color:var(--gold);letter-spacing:.3em;text-shadow:0 0 14px rgba(255,209,102,.9),0 4px 0 #6b4a00;animation:slam .5s cubic-bezier(.2,1.6,.4,1) both;animation-delay:.1s}
.cut.dud .cutlabel{color:var(--dim);text-shadow:none;letter-spacing:.15em}
.cutcard{width:min(440px,100%);padding:14px 18px 16px;background:#2b3148;color:#e6ecff;box-shadow:0 0 0 3px #8090d8 inset,0 0 40px rgba(127,193,255,.55),0 20px 50px rgba(0,0,0,.6);animation:popin .6s cubic-bezier(.2,1.5,.4,1) both;animation-delay:.2s}
.cutcard .tn{font-size:clamp(22px,4.5vw,32px);color:#fff;letter-spacing:.1em;margin-bottom:8px}
.cutcard .tt{font-size:15px;line-height:1.7}
.cut.dud .cutcard{background:#2a2a36;box-shadow:0 0 0 3px #4a4a5c inset,0 20px 50px rgba(0,0,0,.6);color:#9a9aa8}
.cuthint{font-size:11px;color:var(--dim);animation:rise .4s ease-out both;animation-delay:.6s}
/* 脱落 */
.cut.lose{background:rgba(6,2,10,.86)}
.cut.lose .cutbox{gap:8px}
.losefig{animation:losein .6s cubic-bezier(.2,.9,.3,1) both}
.losefig .figure{--cw:min(60vw, 36vh)}
.losefig .ccard{box-shadow:0 0 0 3px var(--boro) inset,0 18px 40px rgba(0,0,0,.7)}
@keyframes losein{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
.cut.lose .cutlabel{color:#aeb6d8;text-shadow:0 0 14px rgba(140,150,210,.7),0 4px 0 #1a1c33;letter-spacing:.35em;animation-delay:.55s}

<script>
'use strict';
/* =====================================================================
 *  データ：役職（ガキカード）・アクション・トリガー・キャラ
 *  台詞やカード名は早見表のもの。トリガー名は仮置き（早見表では空欄）。
 * ===================================================================== */
const ROLES = {
  mesugaki:   { id:'mesugaki',   name:'メスガキ',       action:'tax',         blocks:['aid'],         line:'は？弱くないが？',     phrase:'ざぁこ♡',                      color:'#ff5fa8', value:5 },
  kouhai:     { id:'kouhai',     name:'後輩ガキ',       action:'steal',       blocks:['steal'],       line:'は？情けなくないが？', phrase:'なっさけな〜い♡',              color:'#ff9f43', value:3 },
  osananajimi:{ id:'osananajimi',name:'幼馴染ガキ',     action:'exchange',    blocks:['steal'],       line:'は？情けなくないが？', phrase:'わからされちゃう〜怖いよ〜♡(棒読み)', color:'#3fb67a', value:2 },
  succu:      { id:'succu',      name:'サキュガキ',     action:'assassinate', blocks:[],              line:'は？負けないが？',     phrase:'負けちゃえ〜♡',                color:'#9b6bff', value:4 },
  ojisan:     { id:'ojisan',     name:'わからせおじさん', action:null,        blocks:['assassinate'], line:'は？負けさせないが？', phrase:'変態♡',                        color:'#5f7d99', value:3 },
};
const ROLE_IDS = Object.keys(ROLES);

const ACTIONS = {
  income:      { id:'income',      name:'ふ～ん♥',     desc:'1♥を獲得する' },
  aid:         { id:'aid',         name:'よわ♥',       desc:'2♥を獲得する', blockedBy:['mesugaki'] },
  coup:        { id:'coup',        name:'ざぁ～こ♥',   desc:'7♥を支払い、相手1人のプライドを失わせる', target:true },
  tax:         { id:'tax',         name:'よわよわ～♥', role:'mesugaki',    desc:'3♥を獲得する' },
  steal:       { id:'steal',       name:'なさけな～い♥', role:'kouhai',    desc:'他プレイヤー1人から2♥を奪う', target:true, blockedBy:['kouhai','osananajimi'] },
  exchange:    { id:'exchange',    name:'ダサすぎ♥',   role:'osananajimi', desc:'山札から2枚引き、手札から2枚戻す' },
  assassinate: { id:'assassinate', name:'まけちゃえ～♥', role:'succu',     desc:'3♥を支払い、相手1人のプライドを1枚失わせる', target:true, cost:3, blockedBy:['ojisan'] },
};

const RULES = {
  peekOwnTriggers: true,   // 自分のトリガーは自分だけ見える
  triggerDeal: 2,          // 開始時に配るトリガー枚数。2ならそのまま上下に仕込む（3以上なら選んで残りを山へ）
  attackerChoosesFlip: true, // プライドを失わせた側が、どちらを脱がせるか選ぶ
  collectorGoal: 9,        // ♥コレクターの勝利条件
  punishCost: 5,           // おしおき返しの即時ざぁ～こ♥のコスト
  win15LiftsForcedCoup: true, // ♥コレクター所持者は10♥の強制ざぁ～こ♥を免除（目標を10♥より上にしたとき用）
  coupCost: 7,
  dudCount: 0,             // ハズレ（効果なし）トリガーの枚数（0で使わない）
  coupCostTaxed: 8,
  forcedCoupAt: 10,
};

function figureEl(ch, boro, size, withLabel, halves){
  const wrap=document.createElement('div'); wrap.className='figure '+(size||'md');

    const card=document.createElement('div'); card.className='ccard'+(boro[half]?' boro':'');

    if(withLabel){ const l=document.createElement('span'); l.className='lbl'; l.textContent=(half==='top'?'上':'下')+(boro[half]?' ボロ':''); card.appendChild(l); }
    wrap.appendChild(card);

/* =====================================================================
 *  ゲーム状態・進行

const S = { players:[], deck:[], turn:0, flags:{}, winner:null, log:[], speed:1, current:null, target:null, gameId:0, playable:null, targetable:null, headless:false };
class GameReset extends Error {}
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
async function wait(ms){ const g=S.gameId; if(S.headless) await Promise.resolve(); else await sleep(ms*S.speed); if(g!==S.gameId) throw new GameReset(); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const rnd = n => Math.floor(Math.random()*n);
const pick = a => a[rnd(a.length)];
const chance = p => Math.random()<p;

const alive = () => S.players.filter(p=>p.alive);
const othersOf = p => S.players.filter(q=>q.alive && q!==p);
function orderFrom(p){ const n=S.players.length, out=[]; for(let k=1;k<n;k++){ const q=S.players[(p.i+k)%n]; if(q.alive) out.push(q); } return out; }
function coupCost(p){ const taxed=S.players.some(q=>q!==p && q.alive && q.flags.coupTax); return RULES.coupCost + (taxed?RULES.coupCostTaxed-RULES.coupCost:0) - (p.flags.coupDiscount?2:0); }
const hasRole = (p,r) => p.hand.some(c=>c.role===r);
function drawCard(){ return { role:S.deck.pop(), faceUp:false }; }
// みちづれのキスなどで p だけがこっそり見たカードか
function seenBy(c,p){ return !!(c.seenBy && c.seenBy.includes(p.i)); }
function returnToDeck(role){ S.deck.push(role); shuffle(S.deck); }
const rname = r => ROLES[r].name;
const half = k => k==='top'?'上半身':'下半身';

function log(text, cls){ S.log.push({text, cls:cls||''}); if(!S.headless) renderLog(); }

function newGame(n, myChar, opts){
  opts = opts===true ? {auto:true} : (opts||{});
  const auto=opts.auto;
  S.gameId++;
  if(S.rejectPrompt){ S.rejectPrompt(new GameReset()); S.rejectPrompt=null; }
  const deck=[]; for(const r of ROLE_IDS) for(let k=0;k<3;k++) deck.push(r); shuffle(deck);
  const tdeck=[]; (opts.deckIds||DECK.ids).forEach((id,k)=>{ const t=TRIGGERS.find(x=>x.id===id); if(t) tdeck.push({...t, copy:k}); });
  for(let k=0;k<RULES.dudCount;k++) tdeck.push({...NO_TRIGGER, copy:k}); shuffle(tdeck);
  const others=shuffle(CHARS.map((_,i)=>i).filter(i=>i!==myChar));
  S.players=[];
  for(let i=0;i<n;i++){
    const ch=CHARS[i===0?myChar:others[i-1]];
    S.players.push({ i, name:i===0?`${ch.name}（あなた）`:ch.name, cpu:i>0, ch, hearts:2,
      hand:[{role:deck.pop(),faceUp:false},{role:deck.pop(),faceUp:false}], lost:[],
      boro:{top:false,bottom:false}, triggers:{top:{card:null,revealed:false},bottom:{card:null,revealed:false}}, trigHand:[],
      flags:{}, alive:true, bluffsCaught:0, claims:0 });
  }
  const deal=Math.max(2, Math.min(RULES.triggerDeal, Math.floor(tdeck.length/n)));
  for(const p of S.players) for(let k=0;k<deal;k++) p.trigHand.push(tdeck.pop());
  S.tdeck=tdeck; S.setupDone=false;
  if(auto){ S.players[0].cpu=true; S.players[0].name=`${S.players[0].ch.name}（おまかせ）`; }
  S.deck=deck; S.turn=rnd(n); S.flags={}; S.winner=null; S.log=[]; S.current=null; S.target=null; S.acts=[]; S.deaths=0;
  TUT.active=false; S.playable=null; S.targetable=null; S.action=null;
  if(opts.tutorial) tutSetup();
  if(!S.headless){ setHighlight(null); document.querySelectorAll('#cut,.cutin').forEach(e=>e.remove()); $('#modalEnd').classList.remove('show'); render(); }
  return runGame();
}

async function runGame(){
  const gid=S.gameId;
  try{
    log(`ゲーム開始！ ${S.players[S.turn].name} からスタート`, 'sys');
    await setupTriggers();
    await tutHook('start');
    let guard=0;
    while(!S.winner){
      const p=S.players[S.turn];
      if(p.alive){
        if(p.flags.skipTurns>0){ p.flags.skipTurns--; S.current=p; log(`${p.name} は手番を飛ばされた`, 'sys'); render(); await wait(500); }
        else await takeTurn(p);
      }
      if(gid!==S.gameId) return;
      const w=checkWin(); if(w){ S.winner=w; break; }
      S.turn=(S.turn+1)%S.players.length;
      if(++guard>4000){ // 万一の無限ループ保険：♥と手札で決める
        S.winner=alive().sort((x,y)=>(y.hand.length-x.hand.length)||(y.hearts-x.hearts))[0]||S.players[0]; log('長引いたので打ち切り', 'sys'); break;
      }
    }
    await endGame();
  }catch(e){ if(!(e instanceof GameReset)) console.error(e); }
}

// ♥コレクターの目標が強制ざぁ～こ♥のラインより上のときだけ「免除」を案内する
function liftNote(){ return (RULES.win15LiftsForcedCoup && RULES.collectorGoal>RULES.forcedCoupAt) ? `（${RULES.forcedCoupAt}♥の強制ざぁ～こ♥も免除）` : ''; }
function checkWin(){
  const a=alive();
  if(a.length===1) return a[0];
  if(a.length===0){ // 同時に全滅（おしおき返しの相打ちなど）：最後に脱落した人の勝ち
    return S.players.slice().sort((x,y)=>(y.deadAt||0)-(x.deadAt||0))[0];
  }
  return a.find(p=>p.flags.win15 && p.hearts>=RULES.collectorGoal) || null;
}

// act の対象にできる相手（かくれんぼ中の相手は ざぁ～こ♥・まけちゃえ～♥ の対象外）
function targetsFor(p, act){ return othersOf(p).filter(q=>q.alive && q.hand.length>0 && !(q.flags.hidden && (act==='coup'||act==='assassinate'))); }
// ボディガード：狙われた側に、使った側が追加で2♥払う
function bodyguardFee(p, target){
  if(!target || target===p || !target.flags.bodyguard) return;
  const n=Math.min(2, p.hearts); if(!n) return;
  p.hearts-=n; target.hearts+=n; SFX.play('coin');
  log(`${target.name} のボディガード：${p.name} は追加で${n}♥払った`); render();
}
async function takeTurn(p){
  S.current=p; S.target=null;
  if(p.flags.hidden){ delete p.flags.hidden; log(`${p.name} の「かくれんぼ」が終わった`, 'sys'); }
  render();
  const forced = p.hearts>=RULES.forcedCoupAt && !(RULES.win15LiftsForcedCoup && p.flags.win15) && targetsFor(p,'coup').length>0;
  let choice;
  if(p.cpu){ await tutHook('cpuTurn'); setIdle(`${p.name} の番…`); await wait(800); choice=cpuChooseAction(p, forced); }
  else choice=await humanChooseAction(p, forced);
  await performAction(p, choice.action, choice.target);
}

async function performAction(p, act, target){
  setAction({actor:p, act, target, phase:'declare'});
  try{ await performActionInner(p, act, target); }
  finally{ setAction(null); }
}
async function performActionInner(p, act, target){
  const A=ACTIONS[act];
  S.target=target||null;
  if(A.role) p.claims++;
  SFX.play(act==='coup'?'boom':'pop');
  say(p, A.name);
  log(`${p.name}「${A.name}」${target?` → ${target.name}`:''}${A.role?`（${rname(A.role)}を主張）`:''}`, p.cpu?'':'me');
  render(); await wait(700);
  // 無敵宣言（次の1アクション）／復讐の誓い（脱がせた相手へのアクション）：チャレンジもブロックもなし
  let free=false;
  if(p.flags.noContest){ delete p.flags.noContest; free=true; log(`${p.name} の「無敵宣言」：このアクションはチャレンジもブロックもされない`, 'sys'); }
  else if(target && p.flags.vengeance===target.i){ free=true; log(`${p.name} の「復讐の誓い」：${target.name} へのアクションはチャレンジもブロックもされない`, 'sys'); }

  if(act==='coup'){
    const cost=coupCost(p); p.hearts-=cost; render();
    bodyguardFee(p, target);
    await cutin(p, target);
    await loseInfluence(target, p, 'ざぁ～こ♥');
    return;
  }
  if(act==='assassinate'){ p.hearts-=A.cost; render(); }
  if(act==='assassinate' || act==='steal') bodyguardFee(p, target);

  if(A.role && !free){
    const ok=await challengeWindow(p, A.role, {kind:'action', action:act, target}, orderFrom(p));
    if(!ok) return;
    if(!p.alive) return;
    if(target && !target.alive) return;
  }
  const blocked = free ? false : await blockWindow(p, act, target);
  if(blocked) return;
  if(!p.alive) return;
  if(target && !target.alive) return;

  switch(act){
    case 'income': p.hearts+=1; SFX.play('coin'); log(`${p.name} は1♥獲得`); break;
    case 'aid': p.hearts+=2; SFX.play('coin'); log(`${p.name} は2♥獲得`); break;
    case 'tax': p.hearts+=3; SFX.play('coin'); log(`${p.name} は3♥獲得`); break;
    case 'steal': { const n=Math.min(2,target.hearts); target.hearts-=n; p.hearts+=n; SFX.play('coin'); log(`${p.name} は ${target.name} から${n}♥奪った`); break; }
    case 'exchange': if(target) await doExamine(p,target); else await doExchange(p); break; // 相手を指定していれば審問（ルール改変持ちのみ）
    case 'assassinate': await loseInfluence(target, p, 'まけちゃえ～♥'); break;
  }
  render(); await wait(500);
}

/* ---- 開始時：配られたトリガーから2枚選び、上半身・下半身に仕込む ---- */
async function setupTriggers(){
  if(S.setupDone) return;
  for(const p of S.players){
    if(p.trigHand.length<2) continue;
    let top, bottom;
    if(p.cpu){ [top,bottom]=cpuPlaceTriggers(p); }
    else { [top,bottom]=await humanPlaceTriggers(p); }
    p.triggers.top={card:top,revealed:false}; p.triggers.bottom={card:bottom,revealed:false};
    const rest=p.trigHand.filter(c=>c!==top&&c!==bottom); S.tdeck.push(...rest); p.trigHand=[];
    render();
  }
  shuffle(S.tdeck);
  S.setupDone=true;
  log('全員がトリガーを仕込んだ', 'sys');
}
function cpuPlaceTriggers(p){
  const sorted=p.trigHand.slice().sort((a,b)=>triggerValue(p,b)-triggerValue(p,a));
  const keep=sorted.slice(0,2); return chance(0.5)?keep:[keep[1],keep[0]];
}
async function humanPlaceTriggers(p){
  const cardEl=c=>{ const el=triggerEl({card:c,revealed:true},'on',false); el.style.width='190px'; el.style.minHeight='84px'; return el; };
  const top=await askCards(p.trigHand.length>2?`トリガーを仕込みます。${p.trigHand.length}枚のうち2枚を使います。まず「上半身」の横に置くカードを選んでください`:'トリガーを仕込みます。配られた2枚を上半身・下半身に1枚ずつ伏せます。まず「上半身」の横に置くカードを選んでください', p.trigHand.map(c=>({el:cardEl(c), value:c})), p.trigHand.length>2?`残りの${p.trigHand.length-2}枚は山に戻ります（相手には見えません）`:'どちらを先に脱がされるかで発動順が変わります（相手には見えません）', undefined, 'placeTrigger');
  const rest=p.trigHand.filter(c=>c!==top);
  const bottom = rest.length===1 ? rest[0] : await askCards('次に「下半身」の横に置くカードを選んでください', rest.map(c=>({el:cardEl(c), value:c})), `上半身：${top.name}`, undefined, 'placeTrigger');
  return [top,bottom];
}

// 山分け：自分より♥の多い相手から1♥ずつもらう（♥コレクター公開時にも使う）
function shareUp(p){ let got=0; for(const q of othersOf(p)) if(q.hearts>p.hearts+got && q.hearts>0){ q.hearts--; got++; } p.hearts+=got; if(got) SFX.play('coin'); return got; }
// 遺言の渡し先：脱がせてきた相手以外で、いちばん弱い相手
function cpuBequeath(p,cands,by){ const pool=cands.filter(q=>q!==by); return (pool.length?pool:cands).slice().sort((a,b)=>threatScore(p,a)-threatScore(p,b))[0]; }

/* ---- チャレンジ ---- */
async function challengeWindow(claimant, role, what, candidates){
  for(const c of candidates){
    if(!c.alive || c===claimant) continue;
    let ch;
    if(c.cpu){ await wait(350); ch=cpuChallenge(c, claimant, role, what); }
    else ch=await humanChallenge(c, claimant, role, what);
    if(ch){
      const prev=S.action&&S.action.phase;
      if(S.action){ S.action.phase = what.kind==='block'?'blockchallenge':'challenge'; S.action.challenger=c; renderAction(); }
      const r=await resolveChallenge(claimant, c, role);
      if(S.action){ S.action.phase = what.kind==='block'?'block':'declare'; S.action.challenger=null; renderAction(); }
      return r;
    }
  }
  return true;
}
async function resolveChallenge(claimant, challenger, role){
  SFX.play('sting');
  say(challenger, 'チャレンジ！');
  log(`${challenger.name}「チャレンジ！」 ${claimant.name} の ${rname(role)} を疑う`, challenger.cpu?'':'me');
  render(); await wait(800);
  const idx=claimant.hand.findIndex(c=>c.role===role);
  if(idx>=0){
    SFX.play('chime');
    say(claimant, ROLES[role].phrase);
    log(`${claimant.name} は ${rname(role)} を公開！「${ROLES[role].phrase}」 公開したカードは山札に戻し、1枚引き直す`);
    returnToDeck(role); claimant.hand[idx]=drawCard(); markFresh(claimant.hand[idx]);
    render();
    await fxSwap(claimant, role, `${claimant.name} は ${rname(role)} を公開！`, '本物だった', true);
    render(); await wait(300);
    await loseInfluence(challenger, claimant, 'チャレンジ失敗');
    return true;
  } else {
    claimant.bluffsCaught++;
    if(challenger.flags.bounty){ challenger.hearts+=2; SFX.play('coin'); log(`${challenger.name} はチャレンジ成功の「ごほうび」で2♥もらった`); }
    log(`${claimant.name} は ${rname(role)} を持っていなかった！ハッタリ失敗`, 'hurt');
    render();
    await fxBluff(claimant, challenger, role);
    await loseInfluence(claimant, challenger, 'ハッタリ失敗');
    return false;
  }
}

/* ---- ブロック ---- */
function blockOptions(c, actor, act, target){
  const A=ACTIONS[act], opts=[];
  if(c===actor || !c.alive) return opts;
  if(act==='aid' && actor.flags.aidUnblockable) return opts;   // 人気者
  let roles=A.blockedBy||[];
  if(act==='exchange') roles=target?['osananajimi']:[];
  const canRole = A.target||act==='exchange' ? c===target : true;
  if(canRole) for(const r of roles) opts.push({kind:'role', role:r});
  if(act==='exchange' && c.flags.blockExchange) opts.push({kind:'trigger'});
  return opts;
}
async function blockWindow(actor, act, target){
  for(const c of orderFrom(actor)){
    const opts=blockOptions(c, actor, act, target);
    if(!opts.length) continue;
    let d;
    if(c.cpu){ await wait(350); d=cpuBlock(c, actor, act, opts); }
    else d=await humanBlock(c, actor, act, opts, target);
    if(!d) continue;
    if(d.kind==='trigger'){
      SFX.play('buzz');
      if(S.action){ S.action.phase='block'; S.action.blocker=c; S.action.blockRole=null; renderAction(); }
      say(c, 'は？ダサくないが？');
      log(`${c.name} はトリガー「ダサすぎ返し」で「${ACTIONS[act].name}」をブロック！（公開済みなのでチャレンジ不可）`, c.cpu?'':'me');
      render(); await wait(700); return true;
    }
    SFX.play('buzz');
    if(S.action){ S.action.phase='block'; S.action.blocker=c; S.action.blockRole=d.role; renderAction(); }
    say(c, ROLES[d.role].line);
    log(`${c.name}「${ROLES[d.role].line}」（${rname(d.role)} でブロック）`, c.cpu?'':'me');
    c.claims++;
    render(); await wait(700);
    const cands=[actor, ...orderFrom(c).filter(q=>q!==actor)];
    const ok=await challengeWindow(c, d.role, {kind:'block', action:act, target, actor}, cands);
    if(ok){ log(`「${ACTIONS[act].name}」はブロックされた`); return true; }
    log(`ブロック失敗！「${ACTIONS[act].name}」は通る`);
    return false;
  }
  return false;
}

/* ---- プライドを失う：手札を1枚失い、服を1枚裏返し、トリガー発動 ---- */
async function loseInfluence(p, by, reason){
  if(!p.alive || p.hand.length===0) return;
  let idx=0;
  if(p.hand.length>1) idx = p.cpu ? cpuLoseCard(p) : await humanLoseCard(p, reason);
  const [card]=p.hand.splice(idx,1); p.lost.push(card.role);
  SFX.play('hit');
  say(p, '……っ！');
  log(`${p.name} は ${rname(card.role)} を失った（${reason}）`, 'hurt');
  fxHit(p); await wait(850);

  const avail=['top','bottom'].filter(k=>!p.boro[k]);
  if(avail.length){
    let k=avail[0];
    if(avail.length>1){
      const chooser = (RULES.attackerChoosesFlip && by && by!==p && by.alive) ? by : p;
      if(chooser===p) k = p.cpu ? cpuFlip(p) : await humanFlip(p);
      else { k = chooser.cpu ? cpuFlipOther(chooser,p) : await humanFlipOther(chooser,p); log(`${chooser.name} は ${p.name} の${half(k)}を脱がせた`, chooser.cpu?'':'me'); }
    }
    const t=p.triggers[k];
    SFX.play('tick');
    await fxFlipCard(p,k);
    p.boro[k]=true; t.revealed=true;
    log(`${p.name} の${half(k)}がボロボロに… トリガー「${t.card.name}」：${t.card.text}`, 'sys');
    render(); fxTrigGlow(p,k);
    const before=p.hand.length;
    await cutscene(p, k, t.card);
    await resolveTrigger(p, t.card, by);
    if(S.headless) S.acts.push({i:p.i, id:t.card.id, left:before, after:p.hand.length, by:by?by.i:-1});
  } else {
    log(`${p.name} はもう脱ぐ服が残っていない`, 'sys'); await wait(300);
  }
  if(p.hand.length===0){ p.alive=false; p.deadAt=++S.deaths; SFX.play('down'); log(`${p.name} は脱落…`, 'hurt'); render(); await fxEliminated(p); }
  render();
}

async function resolveTrigger(p, card, by){
  switch(card.id){
    case 't1': {
      if(p.hearts<RULES.punishCost){ log(`${p.name} は${RULES.punishCost}♥持っていないので不発`); return; }
      const cands=othersOf(p).filter(q=>q.hand.length>0);
      if(!cands.length) return;
      const target = p.cpu ? cpuThreat(p,cands) : await humanPickPlayer(p, cands, `${RULES.punishCost}♥払って即時「ざぁ～こ♥」！ 相手を選んでください`);
      p.hearts-=RULES.punishCost; say(p,'ざぁ～こ♥');
      log(`${p.name} は${RULES.punishCost}♥払って即時「ざぁ～こ♥」 → ${target.name}`, p.cpu?'':'me');
      const prevAction=S.action; setAction({actor:p, act:'coup', target, phase:'declare'});
      render(); await wait(400);
      await cutin(p, target);
      try{ await loseInfluence(target, p, 'おしおき返し'); } finally { setAction(prevAction); }
      return;
    }
    case 't2': {
      if(!p.hand.length) return;
      let res;
      if(p.cpu) res=cpuDeckSwap(p); else res=await humanDeckSwap(p);
      if(!res){ shuffle(S.deck); log(`${p.name} は山札を見たが入れ替えなかった`); return; }
      const old=p.hand[res.hand].role;
      p.hand[res.hand]={role:S.deck[res.deck], faceUp:false};
      S.deck[res.deck]=old; shuffle(S.deck);
      log(`${p.name} は山札を見て手札を1枚入れ替えた`);
      return;
    }
    case 't3': p.flags.blockExchange=true; log(`${p.name} は以後「ダサすぎ♥」をブロックできる`); return;
    case 't4': {
      const cands=othersOf(p).filter(q=>q.hand.length>0);
      if(!cands.length) return;
      const t = p.cpu ? cpuThreat(p,cands) : await humanPickPlayer(p, cands, '手札を表にさせる相手を選んでください');
      for(const c of t.hand) c.faceUp=true;
      log(`${t.name} の手札が表になった：${t.hand.map(c=>rname(c.role)).join('・')}`, 'sys');
      return;
    }
    case 't5': {
      if(!p.hand.length){ log(`${p.name} はプライドが残っていないので「総入れ替え」は不発`); return; }
      const parts=S.players.filter(q=>q.alive && q.hand.length>0);
      if(parts.length<2){ log(`相手がいないので不発`); return; }
      // 1) 全員（自分も）が手札を1枚伏せて出す
      const pool=[];
      for(const q of parts){
        let idx=0;
        if(q.hand.length>1) idx = q.cpu ? cpuLoseCard(q) : await humanPickCard(q, q===p ? '総入れ替え：自分も1枚伏せて出します。出すカードを選んでください' : `${p.name} の「総入れ替え」：伏せて出すカードを選んでください（${p.name} だけが全部見て1枚もらいます）`);
        const [c]=q.hand.splice(idx,1); pool.push({c, from:q});
      }
      log(`${p.name}「総入れ替え」：全員が手札を1枚伏せて出した`, 'sys');
      if(!S.headless) render();
      // 2) 持ち主だけが全部見て、欲しい1枚をもらう
      let take;
      if(p.cpu) take = pool.slice().sort((a,b)=>(ROLES[b.c.role].value-ROLES[a.c.role].value)||(Math.random()-0.5))[0];
      else take = await askCards('出されたカードを全部見られます。もらうカードを1枚選んでください', pool.map(e=>{ const el=document.createElement('div'); el.className='pooled'; el.appendChild(roleCardEl(e.c.role)); const cap=document.createElement('div'); cap.className='pfrom'; cap.textContent=e.from===p?'自分が出した':`${e.from.name} が出した`; el.appendChild(cap); return {el, value:e}; }), '残りはランダムに1枚ずつ配り戻します', undefined, 'poolPick');
      p.hand.push(take.c); markFresh(take.c);
      // 3) 残りはシャッフルして、自分以外に1枚ずつ戻す
      const rest=pool.filter(e=>e!==take).map(e=>e.c); shuffle(rest);
      parts.filter(q=>q!==p).forEach((q,i)=>{ const c=rest[i]; c.faceUp=false; delete c.seenBy; q.hand.push(c); markFresh(c); });
      SFX.play('chime');
      if(p.cpu) log(`${p.name} は1枚選んでもらい、残りをランダムに配り戻した`);
      else log(`「${rname(take.c.role)}」をもらった。残りはランダムに配り戻した（出されたのは ${pool.map(e=>`${e.from===p?'自分':e.from.name}：${rname(e.c.role)}`).join('、')}）`, 'me');
      return;
    }
    case 't6': {
      let got=0; for(const q of othersOf(p)) if(q.hearts>0){ q.hearts--; got++; }
      p.hearts+=got; log(`${p.name} は全員から1♥ずつもらった（+${got}♥）`);
      return;
    }
    case 't7': {
      const parts=alive().filter(q=>q.hand.length>0);
      if(parts.length<2) return;
      const chosen=[];
      for(const q of parts){ chosen.push(q.cpu ? cpuPassCard(q) : await humanPickCard(q, '右隣に渡すカードを選んでください')); }
      const moving=parts.map((q,i)=>q.hand.splice(chosen[i],1)[0]);
      parts.forEach((q,i)=>{ const to=parts[(i+1)%parts.length]; to.hand.push(moving[i]); });
      log(`全員が手札を1枚、右隣に渡した`, 'sys');
      const me=S.players[0]; if(me.alive && parts.includes(me)) log(`あなたが受け取ったカード：${rname(moving[(parts.indexOf(me)-1+parts.length)%parts.length].role)}`, 'me');
      return;
    }
    case 't8': p.flags.coupTax=true; log(`${p.name} 以外は「ざぁ～こ♥」に8♥必要になった`); return;
    case 't9': { p.flags.win15=true; const got=shareUp(p); log(`${p.name} は${RULES.collectorGoal}♥集めても勝利になった${liftNote()}。♥の多い相手から1♥ずつもらった（+${got}♥）`); return; }
    case 't10': p.flags.examine=true; log(`${p.name} の「ダサすぎ♥」は、通常か審問（相手の手札1枚を見て山札と交換させる）かを選べるようになった。審問は幼馴染ガキでブロック可`, 'sys'); return;
    case 't11': {
      if(!by || by===p || !by.hand.length){ log(`脱がせた相手がいないので不発`); return; }
      const hidden=by.hand.filter(c=>!c.faceUp && !seenBy(c,p));
      if(!hidden.length){ log(`${by.name} の手札はもう全部知っている`); return; }
      const c=pick(hidden); (c.seenBy||(c.seenBy=[])).push(p.i);
      if(p.cpu) log(`${p.name} は ${by.name} の手札を1枚こっそり見た`);
      else log(`${by.name} の手札「${rname(c.role)}」をこっそり見た（あなただけ見える）`, 'me');
      return;
    }
    case 't12': {
      if(!by || by===p){ log(`脱がせた相手がいないので不発`); return; }
      const n=Math.min(3, by.hearts); by.hearts-=n; p.hearts+=n; if(n) SFX.play('coin');
      log(`${p.name} は ${by.name} から${n}♥奪い返した`);
      return;
    }
    case 't15': {
      if(p.hand.length>0){ log(`${p.name} はまだプライドが残っているので「遺言」は不発`); return; }
      const cands=othersOf(p).filter(q=>q.alive);
      if(!p.hearts || !cands.length){ log(`${p.name} は渡す♥がないので不発`); return; }
      const target = p.cpu ? cpuBequeath(p,cands,by) : await humanPickPlayer(p, cands, `遺言：${p.hearts}♥をすべて渡す相手を選んでください`);
      const n=p.hearts; target.hearts+=n; p.hearts=0; SFX.play('coin');
      log(`${p.name} は遺言で ${target.name} に${n}♥すべて渡した`, p.cpu?'':'me');
      return;
    }
    case 't17': {
      if(!by || by===p){ log(`脱がせた相手がいないので不発`); return; }
      const hidden=['top','bottom'].filter(k=>by.triggers[k] && !by.triggers[k].revealed && !(by.triggers[k].seenBy||[]).includes(p.i));
      if(!hidden.length){ log(`${by.name} の伏せたトリガーはもう無い（または確認済み）`); return; }
      let k=hidden[0];
      if(hidden.length>1) k = p.cpu ? pick(hidden) : await askButtons(`トリガーチェック：${by.name} のどちらのトリガーをこっそり見ますか？`, hidden.map(h=>({label:`${half(h)}のトリガー`, value:h})), undefined, 'peekTrigger');
      const t=by.triggers[k]; (t.seenBy||(t.seenBy=[])).push(p.i);
      if(p.cpu) log(`${p.name} は ${by.name} のトリガーを1枚こっそり見た`);
      else log(`${by.name} の${half(k)}のトリガーは「${t.card.name}」（あなただけ見える）`, 'me');
      if(!S.headless) render();
      return;
    }
    case 't16': {
      if(p.hand.length>0){ log(`${p.name} はまだプライドが残っているので「着替え」は不発`); return; }
      if(!S.deck.length){ log(`山札がないので「着替え」は不発`); return; }
      const c=drawCard(); p.hand.push(c); markFresh(c); SFX.play('chime');
      const lost=p.hearts; p.hearts=0; p.flags.skipTurns=(p.flags.skipTurns||0)+1;
      say(p, 'まだ終わってないし♥');
      log(`${p.name} は着替えて立ち直った！ 山札から1枚引いてプライド1で続行${lost?`（♥${lost}はすべて失った）`:''}。次の手番は1回飛ばす`, p.cpu?'sys':'me');
      return;
    }
    case 't18': p.flags.hidden=true; log(`${p.name} は次の手番まで「ざぁ～こ♥」「まけちゃえ～♥」の対象にならない（かくれんぼ）`); return;
    case 't19': p.flags.noContest=true; log(`${p.name} の次の手番のアクションは、チャレンジもブロックもされない（無敵宣言）`); return;
    case 't20': {
      if(!by || by===p || !by.alive){ log(`脱がせた相手がいないので不発`); return; }
      by.flags.skipTurns=(by.flags.skipTurns||0)+1; log(`${by.name} は次の手番を1回飛ばす（口止め料）`); return;
    }
    case 't21': {
      const others=othersOf(p).filter(q=>q.alive);
      if(!others.length){ log('相手がいないので不発'); return; }
      let got=0; const seen=[];
      for(const q of others){
        const canPay=q.hearts>=1, showable=q.hand.map((c,i)=>i).filter(i=>!q.hand[i].faceUp && !seenBy(q.hand[i],p));
        if(!canPay && !showable.length) continue;
        let pay;
        if(!canPay) pay=false; else if(!showable.length) pay=true;
        else if(q.cpu) pay = q.hearts>=3 || chance(0.4);
        else pay = await askButtons(`${p.name} の「おねだり」：1♥渡すか、手札1枚をこっそり見せるかを選んでください`, [{label:'1♥渡す', value:true, primary:true},{label:'手札を1枚見せる', value:false}], undefined, 'onedari');
        if(pay){ q.hearts--; got++; }
        else {
          const idx = showable.length===1 ? showable[0] : (q.cpu ? (showable.includes(cpuLoseCard(q)) ? cpuLoseCard(q) : showable[0]) : await humanPickCard(q, `${p.name} に見せるカードを選んでください（おねだり）`));
          const c=q.hand[idx]; (c.seenBy||(c.seenBy=[])).push(p.i); seen.push(`${q.name}：${rname(c.role)}`);
        }
      }
      p.hearts+=got; if(got) SFX.play('coin');
      log(`${p.name} の「おねだり」：${got}♥もらい、${seen.length}人が手札を1枚見せた`);
      if(seen.length && !p.cpu) log(`見せてもらった手札：${seen.join('、')}（あなただけ見える）`, 'me');
      if(!S.headless) render();
      return;
    }
    case 't22': p.flags.bodyguard=true; log(`${p.name} を狙う ざぁ～こ♥・まけちゃえ～♥・なさけな～い♥ は、使った人が追加で2♥を ${p.name} に払うようになった（ボディガード）`); return;
    case 't23': p.flags.aidUnblockable=true; log(`${p.name} の「よわ♥」はブロックされなくなった（人気者）`); return;
    case 't24': {
      if(!by || by===p){ log(`脱がせた相手がいないので不発`); return; }
      p.flags.vengeance=by.i; log(`${p.name} の ${by.name} へのアクションは、チャレンジもブロックもされなくなった（復讐の誓い）`); return;
    }
    case 't25': p.flags.bounty=true; log(`${p.name} はチャレンジに成功するたびに2♥もらえるようになった（ごほうび）`); return;
    case 't26': {
      const cands=othersOf(p).filter(q=>q.alive && q.hand.length>0);
      if(!cands.length){ log('相手がいないので不発'); return; }
      const q = p.cpu ? cpuThreat(p,cands) : await humanPickPlayer(p, cands, '内緒話：手札を見せ合う相手を選んでください');
      const qi = q.hand.length===1 ? 0 : (q.cpu ? cpuLoseCard(q) : await humanPickCard(q, `${p.name} に見せるカードを選んでください（内緒話）`));
      const qc=q.hand[qi]; (qc.seenBy||(qc.seenBy=[])).push(p.i);
      let pc=null;
      if(p.hand.length){ const pi = p.hand.length===1 ? 0 : (p.cpu ? cpuLoseCard(p) : await humanPickCard(p, `${q.name} に見せるカードを選んでください（内緒話）`)); pc=p.hand[pi]; (pc.seenBy||(pc.seenBy=[])).push(q.i); }
      log(`${p.name} と ${q.name} が内緒話で手札を1枚ずつ見せ合った${pc?'':`（${p.name} は見せる手札がない）`}`);
      if(!p.cpu) log(`${q.name} の手札「${rname(qc.role)}」を見た（あなただけ見える）`, 'me');
      if(!q.cpu && pc) log(`${p.name} の手札「${rname(pc.role)}」を見た（あなただけ見える）`, 'me');
      if(!S.headless) render();
      return;
    }
    case 't27': {
      if(!p.hand.length){ log(`${p.name} は手札がないので不発`); return; }
      const n=p.hand.length; for(const c of p.hand) S.deck.push(c.role); p.hand=[]; shuffle(S.deck);
      for(let k=0;k<n;k++){ const c=drawCard(); p.hand.push(c); markFresh(c); }
      log(`${p.name} は手札${n}枚をすべて引き直した（お色直し）`);
      return;
    }
    case 't28': {
      if(!by || by===p || !by.alive || !by.hand.length){ log(`脱がせた相手がいないので不発`); return; }
      if(by.hand.length<2){ log(`${by.name} の手札は1枚なので「道連れ」は不発`); return; }
      log(`${p.name} の「道連れ」！ ${by.name} もプライドを失う`, 'hurt');
      render(); await wait(400);
      await loseInfluence(by, p, '道連れ');
      return;
    }
    case 't13': {
      const got=shareUp(p); log(`${p.name} は♥の多い相手から1♥ずつもらった（+${got}♥）`);
      return;
    }
    case 't14': p.flags.coupDiscount=true; log(`${p.name} の「ざぁ～こ♥」は5♥で撃てるようになった`); return;
    default: log(`ハズレ… 何も起きない`); return;
  }
}

/* ---- ダサすぎ♥ ---- */
async function doExchange(p){
  const drawn=[drawCard(),drawCard()];
  const pool=[...p.hand, ...drawn], keepN=p.hand.length;
  const keep = p.cpu ? cpuExchangeKeep(p,pool,keepN) : await humanExchangeKeep(p,pool,keepN);
  p.hand=pool.filter((_,i)=>keep.includes(i));
  for(const c of pool.filter((_,i)=>!keep.includes(i))) S.deck.push(c.role);
  shuffle(S.deck);
  log(`${p.name} は山札から2枚引き、2枚戻した`);
}
async function doExamine(p, target){
  if(!target.hand.length) return;
  let idx=0;
  if(target.hand.length>1) idx = target.cpu ? cpuShowCard(target) : await humanPickCard(target, `${p.name} に見せるカードを選んでください`);
  const card=target.hand[idx];
  log(`${p.name} は ${target.name} の手札を1枚のぞいた`);

// p が「場に出ている」と知っている role の枚数。except の手札は数えない（主張者本人の手札を疑う材料にしないため）
function knownCount(p, role, except){
  let n=0;
  for(const q of S.players){
    for(const r of q.lost) if(r===role) n++;
    if(q===except) continue;
    for(const c of q.hand) if(c.role===role && (q===p || c.faceUp || seenBy(c,p))) n++;
  }
  return n;
}
function threatScore(p, q){ return q.hearts + q.hand.length*3 + (q.flags.win15?(4+(q.hearts>=RULES.collectorGoal-3?6:0)):0) + (q.hearts>=coupCost(q)?3:0); }
function cpuThreat(p, cands){
  let best=null, bs=-1;
  for(const q of cands){ const s=threatScore(p,q)+Math.random()*2; if(s>bs){ bs=s; best=q; } }
  return best;
}
function cpuChooseAction(p, forced){
  const tv=tutCpu('action'); if(tv!==undefined) return typeof tv==='function'?tv(p):tv;
  const others=othersOf(p), cost=coupCost(p);
  const lives=p.hand.length;
  // ♥コレクター持ち：この手番で目標に届くなら、ざぁ～こ♥より先にそれで勝ちに行く
  if(p.flags.win15 && !forced){
    const need=RULES.collectorGoal-p.hearts;
    if(need<=1) return {action:'income'};                                  // ふ～ん♥は止められない
    if(need<=2 && chance(0.85)) return {action:'aid'};                     // よわ♥はメスガキ主張でしか止まらない
    if(need<=3 && (hasRole(p,'mesugaki') || (lives===2 && knownCount(p,'mesugaki')<2 && chance(0.5)))) return {action:'tax'};
  }
  { const ct=targetsFor(p,'coup'); if((forced || p.hearts>=cost) && ct.length) return {action:'coup', target:cpuThreat(p,ct)}; }
  const canBluff = lives===2 && chance(0.3);
  if(hasRole(p,'mesugaki') || (canBluff && knownCount(p,'mesugaki')<2 && chance(0.5))) return {action:'tax'};
  const at=targetsFor(p,'assassinate');
  if(at.length && p.hearts>=3 && (hasRole(p,'succu') || (canBluff && knownCount(p,'succu')<2 && chance(0.3)))){
    const weak=at.filter(q=>q.hand.length===1);
    return {action:'assassinate', target: weak.length&&chance(0.7) ? cpuThreat(p,weak) : cpuThreat(p,at)};
  }
  const rich=others.filter(q=>q.hearts>=2);
  if(rich.length && (hasRole(p,'kouhai') || (canBluff && chance(0.3)))){
    return {action:'steal', target: rich.sort((a,b)=>b.hearts-a.hearts)[0]};
  }
  if(hasRole(p,'osananajimi')){
    const cands=others.filter(q=>q.hand.length>0);
    if(p.flags.examine && cands.length && chance(0.5)) return {action:'exchange', target:cpuThreat(p,cands)};   // 審問
    if(!hasRole(p,'mesugaki') && !hasRole(p,'succu') && chance(0.6)) return {action:'exchange'};
  }
  if(chance(0.7)) return {action:'aid'};
  return {action:'income'};
}
function cpuChallenge(c, claimant, role, what){
  const tv=tutCpu('challenge'); if(tv!==undefined) return tv;
  if(claimant.hand.some(x=>x.role===role && (x.faceUp || seenBy(x,c)))) return false; // 持っているのを知っている
  const known=knownCount(c, role, claimant);
  if(known>=3) return true;
  let pr=0.12;
  pr += known*0.08;
  pr += claimant.bluffsCaught*0.15;
  if(claimant.claims>=4) pr+=0.08;
  if(what.kind==='action' && what.target===c){
    if(what.action==='assassinate'){
      if(c.hand.length===1 && !hasRole(c,'ojisan')) return true;   // どうせ脱落するなら
      pr+=0.2;
    } else if(what.action==='steal') pr+=0.1;
  }
  if(what.kind==='block' && what.actor===c){ pr+=0.15; if(what.action==='assassinate') pr+=0.15; }
  // ♥コレクター持ちの「よわよわ～♥」で目標に届くなら、止めないと負ける
  if(what.kind==='action' && what.action==='tax' && claimant.flags.win15 && claimant.hearts+3>=RULES.collectorGoal) pr+=0.45;
  if(c.hand.length===1) pr*=0.5;
  return chance(pr);
}
function cpuBlock(c, actor, act, opts){
  const tv=tutCpu('block'); if(tv!==undefined) return tv;
  const trig=opts.find(o=>o.kind==='trigger'); if(trig) return trig;
  const have=opts.find(o=>o.kind==='role' && hasRole(c,o.role));
  if(have && chance(0.92)) return have;
  const roleOpts=opts.filter(o=>o.kind==='role'); if(!roleOpts.length) return null;
  const bluff=roleOpts.filter(o=>knownCount(c,o.role)<3);
  if(!bluff.length) return null;
  if(act==='assassinate'){ if(c.hand.length===1) return pick(bluff); return chance(0.35)?pick(bluff):null; }
  if(act==='steal') return c.hearts>=2 && c.hand.length===2 && chance(0.25) ? pick(bluff) : null;
  if(act==='aid'){ if(actor.flags.win15 && actor.hearts+2>=RULES.collectorGoal) return chance(0.8)?pick(bluff):null; return c.hand.length===2 && chance(0.15) ? pick(bluff) : null; }
  if(act==='exchange') return c.hand.length===2 && chance(0.2) ? pick(bluff) : null;
  return null;
}
function cpuLoseCard(p){
  const tv=tutCpu('lose'); if(tv!==undefined) return typeof tv==='function'?tv(p):tv;
  let idx=0, bs=1e9;
  p.hand.forEach((c,i)=>{ const s=ROLES[c.role].value + (c.faceUp?-1:0) + (p.hand.filter(x=>x.role===c.role).length>1?-2:0); if(s<bs){ bs=s; idx=i; } });
  return idx;
}
function triggerValue(p, card){
  switch(card.id){
    case 't1': return p.hearts>=RULES.punishCost?9:2;
    case 't2': return p.hand.length>0?5:0;
    case 't3': return 2;
    case 't4': return 4;
    case 't5': return 5;
    case 't6': return 3+othersOf(p).length;
    case 't7': return 3;
    case 't8': return 4;
    case 't9': return p.hearts>=6?6:3;
    case 't10': return 2;
    case 't11': return 3;
    case 't12': return 5;
    case 't13': return 3;
    case 't14': return 4;
    case 't15': return 1;
    case 't16': return 4;
    case 't17': return 3;
    case 't18': return 4; case 't19': return 4; case 't20': return 3; case 't21': return 4; case 't22': return 4;
    case 't23': return 3; case 't24': return 3; case 't25': return 3; case 't26': return 2; case 't27': return 2; case 't28': return 6;
    default: return 0;
  }
}
function cpuFlipOther(c,p){
  const tv=tutCpu('flip'); if(tv!==undefined) return tv;
  const avail=['top','bottom'].filter(k=>!p.boro[k]);
  // トリガーチェックで中身を知っていれば、自分に跳ね返りにくい方を脱がせる（知らなければ1＝ふつう）
  const DANGER={t1:3, t12:2.5, t11:1.5, t17:1.5, t6:1.2, t14:1.2, t9:1, t2:1};
  const danger=k=>{ const t=p.triggers[k]; if(!t || !(t.seenBy||[]).includes(c.i)) return 1; return DANGER[t.card.id] ?? 0.5; };
  return avail.map(k=>[danger(k)+Math.random()*0.3, k]).sort((a,b)=>a[0]-b[0])[0][1];
}
function cpuFlip(p){
  const tv=tutCpu('flip'); if(tv!==undefined) return tv;
  if(!RULES.peekOwnTriggers) return pick(['top','bottom']);
  const a=triggerValue(p,p.triggers.top.card), b=triggerValue(p,p.triggers.bottom.card);
  if(a===b) return pick(['top','bottom']);
  return a>b?'top':'bottom';
}
function cpuExchangeKeep(p, pool, n){
  const idx=pool.map((c,i)=>i);
  idx.sort((a,b)=>{ const va=ROLES[pool[a].role].value+(pool[a].faceUp?-2:0), vb=ROLES[pool[b].role].value+(pool[b].faceUp?-2:0); return vb-va; });
  const keep=[]; const seen=new Set();
  for(const i of idx){ if(keep.length>=n) break; if(seen.has(pool[i].role) && idx.some(j=>!keep.includes(j)&&!seen.has(pool[j].role))) continue; keep.push(i); seen.add(pool[i].role); }
  for(const i of idx){ if(keep.length>=n) break; if(!keep.includes(i)) keep.push(i); }
  return keep;
}
function cpuPassCard(p){ return cpuLoseCard(p); }
function cpuShowCard(p){ return cpuLoseCard(p); }
function cpuDeckSwap(p){
  if(!S.deck.length || !p.hand.length) return null;
  let bd=0; S.deck.forEach((r,i)=>{ if(ROLES[r].value>ROLES[S.deck[bd]].value) bd=i; });
  const worst=cpuLoseCard(p);
  if(ROLES[S.deck[bd]].value > ROLES[p.hand[worst].role].value || p.hand[worst].faceUp) return {deck:bd, hand:worst};
  return null;
}

function passText(what, claimant, me){
  const A=ACTIONS[what.action]; const t=what.target;
  const who=p=>p===me?'あなた':p.name;
  if(what.kind==='block'){
    const act=what.actor;
    const base=`ブロック成立。${who(act)} の「${A.name}」は不発`;
    if(what.action==='assassinate') return base+'（払った3♥は戻らない）';
    if(what.action==='aid') return base+'（2♥もらえない）';
    if(what.action==='steal') return base+`（${who(t)} の♥はそのまま）`;
    return base;
  }
  switch(what.action){
    case 'aid': return `${who(claimant)} が2♥獲得（${claimant.hearts}♥ → ${claimant.hearts+2}♥）`;
    case 'tax': return `${who(claimant)} が3♥獲得（${claimant.hearts}♥ → ${claimant.hearts+3}♥）`;
    case 'steal': { const n=Math.min(2,t.hearts); return `${who(claimant)} が ${who(t)} から${n}♥奪う（${who(t)} ${t.hearts}♥ → ${t.hearts-n}♥、${who(claimant)} ${claimant.hearts}♥ → ${claimant.hearts+n}♥）`+(t===me&&what.kind==='action'&&!what.atBlock?'。見逃しても、このあと後輩ガキ・幼馴染ガキでブロックできる':''); }
    case 'assassinate': return `${who(t)} がプライドを1つ失う（手札1枚を捨て、服を1枚脱ぐ）`+(t===me&&what.kind==='action'&&!what.atBlock?'。見逃しても、このあと わからせおじさん でブロックできる':'');
    case 'exchange': return t ? `${who(claimant)} が ${who(t)} の手札1枚を見て、山札と交換させられる（審問）`+(t===me&&what.kind==='action'&&!what.atBlock?'。見逃しても、このあと幼馴染ガキでブロックできる':'') : `${who(claimant)} が山札から2枚引いて2枚戻す（手札を整えられる）`;
  }

}

function edgePt(r, to){
  const dx=to.x-r.cx, dy=to.y-r.cy; if(!dx&&!dy) return {x:r.cx,y:r.cy};
  const sx=(r.w/2)/Math.max(1e-6,Math.abs(dx)), sy=(r.h/2)/Math.max(1e-6,Math.abs(dy)); const t=Math.min(sx,sy);
  return {x:r.cx+dx*t, y:r.cy+dy*t};
}
function renderArrows(){
  const svg=$('#arrows'); if(!svg) return;
  const a=S.action;
  if(S.headless||!a||getComputedStyle(svg).display==='none'){ svg.innerHTML=''; return; }
  const tbl=$('#table').getBoundingClientRect();
  svg.setAttribute('width',tbl.width); svg.setAttribute('height',tbl.height); svg.setAttribute('viewBox',`0 0 ${tbl.width} ${tbl.height}`);
  const rectOf=p=>{ const el=panelOf(p); if(!el) return null; const r=el.getBoundingClientRect(); return {x:r.left-tbl.left,y:r.top-tbl.top,w:r.width,h:r.height,cx:r.left-tbl.left+r.width/2,cy:r.top-tbl.top+r.height/2}; };
  const A=rectOf(a.actor); if(!A){ svg.innerHTML=''; return; }
  let endRect=null, end;
  if(a.target){ endRect=rectOf(a.target); end={x:endRect.cx,y:endRect.cy}; }
  else { const c=$('#deckInfo').getBoundingClientRect(); end={x:c.left-tbl.left+c.width/2, y:c.top-tbl.top+c.height/2}; }
  const p0=edgePt(A,end); const p1=endRect?edgePt(endRect,{x:A.cx,y:A.cy}):end;
  const mx=(p0.x+p1.x)/2, my=(p0.y+p1.y)/2; const dx=p1.x-p0.x, dy=p1.y-p0.y, len=Math.hypot(dx,dy)||1;
  const nx=-dy/len, ny=dx/len; const bow=Math.min(60,len*0.18);
  const cx=mx+nx*bow, cy=my+ny*bow;
  const tt=0.38, lab={x:(1-tt)*(1-tt)*p0.x+2*(1-tt)*tt*cx+tt*tt*p1.x, y:(1-tt)*(1-tt)*p0.y+2*(1-tt)*tt*cy+tt*tt*p1.y};
  const lblW=t=>Math.max(60, t.length*15+22);
  const label=(pt,text,cls)=>`<g class="lbl ${cls||''}"><rect x="${pt.x-lblW(text)/2}" y="${pt.y-15}" width="${lblW(text)}" height="30" rx="4"/><text x="${pt.x}" y="${pt.y+1}">${text}</text></g>`;
  let out=`<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff5fa8"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ff8da8"/></marker></defs>`;
  out+=`<path class="main" d="M${p0.x},${p0.y} Q${cx},${cy} ${p1.x},${p1.y}" marker-end="url(#ah)"/>`;
  const subs=[];
  if(a.phase==='block'||a.phase==='blockchallenge'){ const B=rectOf(a.blocker); if(B){ const s0=edgePt(B,lab); subs.push({from:s0,to:lab,cls:'blk',m:'ahr',text:'は？ブロック'}); } }
  if(a.phase==='challenge'||a.phase==='blockchallenge'){ const C=rectOf(a.challenger); if(C){ const s0=edgePt(C,lab); subs.push({from:s0,to:lab,cls:'chal',m:'ahg',text:'チャレンジ！'}); } }
  for(const sb of subs){ const tx=sb.from.x+(sb.to.x-sb.from.x)*0.45, ty=sb.from.y+(sb.to.y-sb.from.y)*0.45; out+=`<path class="sub ${sb.cls}" d="M${sb.from.x},${sb.from.y} L${sb.to.x},${sb.to.y}" marker-end="url(#${sb.m})"/>`; out+=label({x:tx,y:ty},sb.text,sb.cls); }
  out+=label(lab, ACTIONS[a.act].name, '');
  svg.innerHTML=out;
}

async function fxFlipCard(p,k){
  if(S.headless) return;
  const el=panelOf(p); const card=el && el.querySelectorAll('.figure .ccard')[k==='top'?0:1];

  document.body.appendChild(ov);

  const to=zc.getBoundingClientRect();
  if(from && to.width){ const sx=from.width/to.width, sy=from.height/to.height; const dx=(from.left+from.width/2)-(to.left+to.width/2), dy=(from.top+from.height/2)-(to.top+to.height/2); zc.style.transition='none'; zc.style.transform=`translate(${dx}px,${dy}px) scale(${sx},${sy})`; }
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  ov.classList.add('in'); zc.style.transition='transform .45s cubic-bezier(.2,.9,.3,1)'; zc.style.transform='none';
  await hold(520);
  fl.classList.add('go'); SFX.play('rip');

  ov.classList.add('out'); setTimeout(()=>ov.remove(), 300);

}

/* =====================================================================
 *  SE：Web Audio で合成する8bit風の効果音（音声ファイルなし）
 * ===================================================================== */
const SFX = {
  on:true, ctx:null, master:null,
  init(){
    if(!this.ctx){ try{ const AC=window.AudioContext||window.webkitAudioContext; this.ctx=new AC(); this.master=this.ctx.createGain(); this.master.gain.value=0.5; this.master.connect(this.ctx.destination); }catch(e){ this.ctx=null; } }
    if(this.ctx && this.ctx.state==='suspended') this.ctx.resume().catch(()=>{});
  },
  load(){ try{ const v=localStorage.getItem('mesugaki-coup-sfx'); if(v!==null) this.on=v==='1'; }catch(e){} },
  save(){ try{ localStorage.setItem('mesugaki-coup-sfx', this.on?'1':'0'); }catch(e){} },
  updateButton(){ for(const b of document.querySelectorAll('#btnSound,#btnSound2')){ b.textContent=this.on?'♪ 音：ON':'♪ 音：OFF'; b.classList.toggle('sfx-off',!this.on); b.setAttribute('aria-pressed', this.on?'true':'false'); } },
  tone(freq, dur, {type='square', gain=0.12, at=0, slide=null, decay=true}={}){
    const c=this.ctx, t0=c.currentTime+at;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,t0); if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t0+dur);
    g.gain.setValueAtTime(gain,t0); if(decay) g.gain.exponentialRampToValueAtTime(0.001,t0+dur); else g.gain.setValueAtTime(0.001,t0+dur);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+dur+0.02);
  },
  noise(dur, {gain=0.2, at=0, lp=null, hp=null, sweep=null}={}){
    const c=this.ctx, t0=c.currentTime+at;
    const buf=c.createBuffer(1, Math.ceil(c.sampleRate*dur), c.sampleRate); const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=c.createBufferSource(); src.buffer=buf;
    let node=src;
    if(lp){ const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(lp,t0); if(sweep) f.frequency.exponentialRampToValueAtTime(sweep,t0+dur); node.connect(f); node=f; }
    if(hp){ const f=c.createBiquadFilter(); f.type='highpass'; f.frequency.setValueAtTime(hp,t0); node.connect(f); node=f; }
    const g=c.createGain(); g.gain.setValueAtTime(gain,t0); g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
    node.connect(g); g.connect(this.master); src.start(t0); src.stop(t0+dur+0.02);
  },
  play(name){
    if(!this.on || S.headless) return; this.init(); if(!this.ctx) return;
    try{
      switch(name){
        case 'tick': this.tone(880,0.04,{gain:0.06}); break;
        case 'pop': this.tone(523,0.07,{gain:0.1}); this.tone(784,0.09,{at:0.07,gain:0.1}); break;
        case 'coin': this.tone(988,0.08,{gain:0.1}); this.tone(1319,0.22,{at:0.08,gain:0.1}); break;
        case 'drain': this.tone(440,0.18,{slide:180,gain:0.1}); break;
        case 'sting': this.tone(220,0.28,{type:'sawtooth',gain:0.09}); this.tone(233,0.28,{type:'sawtooth',gain:0.09}); this.tone(110,0.3,{type:'square',gain:0.06,at:0.05}); break;
        case 'buzz': this.tone(110,0.22,{type:'square',gain:0.1}); this.tone(116,0.22,{type:'square',gain:0.08}); break;
        case 'chime': this.tone(659,0.09,{type:'triangle',gain:0.12}); this.tone(784,0.09,{type:'triangle',gain:0.12,at:0.09}); this.tone(1047,0.3,{type:'triangle',gain:0.12,at:0.18}); break;
        case 'hit': this.noise(0.28,{gain:0.3,lp:1800,sweep:200}); this.tone(90,0.3,{slide:35,gain:0.18}); break;
        case 'rip': this.noise(0.32,{gain:0.22,hp:900,lp:6000,sweep:1200}); this.tone(1200,0.25,{type:'sawtooth',slide:300,gain:0.04}); break;
        case 'sparkle': [1047,1319,1568,2093].forEach((f,i)=>this.tone(f,0.12,{type:'triangle',gain:0.09,at:i*0.07})); break;
        case 'dud': this.tone(300,0.12,{gain:0.08}); this.tone(220,0.25,{gain:0.08,at:0.12,slide:160}); break;
        case 'boom': this.noise(0.6,{gain:0.4,lp:900,sweep:60}); this.tone(55,0.6,{type:'sine',slide:25,gain:0.3}); break;
        case 'fanfare': [[523,0.12,0],[659,0.12,0.12],[784,0.12,0.24],[1047,0.5,0.36],[784,0.12,0.6],[1047,0.7,0.72]].forEach(([f,d,a])=>this.tone(f,d,{type:'square',gain:0.1,at:a})); break;
        case 'down': [392,330,262,196].forEach((f,i)=>this.tone(f,0.22,{type:'square',gain:0.09,at:i*0.16})); break;
      }
    }catch(e){}
  }
};

    <li>各自、<b>ガキカード2枚</b>（＝ライフ2つ）と <b>2♥</b> を持つ。手札は自分だけ見る。</li>
    <li><b>メスガキカード</b> 上半身・下半身を並べる。表は普通の服、裏はボロ絵。</li>
    <li><b>トリガーカード</b>を${RULES.triggerDeal}枚引き、${RULES.triggerDeal>2?'2枚を選んで上半身・下半身の横に敷く（残りは山へ）':'上半身・下半身の横に1枚ずつ敷く'+(RULES.dudCount>0?'（ハズレも仕込むことになる）':'')}。自分のトリガーは自分だけ見てよい。</li>
  </ul></div>

  <div class="rl-sec"><h3><span class="no">2</span>手番の流れ</h3>
  <div class="rl-flow">
    <div class="rl-step"><b>① 宣言</b>アクションを1つ宣言する<small>役職つきのアクションは、そのカードを持っていなくても宣言できる（ハッタリ）</small></div>
    <div class="rl-arrow">→</div>
    <div class="rl-step"><b>② 割り込み</b>ほかの人が止められる<small>「は？」ブロック（役職を主張して止める）／ チャレンジ！（ハッタリだと疑う）。ブロックにもチャレンジできる</small></div>
    <div class="rl-arrow">→</div>
    <div class="rl-step"><b>③ 解決</b>通れば効果、止まれば不発<small>♥の増減、プライドの喪失。10♥以上で手番が来たら必ず「ざぁ～こ♥」</small></div>
  </div></div>

  <div class="rl-sec"><h3><span class="no">3</span>アクション <small>色は使うガキカードの色。「誰でも」は役職なし</small></h3>
  <div class="rl-tiles" id="rlActions"></div></div>

  <div class="rl-sec"><h3><span class="no">4</span>ガキカード（役職） <small>5種×3枚＝15枚。手札2枚がプライド</small></h3>
  <div class="rl-roles" id="rlRoles"></div>
  <p class="rl-note">「できる」はそのカードで宣言できるアクション、「ブロック」はそのカードで止められる相手のアクション。</p></div>

  <div class="rl-sec"><h3><span class="no">5</span>チャレンジ</h3>
  <div class="rl-two">
    <div class="rl-box ok"><b>主張が本当だった</b>そのカードを公開して山札と交換し、1枚引き直す。チャレンジした人がプライドを失う。アクションは通る。</div>
    <div class="rl-box ng"><b>ハッタリだった</b>主張した人がプライドを失い、アクション（またはブロック）は失敗。まけちゃえ～♥で払った3♥は戻らない。</div>
  </div></div>

  <div class="rl-sec"><h3><span class="no">6</span>プライドを失ったとき</h3>
  <ol class="rl-ol">
    <li><b>手札を1枚</b>、自分で選んで表にして捨てる。</li>
    <li><b>失わせた相手</b>が、メスガキカードの上半身・下半身どちらかを選んで裏返す（ボロ絵）。</li>
    <li>その横に敷いてあった<b>トリガー</b>を表にして、効果を発動する。</li>
  </ol>
  <div class="rl-strip" id="rlStrip"></div>
  <p class="rl-note">上下とも裏返ったら脱落。全員同時に脱落したら、最後に脱落した人の勝ち。</p></div>

  <div class="rl-sec"><h3><span class="no">7</span>トリガーカード <small id="rlTrigHead"></small></h3>
  <div class="rl-trig" id="rlTrig"></div>
  <p class="rl-sub">ほかのカード（今のデッキに入っていないもの。開始画面でデッキを組み替えられる）</p>
  <div class="rl-trig bench" id="rlBench"></div></div>

  <div class="rl-sec"><h3><span class="no">8</span>細かい決まり</h3>
  <ul class="rl-list">
    <li>「♥コレクター」を持つ人は <b>${RULES.collectorGoal}♥</b> 集めた時点で勝ち${liftNote()}。</li>
    <li>「値上げ」は他の全員のざぁ～こ♥を8♥に、「値下げ」は自分のざぁ～こ♥を5♥にする（両方なら6♥）。</li>
    <li>「ダサすぎ返し」は公開済みのトリガーによるブロックなので、チャレンジできない。</li>
    <li>「まわして」の右隣は、席順で次のプレイヤー。</li>
    <li>CPUが脱がせる側のときは、上下をランダムに選ぶ。</li>
  </ul></div>
  <div class="close"><button class="btn" data-close>閉じる</button></div>`;
}
function fillRules(){
  const acts=$('#rlActions'); acts.innerHTML='';
  for(const id of ['income','aid','coup','tax','steal','exchange','assassinate']){ const t=actionTileEl(id, null, RULES.coupCost); t.disabled=false; t.tabIndex=-1; acts.appendChild(t); }
  const roles=$('#rlRoles'); roles.innerHTML='';
  for(const r of ROLE_IDS) roles.appendChild(roleCardEl(r));
  const trig=$('#rlTrig'); trig.innerHTML='';
  const withCount=(t,n)=>{ const el=triggerEl({card:t,revealed:true},'on',false); const c=document.createElement('span'); c.className='cnt'; c.textContent=typeof n==='number'?`×${n}`:n; el.appendChild(c); return el; };
  $('#rlTrigHead').textContent=`${deckLabel()}：${DECK.ids.length}枚${RULES.dudCount>0?`＋ハズレ${RULES.dudCount}枚`:''}`;
  for(const id of DECK.ids){ const t=TRIGGERS.find(x=>x.id===id); if(t) trig.appendChild(withCount(t, SET_LABEL[t.set])); }
  if(RULES.dudCount>0) trig.appendChild(withCount(NO_TRIGGER, RULES.dudCount));
  const bench=$('#rlBench'); bench.innerHTML='';
  for(const t of TRIGGERS) if(!DECK.ids.includes(t.id)) bench.appendChild(withCount(t, SET_LABEL[t.set]));
  bench.previousElementSibling.hidden = bench.hidden = !bench.children.length;
  const strip=$('#rlStrip'); strip.innerHTML='';
  const ch=CHARS[0];
  strip.appendChild(figureEl(ch,{top:false,bottom:false},'sm',true,['top']));
  const arrow=document.createElement('div'); arrow.className='rl-arrow'; arrow.textContent='→'; strip.appendChild(arrow);
  strip.appendChild(figureEl(ch,{top:true,bottom:false},'sm',true,['top']));
  const cap=document.createElement('div'); cap.className='rl-note'; cap.style.margin='0'; cap.textContent='表（普通の服）→ 裏（ボロ絵）。裏返った側のトリガーが発動'; strip.appendChild(cap);
}
let setup={ n:4, ch:0, auto:false };
function openStart(){
  const dp=$('#deckpick'); dp.innerHTML='';
  for(const [k,lbl] of [['basic','基本デッキ'],['fresh','新カードデッキ'],['custom','カスタム…']]){ const b=document.createElement('button'); b.className='btn'+(DECK.preset===k?' primary':''); b.textContent=lbl; b.onclick=()=>{ if(k==='custom') openDeckPicker(); else { setDeck(k); openStart(); } }; dp.appendChild(b); }
  $('#deckinfo').innerHTML=`<b>${deckLabel()}</b>（${DECK.ids.length}枚）：${DECK.ids.map(id=>(TRIGGERS.find(t=>t.id===id)||{}).name).join('・')}`;
  const np=$('#npick'); np.innerHTML='';
  for(const n of [3,4,5,6]){ const b=document.createElement('button'); b.className='btn'+(setup.n===n?' primary':''); b.textContent=`${n}人`; b.onclick=()=>{ setup.n=n; openStart(); }; np.appendChild(b); }
  const cp=$('#chpick'); cp.innerHTML='';
  CHARS.forEach((ch,i)=>{ const d=document.createElement('div'); d.className='ch'+(setup.ch===i?' on':''); d.appendChild(figureEl(ch,{top:false,bottom:false},'sm',false)); const l=document.createElement('span'); l.textContent=`${ch.name}`; d.appendChild(l); d.onclick=()=>{ setup.ch=i; openStart(); }; cp.appendChild(d); });
  let auto=$('#autoPick');
  if(!auto){ auto=document.createElement('label'); auto.id='autoPick'; auto.style.cssText='font-size:13px;color:var(--dim);display:flex;gap:6px;align-items:center'; auto.innerHTML='<input type="checkbox"> おまかせ（自分の手もCPUに任せて観戦）'; $('#btnStart').parentElement.appendChild(auto); auto.querySelector('input').onchange=e=>{ setup.auto=e.target.checked; }; }
  $('#modalStart').classList.add('show');
}

// デッキ編集モーダル
let deckDraft=[];
function openDeckPicker(){
  deckDraft=DECK.ids.slice();
  renderDeckPicker();
  $('#modalDeck').classList.add('show');
}
function renderDeckPicker(){
  const g=$('#deckGroups'); g.innerHTML='';
  for(const set of ['basic','fresh','bench']){
    const h=document.createElement('p'); h.className='rl-sub'; h.textContent=SET_LABEL[set]+(set==='bench'?'（以前に外したカード）':''); g.appendChild(h);
    const grid=document.createElement('div'); grid.className='rl-trig';
    for(const t of TRIGGERS.filter(x=>x.set===set)){
      const el=triggerEl({card:t,revealed:true},'on',false); el.classList.add('pick'); if(deckDraft.includes(t.id)) el.classList.add('sel');
      const c=document.createElement('span'); c.className='cnt'; c.textContent=deckDraft.includes(t.id)?'✓ 採用':'－'; el.appendChild(c);
      el.onclick=()=>{ const i=deckDraft.indexOf(t.id); if(i>=0) deckDraft.splice(i,1); else if(deckDraft.length<DECK_SIZE) deckDraft.push(t.id); else { SFX.play('buzz'); return; } renderDeckPicker(); };
      grid.appendChild(el);
    }
    g.appendChild(grid);
  }
  const n=deckDraft.length;
  $('#deckCount').textContent=`選択中 ${n} / ${DECK_SIZE}枚`+(n<DECK_SIZE?`（あと${DECK_SIZE-n}枚）`:'');
  $('#btnDeckOk').disabled = n!==DECK_SIZE;
}
function init(){
  preloadImages();
  loadDeck();
  $('#btnDeckOk').onclick=()=>{ if(deckDraft.length!==DECK_SIZE) return; const preset = ['basic','fresh'].find(k=>DECK_PRESETS[k].every(id=>deckDraft.includes(id))) || 'custom'; setDeck(preset, deckDraft); $('#modalDeck').classList.remove('show'); openStart(); };
  $('#btnDeckBasic').onclick=()=>{ deckDraft=DECK_PRESETS.basic.slice(); renderDeckPicker(); };
  window.addEventListener('resize', ()=>renderArrows());
  $('#rulesBox').innerHTML=buildRules(); fillRules();
  document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('show'));
  document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m && m.id!=='modalStart') m.classList.remove('show'); }));
  $('#btnRules').onclick=()=>$('#modalRules').classList.add('show');
  $('#btnStartRules').onclick=()=>$('#modalRules').classList.add('show');
  $('#btnLog').onclick=()=>{ renderLog(); $('#modalLog').classList.add('show'); };
  $('#btnSpeed').onclick=()=>{ S.speed=S.speed===1?0.35:1; $('#btnSpeed').textContent=`速度：${S.speed===1?'ふつう':'はやい'}`; };
  $('#btnNew').onclick=()=>openStart();
  SFX.load(); SFX.updateButton();
  const toggleSound=()=>{ SFX.on=!SFX.on; SFX.save(); SFX.updateButton(); SFX.init(); if(SFX.on) SFX.play('coin'); };
  $('#btnSound').onclick=toggleSound; $('#btnSound2').onclick=toggleSound;
  document.addEventListener('pointerdown', ()=>SFX.init(), {passive:true});
  $('#prompt').addEventListener('click', e=>{ if(e.target.closest('.btn,.at,.rc.sel,.tc.sel')) SFX.play('tick'); });
  $('#btnStart').onclick=()=>{ $('#modalStart').classList.remove('show'); newGame(setup.n, setup.ch, {auto:setup.auto}); };
  $('#btnTutorial').onclick=()=>{ $('#modalStart').classList.remove('show'); newGame(2, setup.ch, {tutorial:true}); };
  openStart();
}
init();
</script>
</body>
