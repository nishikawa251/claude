<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>深夜喫茶 境界</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
:root{
  color-scheme: dark;
  --night:#140f19;
  --wall:#1f1624;
  --panel:#1b1420;
  --panel2:#261c2c;
  --frame:#6b4a36;
  --frame2:#3a2419;
  --lamp:#f2b15e;
  --lamp2:#b07a38;
  --ink:#f1e6d4;
  --dim:#a497ad;
  --line:#4d3d58;
  --ng:#e39a8e;
  --f:'DotGothic16','Hiragino Kaku Gothic ProN','Yu Gothic',monospace;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--night);color:var(--ink);font-family:var(--f);font-size:16px;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}

/* pixel frame: square notched corners made from four offset shadows */
.pxbox{--c:var(--frame);background:var(--panel);box-shadow:0 -4px 0 0 var(--c),0 4px 0 0 var(--c),-4px 0 0 0 var(--c),4px 0 0 0 var(--c),inset 0 0 0 2px var(--frame2)}

#app{height:100%;display:flex;flex-direction:column;max-width:1040px;margin:0 auto;padding-inline:16px}

/* ---------- HUD ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;font-size:14px;color:var(--dim)}
.hud .when{letter-spacing:.1em}
.hud .when b{color:var(--ink);font-weight:400}
.hud .tools{display:flex;gap:12px}
.btn{font-family:var(--f);font-size:14px;background:var(--panel2);border:none;color:var(--ink);padding:6px 14px;cursor:pointer;letter-spacing:.06em;margin:2px;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.btn:hover{background:#33263b}
.btn:focus-visible{outline:none;box-shadow:0 -2px 0 0 var(--lamp),0 2px 0 0 var(--lamp),-2px 0 0 0 var(--lamp),2px 0 0 0 var(--lamp)}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn.primary{background:var(--lamp);color:#241708;box-shadow:0 -2px 0 0 var(--lamp2),0 2px 0 0 var(--lamp2),-2px 0 0 0 var(--lamp2),2px 0 0 0 var(--lamp2),inset 0 -3px 0 0 var(--lamp2)}
.btn.primary:hover{background:#f7c47d}
.btn.small{padding:4px 10px;font-size:13px}

/* ---------- Stage ---------- */
.stage{position:relative;flex:none;display:flex;justify-content:center;background:var(--wall)}
#scene{max-width:100%}
.toast{position:absolute;left:50%;top:10%;transform:translate(-50%,-6px);padding:8px 18px;text-align:center;opacity:0;transition:opacity .25s steps(3),transform .25s steps(3);pointer-events:none;z-index:5;max-width:86%;--c:var(--lamp)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast .k{font-size:12px;color:var(--lamp);letter-spacing:.14em}
.toast .v{font-size:20px;margin-top:2px}

/* ---------- Dialogue ---------- */
.dlg{position:relative;flex:none;margin-block:26px 18px;margin-inline:4px;min-height:132px;padding:18px 18px 14px;cursor:pointer;user-select:none}
.plate{position:absolute;top:-16px;left:14px;padding:3px 14px;font-size:16px;color:#fff;background:#6b5b4b;letter-spacing:.08em;box-shadow:0 -2px 0 0 #140f19,0 2px 0 0 #140f19,-2px 0 0 0 #140f19,2px 0 0 0 #140f19}
.plate[hidden]{display:none}
.text{font-size:17px;line-height:1.9;min-height:3.8em;white-space:pre-wrap}
.text.narr{color:var(--dim)}
.nextind{position:absolute;right:16px;bottom:8px;font-size:12px;color:var(--lamp);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.choices{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.choices .btn{text-align:left;font-size:16px;padding:9px 14px}
.orderbox{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px}
.orderbox .lbl{font-size:12px;color:var(--lamp);letter-spacing:.16em}
.orderbox .q{font-size:17px;line-height:1.7}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(9,6,12,.82)}
.overlay[hidden]{display:none!important}
.sheet{width:min(940px,100%);max-height:100%;overflow:auto;padding:18px}

/* brew */
.brew{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:20px}
.brew .order{grid-column:1/-1;display:flex;gap:14px;align-items:flex-start;border-bottom:2px dashed var(--line);padding-bottom:14px}
.brew .order .who{font-size:18px;white-space:nowrap;padding-top:14px}
.brew .order .q{font-size:16px;line-height:1.7}
.brew .order .tag{font-size:11px;color:var(--lamp);letter-spacing:.16em;display:block}
.slots{display:flex;justify-content:center;gap:12px}
.slot{width:76px;height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--dim);cursor:pointer;background:var(--panel2);text-align:center;line-height:1.2;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.slot.full{color:var(--ink);box-shadow:0 -2px 0 0 var(--frame),0 2px 0 0 var(--frame),-2px 0 0 0 var(--frame),2px 0 0 0 var(--frame)}
.preview{display:flex;align-items:center;gap:18px;margin-top:18px}
.preview .bigcup{flex:none}
.preview .dname{font-size:20px;line-height:1.3}
.preview .dnote{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.6}
.stats{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;margin-top:16px;font-size:13px;align-items:center}
.pips{display:flex;gap:3px}
.pips i{width:100%;max-width:30px;height:10px;background:#30263a}
.stats .s-warm .on{background:#e8875a}.stats .s-sweet .on{background:#e9a3c0}.stats .s-bitter .on{background:#a3805f}.stats .s-fresh .on{background:#7fd0b4}
.ings h4{margin:0 0 10px;font-weight:400;font-size:12px;color:var(--dim);letter-spacing:.16em}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.ing{display:flex;flex-direction:column;align-items:center;gap:6px;padding:9px 4px 7px;background:var(--panel2);border:none;cursor:pointer;font-size:14px;
  box-shadow:0 -2px 0 0 var(--line),0 2px 0 0 var(--line),-2px 0 0 0 var(--line),2px 0 0 0 var(--line)}
.ing:hover{background:#33263b}
.ing:focus-visible{outline:none;box-shadow:0 -2px 0 0 var(--lamp),0 2px 0 0 var(--lamp),-2px 0 0 0 var(--lamp),2px 0 0 0 var(--lamp)}
.ing:active{transform:translateY(2px)}
.ing.off{opacity:.35}
.hint{font-size:13px;color:var(--ng);min-height:1.4em}
.actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.shake{animation:shake .24s steps(4)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (max-width:720px){
  .brew{grid-template-columns:1fr}
  .slot{width:66px;height:66px}
  .text{font-size:16px}
}

/* book */
.book .tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.book .tab{background:none;border:none;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--dim);margin-bottom:-2px}
.book .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--lamp)}
.book .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px}
.book .head h3{margin:0;font-weight:400;font-size:20px;letter-spacing:.1em}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.rcard{display:flex;gap:12px;align-items:flex-start;padding:10px;background:var(--panel2)}
.rcard .c{flex:none;width:36px;display:flex;justify-content:center;padding-top:2px}
.rcard .n{font-size:16px}
.rcard .i{font-size:12px;color:var(--lamp);margin-top:2px}
.rcard .d{font-size:13px;color:var(--dim);line-height:1.55;margin-top:4px}
.rcard.lock .n{color:var(--dim)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{display:flex;gap:12px;padding:10px;background:var(--panel2)}
.pcard .face{width:76px;height:80px;flex:none;background:#2d2234;overflow:hidden}
.pcard .n{font-size:17px}
.pcard .t{font-size:12px;color:var(--lamp)}
.pcard .d{font-size:13px;color:var(--dim);line-height:1.6;margin-top:4px}
.set{display:grid;gap:14px;max-width:560px}
.set .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.seg{display:flex;gap:6px}
.seg .btn[aria-pressed="true"]{color:var(--lamp)}
.muted{font-size:13px;color:var(--dim);line-height:1.8}

/* title & cards */
.title{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;gap:clamp(24px,6vw,72px);padding:16px;background:rgba(14,10,18,.72);flex-wrap:wrap}
.title[hidden]{display:none!important}
.title .logo{writing-mode:vertical-rl;font-size:clamp(42px,8.5vw,80px);letter-spacing:.2em;line-height:1.2;color:var(--ink);text-shadow:4px 4px 0 #3a2419,0 0 24px rgba(242,177,94,.3)}
.title .logo small{display:block;font-size:.3em;letter-spacing:.34em;color:var(--lamp);margin-left:.5em;text-shadow:2px 2px 0 #3a2419}
.title .menu{display:flex;flex-direction:column;gap:14px;min-width:210px;padding:18px}
.title .menu .btn{font-size:15px;padding:9px 16px}
.title .credit{font-size:12px;color:var(--dim);line-height:1.9;margin:6px 0 0;max-width:30ch}
.card{position:fixed;inset:0;z-index:25;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(9,6,12,.92);cursor:pointer;padding:16px;text-align:center}
.card[hidden]{display:none!important}
.card .big{font-size:clamp(40px,8vw,68px);letter-spacing:.2em;text-shadow:4px 4px 0 #3a2419}
.card .sub{color:var(--lamp);letter-spacing:.3em}
.card .note{color:var(--dim);font-size:14px;line-height:1.9}
.card .res{display:grid;grid-template-columns:auto auto;gap:6px 18px;font-size:14px;text-align:left;margin-top:6px}
.card .res b{font-weight:400;color:var(--lamp);font-variant-numeric:tabular-nums}

@media (prefers-reduced-motion: reduce){
  .toast{transition:none}
  .nextind{animation:none}
}
</style>

<div id="app">
  <div class="hud" id="hud">
    <div class="when" id="when">深夜喫茶 境界</div>
    <div class="tools">
      <button class="btn small" id="bookBtn">手帳</button>
      <button class="btn small" id="soundBtn" aria-pressed="false">雨音 OFF</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="scene" class="px" width="384" height="216" aria-label="店内の様子"></canvas>
    <div class="toast pxbox" id="toast"><div class="k" id="toastK"></div><div class="v" id="toastV"></div></div>
  </div>
  <div class="dlg pxbox" id="dlg" tabindex="0" aria-live="polite">
    <div class="plate" id="plate" hidden></div>
    <div class="text" id="text"></div>
    <div class="choices" id="choices" hidden></div>
    <div class="nextind" id="nextind" hidden>▼</div>
  </div>
</div>

<!-- Brew -->
<div class="overlay" id="brewOv" hidden>
  <div class="sheet brew pxbox" id="brew">
    <div class="order">
      <div class="who" id="bWho"></div>
      <div class="q"><span class="tag">ご注文</span><span id="bQ"></span></div>
    </div>
    <div>
      <div class="slots" id="slots"></div>
      <div class="preview">
        <div class="bigcup" id="bigcup"></div>
        <div><div class="dname" id="dname">—</div><div class="dnote" id="dnote">最初にベースを選んでください。</div></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
    <div class="ings">
      <h4>ベース（一番目）</h4>
      <div class="grid" id="gBase"></div>
      <h4>材料</h4>
      <div class="grid" id="gAdd"></div>
      <div class="hint" id="bHint"></div>
      <div class="actions">
        <button class="btn" id="bBook">手帳を見る</button>
        <button class="btn" id="bReset">やり直す</button>
        <button class="btn primary" id="bServe" disabled>提供する</button>
      </div>
    </div>
  </div>
</div>

<!-- Book -->
<div class="overlay" id="bookOv" hidden style="z-index:40">
  <div class="sheet book pxbox">
    <div class="head"><h3>店主の手帳</h3><button class="btn small" id="bookClose">閉じる</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="recipe" aria-selected="true">レシピ</button>
      <button class="tab" role="tab" data-tab="people" aria-selected="false">常連</button>
      <button class="tab" role="tab" data-tab="guide" aria-selected="false">淹れ方</button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">設定</button>
    </div>
    <div id="bookBody"></div>
  </div>
</div>

<!-- Title -->
<div class="title" id="title">
  <div class="logo">深夜喫茶<br>境界<small>しんやきっさ きょうかい</small></div>
  <div class="menu pxbox">
    <button class="btn primary" id="tNew">はじめから</button>
    <button class="btn" id="tCont" disabled>つづきから</button>
    <button class="btn" id="tBook">手帳</button>
    <p class="credit">雨の夜にだけ開く喫茶店で、幻想郷の客に一杯を淹れる。<br>東方Project二次創作<br>原作：上海アリス幻樂団<br>Coffee Talk に着想を得た非公式ファンゲームです。</p>
  </div>
</div>

<!-- Card -->
<div class="card" id="card" hidden></div>

const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const rgb=h=>{h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.substr(i,2),16));};
const hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mixA=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const SHADOW=[40,22,62], LIGHT=[255,240,210], OUT=[26,16,32], OUTH=hex(OUT);
const shadeA=(a,t=.36)=>mixA(a,SHADOW,t), lightA=(a,t=.3)=>mixA(a,LIGHT,t);
function seeded(s){return ()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};}
function mapCanvas(map, pal){
  const h=map.length,w=map[0].length,c=mk(w,h),x=c.getContext('2d');
  map.forEach((row,y)=>{for(let i=0;i<w;i++){const col=pal[row[i]];if(col){x.fillStyle=col;x.fillRect(i,y,1,1);}}});
  return c;
}
// a DOM canvas showing `src` scaled up by an integer factor, pixels kept crisp
function pxEl(src, scale, sx=0, sy=0, sw=src.width, sh=src.height){
  const c=mk(sw,sh); c.getContext('2d').drawImage(src,sx,sy,sw,sh,0,0,sw,sh);
  c.className='px'; c.style.width=sw*scale+'px'; c.style.height=sh*scale+'px';
  return c;
}
function disc(ctx,cx,cy,r,col){ctx.fillStyle=col;for(let dy=-r;dy<=r;dy++){const hw=Math.round(Math.sqrt(r*r-dy*dy));ctx.fillRect(cx-hw,cy+dy,hw*2+1,1);}}

let _tmp=null;
function rasterize(layers, w, h, sc, oy){
  if(!_tmp||_tmp.width!==w||_tmp.height!==h) _tmp=mk(w,h);
  const t=_tmp.getContext('2d',{willReadFrequently:true});
  const owner=new Int16Array(w*h).fill(-1);
  layers.forEach((L,li)=>{
    t.setTransform(1,0,0,1,0,0); t.clearRect(0,0,w,h);
    t.setTransform(sc,0,0,sc,0,oy*sc);
    if(L.rot){ t.translate(HEAD_PIVOT[0],HEAD_PIVOT[1]); t.rotate(L.rot*Math.PI/180); t.translate(-HEAD_PIVOT[0],-HEAD_PIVOT[1]); }
    const p=new Path2D(L.d);
    if(L.sw){t.lineWidth=L.sw;t.lineCap=L.dash?'butt':'round';t.lineJoin='round';t.setLineDash(L.dash||[]);t.strokeStyle='#000';t.stroke(p);t.setLineDash([]);}
    else {t.fillStyle='#000';t.fill(p);}
    const a=t.getImageData(0,0,w,h).data;
    for(let i=0;i<w*h;i++){
      if(a[i*4+3]<128) continue;
      if(L.on){const o=owner[i]; if(o<0||layers[o].k!==L.on) continue;}
      owner[i]=li;
    }
  });
  return owner;
}
// Light comes from the upper left. Each pixel takes one of four tones of its layer:
// cast shadow under an overlapping layer, a broad shadow on the far side sized to the
// shape, a thin lit edge on the near side, or the base colour.
function paint(layers, owner, w, h){
  const img=new ImageData(w,h), d=img.data;
  const RP=layers.map(L=>ramp(L.c,L.pal));
  const at=(x,y)=>(x<0||y<0||x>=w||y>=h)?-2:owner[y*w+x];
  const other=(v,li)=>v!==li&&v!==-2;
  // for form shading only the shape's own silhouette counts, not whatever is drawn over it
  const outside=(v,li)=>v===-1||(v>=0&&v<li);
  const solid=v=>v>=0&&!layers[v].flat;
  const bb=layers.map(()=>[w,h,-1,-1]);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const v=owner[y*w+x]; if(v<0) continue; const B=bb[v]; if(x<B[0])B[0]=x; if(y<B[1])B[1]=y; if(x>B[2])B[2]=x; if(y>B[3])B[3]=y; }
  const reach=bb.map((B,i)=>{ const f=layers[i].k==='skin'?.14:.2; return [Math.max(2,Math.round((B[2]-B[0])*f)),Math.max(2,Math.round((B[3]-B[1])*f*.5))]; });
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const i=y*w+x, li=owner[i]; if(li<0) continue;
    const L=layers[li], C=RP[li]; let c=C.b;
    const depth=L.cast||4;
    let cast=false;
    for(let k=1;k<=depth&&!cast;k++){ const v=at(x-(k>1?1:0),y-k); if(v>li&&solid(v)) cast=true; }
    if(!L.flat){
      const [kx,ky]=reach[li];
      const far=outside(at(x+kx,y+ky),li)&&outside(at(x+Math.ceil(kx/2),y+ky+1),li);
      const rim=at(x+1,y)===-1||at(x+1,y+1)===-1||at(x,y+1)===-1&&at(x+2,y)===-1;
      const near=outside(at(x-1,y-1),li)||outside(at(x-1,y),li)||outside(at(x,y-1),li);
      if(cast) c=(far||rim)?C.d:C.s;
      else if(rim) c=C.d;
      else if(far) c=C.s;
      else if(L.k!=='skin' && (near || outside(at(x-kx,y-ky),li)&&outside(at(x-Math.ceil(kx/2),y-ky-1),li))) c=C.l;
    } else if(cast) c=mixA(C.b,[118,58,128],.4);
    d[i*4]=c[0]; d[i*4+1]=c[1]; d[i*4+2]=c[2]; d[i*4+3]=255;
  }
  return img;
}

function stamp(img, map, x0, y0, pal, mirror, mask){
  const d=img.data, w=img.width;
  map.forEach((row,y)=>{for(let i=0;i<row.length;i++){
    const ch=row[mirror?row.length-1-i:i], col=pal[ch]; if(!col) continue;
    if(mask && !mask(x0+i,y0+y)) continue;
    const p=((y0+y)*w+(x0+i))*4;
    const c=col.mix!=null?mixA([d[p],d[p+1],d[p+2]],col.v,col.mix):col;
    d[p]=c[0];d[p+1]=c[1];d[p+2]=c[2];d[p+3]=255;
  }});
}
function drawFace(img, id, e, layers, owner){
  const L=LOOK[id], eye=rgb(L.eye);
  // follow the head's tilt when placing face parts
  const tr=L.tilt?L.tilt*Math.PI/180:0;
  const at=(vx,vy,w,h)=>{ const dx=vx-HEAD_PIVOT[0], dy=vy-HEAD_PIVOT[1];
    const x=HEAD_PIVOT[0]+dx*Math.cos(tr)-dy*Math.sin(tr), y=HEAD_PIVOT[1]+dx*Math.sin(tr)+dy*Math.cos(tr);
    return [Math.round(x*SC-w/2),Math.round((y+OY)*SC-h/2)]; };
  const onSkin=(x,y)=>{const v=owner[y*SW+x];return v>=0&&layers[v].k==='skin';};
  const pe={k:[42,20,38], d:mixA(eye,[40,10,40],.5), i:eye, j:mixA(eye,[255,220,210],.4), h:[255,255,255], s:[242,232,240], l:[154,90,106]};
  const ex=e==='t'?'t':(e==='s'?'s':'n');
  if(L.eyes==='big'){
    pe.d=mixA(eye,[60,10,40],.6); pe.j=mixA(eye,[255,190,160],.45);
    stamp(img, EYE_BIG[ex], ...at(92,129,11,9), pe, false);
    stamp(img, EYE_BIG[ex], ...at(128,129,11,9), pe, true);
  } else {
    stamp(img, EYE[ex], ...at(93,128,9,7), pe, false);
    stamp(img, EYE[ex], ...at(127,128,9,7), pe, true);
  }
  const pb={b:mixA(rgb(L.hair),[42,20,38],.5)};
  stamp(img, BROW[ex], ...at(92,112,6,2), pb, false, onSkin);
  stamp(img, BROW[ex], ...at(128,112,6,2), pb, true, onSkin);
  const sk=ramp(SKIN);
  stamp(img, ["n"], ...at(112,143,1,1), {n:sk.s});
  const pm={m:[176,92,106], k:[112,44,62], r:[222,112,124]};
  const M=(ex==='n'&&L.softSmile)?["m..m",".mm."]:MOUTH[ex]; stamp(img, M, ...at(110,153,M[0].length,M.length), pm);
  const pp={p:{v:[238,130,150],mix:.35}};
  stamp(img, ["pppp"], ...at(84,142,4,1), pp); stamp(img, ["pppp"], ...at(136,142,4,1), pp);
}

function drinkColor(ids){
  if(!ids.length) return '#3a3044';
  let s=[0,0,0],w=0;
  ids.forEach((id,i)=>{const k=i===0?1.6:1;const c=rgb(ING[id].c);s=s.map((v,j)=>v+c[j]*k);w+=k;});
  return hex(s.map(v=>v/w));
}
function calcStats(ids){
  const s={warm:0,sweet:0,bitter:0,fresh:0};
  ids.forEach(id=>{for(const k in s) s[k]+=ING[id].s[k];});
  for(const k in s) s[k]=Math.max(0,Math.min(5,s[k]));
  return s;
}
function findRecipe(ids){
  if(ids.length!==3) return null;
  const [b,x,y]=ids;
  return RECIPES.find(r=>r.base===b && ((r.add[0]===x&&r.add[1]===y)||(r.add[0]===y&&r.add[1]===x))) || null;
}
const named=r=>r.alt && (S.flags.sparkNamed||book.sparkNamed);
function rName(r){ return named(r) ? r.alt : r.name; }
function rDesc(r){ return named(r) ? r.altD : r.d; }
function checkOrder(need, ids){
  if(need.free) return true;
  const st=calcStats(ids), r=findRecipe(ids);
  if(need.recipe && (!r || r.id!==need.recipe)) return false;
  if(need.base && ids[0]!==need.base) return false;
  if(need.has && !need.has.every(h=>ids.includes(h))) return false;
  if(need.tag && !ids.some(id=>ING[id].tag===need.tag)) return false;
  if(need.min) for(const k in need.min) if(st[k]<need.min[k]) return false;
  return true;
}

function drawRain(){
  const {gx,gy,gw,gh}=WIN;

  while(drops.length<want) drops.push(newDrop(true));
  if(drops.length>want) drops.length=want;
  g.fillStyle='rgba(188,204,238,.55)';
  for(const d of drops){
    for(let k=0;k<d.l;k++){ const px=Math.round(d.x-k*.35), py=Math.round(d.y-k); if(px>=gx&&px<gx+gw&&py>=gy&&py<gy+gh) g.fillRect(px,py,1,1); }

    if(d.y-d.l>gy+gh){ if(d.x>gx&&d.x<gx+gw) splashes.push({x:Math.round(d.x),y:gy+gh-1,t:0}); Object.assign(d,newDrop(false)); }

  g.fillStyle='rgba(188,204,238,.5)';
  for(let i=splashes.length-1;i>=0;i--){ const s=splashes[i]; g.fillRect(s.x-1-(s.t>>1),s.y-1,1,1); g.fillRect(s.x+1+(s.t>>1),s.y-1,1,1); if(++s.t>5) splashes.splice(i,1); }

}
function drawCups(t){
  for(const who in cups){
    const C=cups[who], A=actors[who];
    C.a+=((A&&A.ta>0?1:0)-C.a)*.2;
    if(!A && C.a<.03){ delete cups[who]; continue; }
    const x=Math.round((A?A.x:C.x)-6); if(A) C.x=A.x;
    g.globalAlpha=Math.max(0,Math.min(1,C.a));
    g.drawImage(cupSprite(C.col),x,COUNTER-5);
    g.fillStyle='rgba(240,232,220,.4)';
    for(let i=0;i<3;i++){ const ph=Math.floor(t/260+i*2)%6; for(let k=0;k<3;k++){ const yy=COUNTER-8-k*2-(ph>>1), xx=x+2+i*3+((k+ph)%2); g.fillRect(xx,yy,1,1); } }
    g.globalAlpha=1;
  }
}
function loop(t){
  g.drawImage(bgC,0,0);
  drawRain();
  g.drawImage(frC,0,0);
  Object.keys(actors).forEach(id=>drawActor(id,t));
  drawFx(t);
  g.drawImage(fgC,0,0);
  drawCups(t);
  requestAnimationFrame(loop);
}

/* stage API used by the script runner */
function enter(id, at, fx){
  if(!book.met.includes(id)){book.met.push(id);saveBook();}
  const x=slotX(at);
  actors[id]={at,x,tx:x,a:0,ta:1,dy:fx==='gap'?0:6,e:'n',dim:false,from:0};
  if(fx==='gap'){ fxs.push({x,t0:performance.now()}); actors[id].from=performance.now()+420; return 1100; }
  bell(); return 600;
}
function leave(id, fx){
  const A=actors[id]; if(!A) return 0;
  if(fx==='gap') fxs.push({x:Math.round(A.x),t0:performance.now()});
  if(fx==='blink'){ delete actors[id]; delete cups[id]; return 250; }
  A.ta=0; A.dy=0;
  return fx==='gap'?900:500;
}
function move(id, at){ const A=actors[id]; if(!A) return 0; A.at=at; A.tx=slotX(at); return 500; }
function clearStage(){ for(const k in actors) delete actors[k]; for(const k in cups) delete cups[k]; fxs.length=0; }
function placeCup(who, ids){ cups[who]={col:drinkColor(ids), a:0, x:actors[who]?actors[who].x:W/2}; }
function setExpr(who,e){ if(actors[who]) actors[who].e=e||'n'; }
function focusOn(who){ for(const id in actors) actors[id].dim = !!who && who!=='me' && id!==who; }

let toastT;
function toast(k,v,ms=1800){
  $('toastK').textContent=k; $('toastV').textContent=v;
  const t=$('toast'); t.classList.add('show'); clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),ms);
}

/* ================= Dialogue runner ================= */
let Q=[], qi=0, mode='idle', typing=null, fullText='';
const SPEED={fast:12,mid:28,slow:46};
function runSteps(steps){Q=steps.slice();qi=0;next();}
function insert(steps){Q.splice(qi,0,...steps);}
function later(ms){mode='busy';setTimeout(next,ms);}
function next(){
  if(qi>=Q.length){ endNight(); return; }
  const st=Q[qi++];
  if(Array.isArray(st)) return showLine(st);
  if(st.enter) return later(enter(st.enter, st.at||'c', st.fx));
  if(st.leave) return later(leave(st.leave, st.fx));
  if(st.move)  return later(move(st.move, st.at));
  if(st.set){ Object.assign(S.flags, st.set); if(st.set.sparkNamed){book.sparkNamed=true;saveBook();} return next(); }
  if('if' in st){
    const c = typeof st.if==='function' ? st.if(S.flags) : !!S.flags[st.if];
    insert(c ? (st.then||[]) : (st.else||[])); return next();
  }
  if(st.order) return showOrder(st);
  if(st.choice) return showChoice(st.choice);
  if(st.end) return showEnding();
  next();
}
function showLine([who,txt,e]){
  mode='line';
  choicesEl.hidden=true; choicesEl.innerHTML='';
  if(who && who!=='me') setExpr(who,e);
  focusOn(who);
  if(!who){ plateEl.hidden=true; textEl.classList.add('narr'); }
  else { plateEl.hidden=false; plateEl.textContent=CH[who].name; plateEl.style.background=CH[who].color; textEl.classList.remove('narr'); }
  typeText(txt);
}
function typeText(txt){
  fullText=txt; textEl.textContent=''; nextEl.hidden=true;
  clearInterval(typing);
  if(reduce){ textEl.textContent=txt; typing=null; nextEl.hidden=false; return; }
  let i=0;
  typing=setInterval(()=>{
    i++; textEl.textContent=txt.slice(0,i);
    if(i>=txt.length){clearInterval(typing);typing=null;nextEl.hidden=false;}
  }, SPEED[prefs.speed]||28);
}
function advance(){
  if(mode!=='line') return;
  if(typing){clearInterval(typing);typing=null;textEl.textContent=fullText;nextEl.hidden=false;return;}
  next();
}
dlg.addEventListener('click', e=>{ if(e.target.closest('button')) return; advance(); });
$('stage').addEventListener('click', advance);
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('button')) return;
  if(!$('brewOv').hidden || !$('bookOv').hidden || !$('title').hidden) { if(e.key==='Escape' && !$('bookOv').hidden) closeBook(); return; }
  if(!$('card').hidden){ if(e.key==='Enter'||e.key===' '){e.preventDefault();$('card').click();} return; }
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); advance(); }
});

function showChoice(opts){
  mode='choice'; nextEl.hidden=true;
  plateEl.hidden=true; textEl.classList.add('narr'); textEl.textContent='……';
  choicesEl.innerHTML=''; choicesEl.hidden=false;
  opts.forEach(o=>{
    const b=document.createElement('button'); b.className='btn'; b.textContent=o.label;
    b.onclick=()=>{ Object.assign(S.flags,o.set||{}); choicesEl.hidden=true; insert(o.then||[]); next(); };
    choicesEl.appendChild(b);
  });
  choicesEl.querySelector('button').focus();
}

/* ================= Orders & brewing ================= */
let curOrder=null, brew=[];
function showOrder(st){
  mode='order'; curOrder=st; nextEl.hidden=true;
  focusOn(st.order.who);
  plateEl.hidden=false; plateEl.textContent=CH[st.order.who].name; plateEl.style.background=CH[st.order.who].color;
  textEl.classList.remove('narr');
  textEl.innerHTML='';
  const box=document.createElement('div'); box.className='orderbox';
  box.innerHTML=`<div><div class="lbl">ご注文</div><div class="q"></div></div>`;
  box.querySelector('.q').textContent='「'+st.order.q+'」';
  const b=document.createElement('button'); b.className='btn primary'; b.textContent='淹れる';
  b.onclick=openBrew; box.appendChild(b);
  textEl.appendChild(box); b.focus();
}
function openBrew(){
  brew=[]; $('bWho').textContent=CH[curOrder.order.who].name; $('bQ').textContent='「'+curOrder.order.q+'」';
  $('bHint').textContent=''; renderBrew(); $('brewOv').hidden=false;
  $('gBase').querySelector('button').focus();
}
function buildIngs(){
  const mkb=(id,wrap)=>{
    const b=document.createElement('button'); b.className='ing'; b.dataset.id=id;
    b.appendChild(pxEl(icon(id),3));
    const s=document.createElement('span'); s.textContent=ING[id].name; b.appendChild(s);
    b.onclick=()=>pick(id,b); wrap.appendChild(b);
  };
  BASES.forEach(id=>mkb(id,$('gBase'))); ADDS.forEach(id=>mkb(id,$('gAdd')));
}
function pick(id, btn){
  if(brew.length>=3){ hint('カップはいっぱいです。やり直すか、提供してください。',btn); return; }
  if(brew.length===0 && !ING[id].base){ hint('最初はベース（コーヒー・紅茶・緑茶・ココア）を選んでください。',btn); return; }
  brew.push(id); $('bHint').textContent=''; renderBrew();
}
function hint(msg, el){ $('bHint').textContent=msg; if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');} }
function renderBrew(){
  const slots=$('slots'); slots.innerHTML='';
  ['ベース','二つ目','三つ目'].forEach((lab,i)=>{
    const d=document.createElement('div'); const id=brew[i];
    d.className='slot'+(id?' full':'');
    if(id){ d.appendChild(pxEl(icon(id),3)); const s=document.createElement('span'); s.textContent=ING[id].name; d.appendChild(s); }
    else d.textContent=lab;
    if(id && i===brew.length-1){ d.title='クリックで取り消し'; d.onclick=()=>{brew.pop();renderBrew();}; }
    slots.appendChild(d);
  });
  const bc=$('bigcup'); bc.innerHTML=''; bc.appendChild(pxEl(cupSprite(drinkColor(brew)),7));
  const r=findRecipe(brew);
  if(brew.length<3){ $('dname').textContent= brew.length? '調合中…':'—'; $('dnote').textContent = brew.length? `あと${3-brew.length}つ選んでください。` : '最初にベースを選んでください。'; }
  else if(r && book.found.includes(r.id)){ $('dname').textContent=rName(r); $('dnote').textContent=rDesc(r); }
  else if(r){ $('dname').textContent='？？？'; $('dnote').textContent='手帳にない組み合わせ。何ができるだろう。'; }
  else { $('dname').textContent='名もなき一杯'; $('dnote').textContent='どのレシピにもない組み合わせ。'; }
  const st=calcStats(brew);
  $('stats').innerHTML=STAT_KEYS.map(([k,s,l])=>`<span title="${l}">${s} ${l}</span><div class="pips s-${k}">${[1,2,3,4,5].map(n=>`<i class="${st[k]>=n?'on':''}"></i>`).join('')}</div>`).join('');
  $('bServe').disabled = brew.length!==3;
  document.querySelectorAll('#gAdd .ing').forEach(b=>b.classList.toggle('off', brew.length===0));
}
$('bReset').onclick=()=>{brew=[];$('bHint').textContent='';renderBrew();};
$('bBook').onclick=()=>openBook('recipe');
$('bServe').onclick=serve;
function serve(){
  if(brew.length!==3) return;
  const ids=brew.slice(), o=curOrder.order, r=findRecipe(ids);
  const ok=checkOrder(o.need, ids);
  S.flags[o.key]=ok; S.flags._lastRecipe = r?r.id:null;
  $('brewOv').hidden=true;
  textEl.textContent='';
  placeCup(o.who, ids);
  let isNew=false;
  if(r && !book.found.includes(r.id)){ book.found.push(r.id); saveBook(); isNew=true; }
  toast(isNew?'新しいレシピ':'提供', r?rName(r):'名もなき一杯');
  insert(ok?(curOrder.ok||[]):(curOrder.ng||[]));
  curOrder=null;
  later(1100);
}

/* ================= Nights ================= */
function setWhen(){ const n=NIGHTS[S.night]; $('when').innerHTML=`<b>${n.label}</b> ・ ${n.weather}`; }
function setWeather(level, fog){ rainLevel=level; fogOn=fog; audio.level(level); }
function startNight(){
  const n=NIGHTS[S.night];
  store(SAVE_KEY,{night:S.night, flags:S.flags});
  clearStage(); setWhen(); setWeather(n.rain, n.fog);
  textEl.textContent=''; plateEl.hidden=true; nextEl.hidden=true; choicesEl.hidden=true;
  showCard(`<div class="sub">${n.weather}</div><div class="big">${n.label}</div><div class="note">クリックではじめる</div>`, ()=>runSteps(n.steps));
}
function endNight(){
  const n=NIGHTS[S.night];
  const ok=n.keys.filter(k=>S.flags[k]).length;
  S.night++;
  showCard(`<div class="sub">${n.label}</div><div class="big">閉店</div><div class="res"><span>注文に応えた数</span><b>${ok} / ${n.keys.length}</b><span>見つけたレシピ</span><b>${book.found.length} / ${RECIPES.length}</b></div><div class="note">クリックで次の夜へ</div>`, startNight);
}
function showEnding(){
  const keys=NIGHTS.flatMap(n=>n.keys);
  const ok=keys.filter(k=>S.flags[k]).length;
  const stay=S.flags.ending==='stay';
  drop(SAVE_KEY);
  setWeather(.15,false);
  showCard(`<div class="sub">${stay?'幻想の店主':'雨上がりの帰り道'}</div><div class="big">終</div>`
    +`<div class="res"><span>注文に応えた数</span><b>${ok} / ${keys.length}</b><span>見つけたレシピ</span><b>${book.found.length} / ${RECIPES.length}</b><span>知り合った常連</span><b>${book.met.length} / ${PEOPLE.length}</b></div>`
    +`<div class="note">遊んでくれてありがとう。レシピ帳は次のプレイに引き継がれます。<br>クリックでタイトルへ</div>`, showTitle);
}
function showCard(html, then){
  const c=$('card'); c.innerHTML=html; c.hidden=false; mode='card';
  c.onclick=()=>{ c.hidden=true; c.onclick=null; then&&then(); };
}

/* ================= Title ================= */
function showTitle(){
  clearStage(); $('title').hidden=false;
  $('tCont').disabled=!load(SAVE_KEY);
  $('when').textContent='深夜喫茶 境界';
  textEl.textContent=''; plateEl.hidden=true; nextEl.hidden=true; choicesEl.hidden=true;
  setWeather(.55,false);
  $('tNew').focus();
}
$('tNew').onclick=()=>{ $('title').hidden=true; S={night:0,flags:{}}; startNight(); };
$('tCont').onclick=()=>{ const s=load(SAVE_KEY); if(!s) return; $('title').hidden=true; S={night:s.night||0, flags:s.flags||{}}; startNight(); };
$('tBook').onclick=()=>openBook('recipe');

/* ================= Book ================= */
let bookTab='recipe';
function openBook(tab){ bookTab=tab||bookTab; renderBook(); $('bookOv').hidden=false; $('bookClose').focus(); }
function closeBook(){ $('bookOv').hidden=true; }
$('bookClose').onclick=closeBook;
$('bookOv').addEventListener('click',e=>{ if(e.target.id==='bookOv') closeBook(); });
$('bookBtn').onclick=()=>openBook();
document.querySelectorAll('.book .tab').forEach(t=>t.onclick=()=>{bookTab=t.dataset.tab;renderBook();});
const fmt=n=>n>0?'+'+n:(n<0?'−'+(-n):'0');
function renderBook(){
  document.querySelectorAll('.book .tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.tab===bookTab));
  const body=$('bookBody'); body.innerHTML='';
  const el=(html)=>{const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;};
  if(bookTab==='recipe'){
    body.appendChild(el(`<p class="muted">見つけたレシピ ${book.found.length} / ${RECIPES.length}。ベースさえ合っていれば、二つ目と三つ目は入れ替えても同じ一杯になります。</p>`));
    const list=el('<div class="rlist"></div>');
    RECIPES.forEach(r=>{
      const f=book.found.includes(r.id), ids=[r.base,...r.add];
      const card=el(f ? `<div class="rcard"><div class="c"></div><div><div class="n"></div><div class="i">${ids.map(i=>ING[i].name).join(' ＋ ')}</div><div class="d"></div></div></div>`
                      : `<div class="rcard lock"><div class="c"></div><div><div class="n">？？？</div><div class="i">${ING[r.base].name} ＋ ？ ＋ ？</div></div></div>`);
      card.querySelector('.c').appendChild(pxEl(cupSprite(f?drinkColor(ids):'#2f2739'),3));
      if(f){ card.querySelector('.n').textContent=rName(r); card.querySelector('.d').textContent=rDesc(r); }
      list.appendChild(card);
    });
    body.appendChild(list);
  } else if(bookTab==='people'){
    const list=el('<div class="plist"></div>');
    PEOPLE.forEach(id=>{
      const m=book.met.includes(id);
      const card=el(m ? `<div class="pcard"><div class="face"></div><div><div class="n">${CH[id].name}</div><div class="t">${CH[id].title}</div><div class="d">${CH[id].bio}</div></div></div>`
                      : `<div class="pcard"><div class="face"></div><div><div class="n">？？？</div><div class="d">まだ来店していない。</div></div></div>`);
      if(m) card.querySelector('.face').appendChild(pxEl(sprite(id,'n'),1,31,40,76,80));
      list.appendChild(card);
    });
    body.appendChild(list);
  } else if(bookTab==='guide'){
    body.appendChild(el(`<p class="muted">材料を三つ選んで、一杯を淹れます。一つ目は必ずベース（コーヒー・紅茶・緑茶・ココア）。二つ目と三つ目は何でも構いません。同じ材料を重ねることもできます。</p>`));
    body.appendChild(el(`<p class="muted">客の注文は、飲み物の名前ではなく気分で届くことがあります。調合中に表示される「温・甘・苦・爽」の目盛りを手がかりにしてください。</p>`));
    const list=el('<div class="rlist"></div>');
    [...BASES,...ADDS].forEach(id=>{
      const s=ING[id].s;
      const card=el(`<div class="rcard"><div class="c"></div><div><div class="n">${ING[id].name}${ING[id].base?' <span class="i">ベース</span>':''}</div><div class="i">温${fmt(s.warm)} 甘${fmt(s.sweet)} 苦${fmt(s.bitter)} 爽${fmt(s.fresh)}${ING[id].tag==='spice'?' ・スパイス':''}</div></div></div>`);
      card.querySelector('.c').appendChild(pxEl(icon(id),3));
      list.appendChild(card);
    });
    body.appendChild(list);
  } else {
    body.appendChild(el(`<div class="set">
      <div class="row"><span>文字の速さ</span><div class="seg">${[['slow','ゆっくり'],['mid','ふつう'],['fast','はやい']].map(([k,l])=>`<button class="btn small" data-speed="${k}" aria-pressed="${prefs.speed===k}">${l}</button>`).join('')}</div></div>
      <div class="row"><span>記録を消す</span><div id="wipeWrap"><button class="btn small" id="wipe">レシピ帳と進行を消す</button></div></div>
      <p class="muted">進行は夜のはじめに自動で記録されます。記録はこのブラウザの中にだけ保存されます。</p></div>`));
    body.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{prefs.speed=b.dataset.speed;store(PREF_KEY,{speed:prefs.speed});renderBook();});
    $('wipe').onclick=()=>{
      $('wipeWrap').innerHTML=`<span class="muted" style="margin-right:8px">本当に消しますか？</span><button class="btn small" id="wipeYes">消す</button> <button class="btn small" id="wipeNo">やめる</button>`;
      $('wipeYes').onclick=()=>{ drop(SAVE_KEY); drop(BOOK_KEY); book={found:[],met:[],sparkNamed:false}; $('tCont').disabled=true; renderBook(); };
      $('wipeNo').onclick=renderBook;
    };
  }
}

/* ================= Sound ================= */
const audio=(()=>{
  let ac=null, gain=null, filt=null, lvl=.5;
  function init(){
    if(ac) return;
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const len=ac.sampleRate*3, buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=last*3.2 + w*0.08; }
    const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
    filt=ac.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=1400;
    gain=ac.createGain(); gain.gain.value=0;
    src.connect(filt).connect(gain).connect(ac.destination); src.start();
  }
  function apply(){ if(!ac) return; const t=ac.currentTime; gain.gain.cancelScheduledValues(t); gain.gain.linearRampToValueAtTime(prefs.sound? .1+.22*lvl : 0, t+.8); filt.frequency.linearRampToValueAtTime(900+900*lvl,t+.8); }
  return {
    toggle(){ try{ init(); if(ac.state==='suspended') ac.resume(); }catch(e){ return false; } prefs.sound=!prefs.sound; apply(); return prefs.sound; },
    level(l){ lvl=l; apply(); },
    bell(){ if(!ac||!prefs.sound) return; const t=ac.currentTime;
      [1318.5,1760].forEach((f,i)=>{ const o=ac.createOscillator(), gg=ac.createGain(); o.type='square'; o.frequency.value=f;
        gg.gain.setValueAtTime(0,t+i*.12); gg.gain.linearRampToValueAtTime(.025,t+i*.12+.01); gg.gain.exponentialRampToValueAtTime(.0001,t+i*.12+1.2);
        o.connect(gg).connect(ac.destination); o.start(t+i*.12); o.stop(t+i*.12+1.3); }); }
  };
})();
function bell(){ audio.bell(); }
$('soundBtn').onclick=()=>{ const on=audio.toggle(); $('soundBtn').textContent= on?'雨音 ON':'雨音 OFF'; $('soundBtn').setAttribute('aria-pressed',on); };

/* ================= Boot ================= */
layout();
window.addEventListener('resize', ()=>{ clearTimeout(layout._t); layout._t=setTimeout(layout,120); });
buildIngs();
showTitle();
requestAnimationFrame(loop);
})();
</script>
