<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サキュバスシスターズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#1a0f1d; --bg2:#211426; --panel:#29182e; --panel-hi:#35203b; --line:#4a3151;
  --ink:#f8ebf1; --muted:#bea7bd; --rose:#ff70a7; --rose-dim:#8c3a5c; --holy:#f1d68c; --holy-dim:#8a7440; --fallen:#a98eff;
  --hp:#ff5d7a; --good:#8ae2a4; --warn:#ffc36b;
  --el-none:#d8cad1; --el-fire:#ff8148; --el-water:#56b8ff; --el-thunder:#ffd94d;
  --k-atk:#3b1e2b; --k-def:#1d2940; --k-sup:#1c3a2b; --k-mag:#2f2247; --k-judge:#3d331b;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55;font-weight:500;
  background:
    radial-gradient(ellipse 70% 45% at 50% -6%, #4d1c40 0%, transparent 70%),
    radial-gradient(ellipse 55% 40% at 100% 105%, #2b1a4c 0%, transparent 70%),
    var(--bg);
  background-attachment:fixed;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
#app{max-width:1100px;margin:0 auto;padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--rose);text-shadow:0 0 16px rgba(255,112,167,.3)}
.brand b{font-weight:400;color:var(--holy)}
.meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.btn-ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.btn-ghost:hover{color:var(--ink);border-color:var(--rose-dim)}

/* setup */
.setup{display:flex;flex-direction:column;gap:20px}
.hero{padding:18px 0 4px;display:flex;flex-direction:column;gap:8px}
.hero .eyebrow{font-size:12px;letter-spacing:.3em;color:var(--holy)}
.hero h1{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(36px,9vw,72px);line-height:1.02;color:var(--rose);text-wrap:balance;text-shadow:0 0 30px rgba(255,112,167,.25)}
.hero h1 span{color:var(--holy);text-shadow:0 0 30px rgba(241,214,140,.2)}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.sect{display:flex;flex-direction:column;gap:8px}
.sect h2{margin:0;font-size:12px;letter-spacing:.25em;color:var(--holy);font-weight:700}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:52px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.seg button.on{border-color:var(--rose);background:var(--rose-dim)}
.seg-note{font-size:12px;color:var(--muted)}
.chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.char{
  text-align:left;display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer;
  background:var(--panel);border:1px solid var(--line)
}
.char.on{border-color:var(--rose);box-shadow:0 0 0 1px var(--rose),0 0 18px rgba(255,112,167,.25)}
.char .nm{font-weight:700}
.char .tx{font-size:12px;color:var(--muted);line-height:1.5}
.gem{
  position:relative;overflow:hidden;flex:none;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  background:var(--gem);color:#1a0f1d;font-family:var(--display);font-size:14px;box-shadow:0 0 0 2px var(--gem)
}
.gem img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gem.oni{box-shadow:0 0 0 2px var(--rose),0 0 12px rgba(255,112,167,.65)}
.dead .gem img{filter:grayscale(1)}
.char .gem{width:60px;height:60px}
.mepanel .gem{width:48px;height:48px}
.preview{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.preview button{padding:0;border:0;background:none;cursor:zoom-in;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.preview img{width:132px;max-width:100%;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.preview .ptext{flex:1 1 220px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.preview .ptext b{color:var(--ink);font-size:15px}
.art{height:190px;max-width:100%;border-radius:12px;box-shadow:0 0 0 2px var(--rose),0 0 28px rgba(255,112,167,.45);animation:pop .45s ease}
.sheet .art{height:auto;width:200px;align-self:center}
.sheet.zoom{width:min(420px,100%);align-items:center}
.sheet.zoom img{width:100%;border-radius:12px;background:#fff}
.zoombtn{margin-left:8px;vertical-align:baseline}
.zoomnote{margin:8px 0 0;font-size:12px;line-height:1.5;color:var(--muted, #aaa);max-width:40ch}
.start-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;bottom:0;z-index:5;padding-block:14px calc(12px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to bottom,transparent,var(--bg) 40%)}

/* players */
.foes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.pl{
  text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 9px;
  display:flex;flex-direction:column;gap:5px;position:relative;min-width:0;cursor:default
}
.pickable{cursor:pointer}
.pickable:hover{border-color:var(--rose-dim)}
.target{border-color:var(--hp);box-shadow:0 0 0 1px var(--hp),0 0 16px rgba(255,93,122,.35)}
.target::after{content:"対象";position:absolute;top:-9px;right:8px;background:var(--hp);color:#1a0f1d;font-size:10px;font-weight:700;padding:0 6px;border-radius:4px}
.active{box-shadow:0 0 0 2px var(--holy),0 0 18px rgba(241,214,140,.28)!important}
.dead{opacity:.4;filter:grayscale(.75)}
.attacker{box-shadow:0 0 0 2px var(--warn),0 0 20px rgba(255,195,107,.5)!important}
.defender{box-shadow:0 0 0 2px var(--hp),0 0 20px rgba(255,93,122,.55)!important}
.attacker::before,.defender::before{position:absolute;top:-9px;left:8px;z-index:2;font-size:10px;font-weight:700;padding:0 6px;border-radius:4px}
.attacker::before{content:"攻撃";background:var(--warn);color:#2a1d05}
.defender::before{content:"標的";background:var(--hp);color:#1a0f1d}
#arrows{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;overflow:visible}
#arrows .shaft{fill:none;stroke:currentColor;stroke-width:5;stroke-linecap:round;stroke-dasharray:14 9;animation:flow .6s linear infinite}
#arrows .glow{fill:none;stroke:currentColor;stroke-width:13;stroke-linecap:round;opacity:.22}
#arrows .head{fill:currentColor}
#arrows .preview .shaft{stroke-width:3;stroke-dasharray:5 7;opacity:.85}
#arrows .preview .glow{display:none}
@keyframes flow{to{stroke-dashoffset:-23}}
.hit{animation:hit .45s ease}
@keyframes hit{0%,100%{transform:none}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.phead{display:flex;align-items:center;gap:7px;min-width:0}
.pname{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.role{flex:none;font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.role.sister{background:var(--holy);border-color:var(--holy);color:#2a1d05}
.role.succubus{background:var(--rose);border-color:var(--rose);color:#2a0716}
.role.fallen{background:var(--fallen);border-color:var(--fallen);color:#150a30}
.role.private{background:transparent;border-style:dashed}
.role.private.sister{color:var(--holy);border-color:var(--holy)}
.role.private.succubus{color:var(--rose);border-color:var(--rose)}
.role.private.fallen{color:var(--fallen);border-color:var(--fallen)}
.bar{position:relative;height:16px;border-radius:5px;background:#12091a;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#b8354e,var(--hp));transition:width .4s ease}
.bar b{position:relative;display:block;font-size:11px;line-height:16px;padding-left:6px;font-variant-numeric:tabular-nums;text-shadow:0 1px 1px #000}
.stats{display:flex;gap:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:wrap}
.stats .vp{color:var(--holy)}
.pfield{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:0 6px;border-radius:4px;background:#3b2440;color:#f2c1dc}
.badge.seal{background:#4a1b2c;color:#ffb3c9}

/* field */
.field{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}
.stage{
  position:relative;min-height:200px;border-radius:14px;padding:14px;overflow:hidden;
  background:radial-gradient(circle at 50% 45%, rgba(255,112,167,.08), transparent 65%), var(--bg2);
  border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center
}
.duel{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
.who{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;max-width:120px}
.who .gem{width:64px;height:64px;font-size:22px;border-radius:14px}
.arrow{font-family:var(--display);color:var(--rose);font-size:22px}
.stitle{font-family:var(--display);font-size:22px;letter-spacing:.04em}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{
  --elc:var(--el-none);
  border:1px solid var(--elc);color:var(--elc);background:color-mix(in srgb,var(--elc) 12%,transparent);
  border-radius:7px;padding:1px 8px;font-size:12px;white-space:nowrap
}
.chip.heart{border-style:double;border-width:3px}
.power{font-size:13px;color:var(--muted)}
.power b{font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.flips{display:flex;flex-direction:column;gap:3px;font-size:12px}
.flips .ok{color:var(--hp)} .flips .ng{color:var(--muted)}
.result{font-family:var(--display);font-size:24px;animation:pop .35s ease}
.result.bad{color:var(--hp)} .result.ok{color:var(--good)} .result.gold{color:var(--holy)} .result.rose{color:var(--rose)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

.log{
  margin:0;padding:10px 12px;list-style:none;border-radius:14px;background:var(--bg2);border:1px solid var(--line);
  height:200px;overflow-y:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px
}
.log li.turn{color:var(--holy);margin-top:4px}
.log li.hit{color:#ffb2c0}
.log li.ko{color:var(--hp);font-weight:700}
.log li.good{color:var(--good)}
.log li.rose{color:var(--rose);font-weight:700}
.log li.holy{color:var(--holy);font-weight:700}
.log li.judge{color:var(--holy)}

/* me */
.me{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.mepanel{position:relative;border:1px solid transparent;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-radius:10px;padding:4px}
.mepanel .bar{flex:1 1 160px;height:20px}
.mepanel .bar b{line-height:20px;font-size:12px}
.mepanel .stats{font-size:13px}
.prompt{font-size:14px;min-height:22px}
.prompt strong{color:var(--rose)}
.info{font-size:12px;color:var(--muted);min-height:20px;padding:7px 10px;border-radius:10px;background:#1a0f20;white-space:pre-line}
.info b{color:var(--ink)}
.controls{display:flex;gap:8px;flex-wrap:wrap}
.btn{
  border:1px solid var(--rose-dim);background:linear-gradient(#ff8fbb,#e8568f);color:#2a0716;font-weight:700;
  padding:9px 16px;border-radius:10px;cursor:pointer
}
.btn:disabled{background:#3b2a40;border-color:#3b2a40;color:#8f7d92;cursor:not-allowed}
.btn.holy{background:linear-gradient(#f7e2a6,#d9b75b);border-color:var(--holy-dim);color:#2a1d05}
.btn.sub{background:var(--panel-hi);border-color:var(--line);color:var(--ink);font-weight:500}
.btn.sub:hover:not(:disabled){border-color:var(--rose-dim)}
.rowlabel{font-size:11px;color:var(--muted);letter-spacing:.15em}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.card{
  --elc:var(--el-none); --kc:var(--k-atk);
  position:relative;min-height:132px;max-width:100%;border-radius:10px;cursor:pointer;padding:6px 7px 7px;text-align:left;
  background:linear-gradient(165deg,color-mix(in srgb,var(--kc) 100%,#fff 6%),var(--kc) 70%);
  border:2px solid color-mix(in srgb,var(--elc) 65%,transparent);
  display:flex;flex-direction:column;gap:3px;transition:transform .12s ease, box-shadow .12s ease, opacity .12s
}
.card:hover{transform:translateY(-2px)}
.card.sel{transform:translateY(-6px);box-shadow:0 0 0 2px var(--rose),0 6px 18px rgba(255,112,167,.35)}
.card.off{opacity:.36}
.card.usable{box-shadow:0 0 0 1px var(--elc),0 0 14px color-mix(in srgb,var(--elc) 45%,transparent)}
.card .ord{position:absolute;top:-8px;left:-6px;background:var(--rose);color:#2a0716;border-radius:50%;width:18px;height:18px;font-size:11px;display:grid;place-items:center;font-weight:700}
.ctop{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}
.marks{letter-spacing:.05em;color:var(--ink)}
.trig{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-variant-numeric:tabular-nums}
.cname{font-weight:700;font-size:12.5px;line-height:1.3;overflow-wrap:anywhere}
.cnums{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:12px;font-variant-numeric:tabular-nums}
.cnums .atk{color:#ff9db4} .cnums .def{color:#9ccfff} .cnums .cost{color:var(--warn)}
.elc{font-style:normal;font-size:10px;font-weight:700;background:var(--elc);color:#1a0f1d;border-radius:4px;padding:0 4px}
.csub{font-size:10.5px;color:var(--muted);line-height:1.35}
.cheart{margin-top:auto;font-size:10.5px;color:#ffb9d3;border-top:1px dashed var(--rose-dim);padding-top:3px;line-height:1.35}
.cheart.on{color:var(--rose);font-weight:700}
.k-atk{--kc:var(--k-atk)} .k-def{--kc:var(--k-def)} .k-sup{--kc:var(--k-sup)} .k-mag{--kc:var(--k-mag)} .k-judge{--kc:var(--k-judge)}
.el-none{--elc:var(--el-none)} .el-fire{--elc:var(--el-fire)} .el-water{--elc:var(--el-water)} .el-thunder{--elc:var(--el-thunder)}
.empty{color:var(--muted);font-size:12px;padding:10px 0}
.myfield{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fcard{border:1px solid var(--elc);background:var(--k-mag);border-radius:8px;padding:3px 9px;font-size:12px;cursor:pointer}
.fcard.sel{box-shadow:0 0 0 2px var(--rose)}
.fcard.off{opacity:.4}

/* floating */
/* オンライン対戦 */
.modeseg{margin-top:4px}
.netlabel{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);max-width:320px}
.netrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.netlabel input,.netrow input{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;flex:1 1 180px;max-width:420px}
.netlabel input{flex:none;width:100%}
.netrow input:focus,.netlabel input:focus{outline:2px solid var(--rose);outline-offset:1px}
#netCode{letter-spacing:.3em;text-transform:uppercase;font-weight:700;flex:0 1 200px}
.roomcode{font-family:var(--display);font-size:clamp(40px,12vw,64px);letter-spacing:.18em;color:var(--holy);line-height:1}
.members{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.members li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.members em{font-style:normal;font-size:10px;font-weight:700;margin-left:6px;padding:0 6px;border-radius:999px;background:var(--rose-dim);color:var(--ink)}
.members small{color:var(--muted)}
.netmsg{margin:0;font-size:13px;color:var(--muted)}
.netmsg.bad{color:var(--hp)}
.netmsg a{color:var(--rose);overflow-wrap:anywhere}
.seg button:disabled{opacity:.35;cursor:not-allowed}
/* 太陽のお守り・昇天弓のカットイン */
#cutin{position:fixed;inset:0;z-index:45;pointer-events:none;display:grid;place-items:center;overflow:hidden}
#cutin:empty{display:none}
.ci{position:absolute;inset:0;display:grid;place-items:center;animation:ciout 2.3s ease forwards}
.ci-bg{position:absolute;inset:0}
.ci-rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;
  -webkit-mask-image:radial-gradient(circle,#000 0%,transparent 55%);mask-image:radial-gradient(circle,#000 0%,transparent 55%)}
.ci-body{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:16px}
.ci-card{width:min(170px,38vw);border-radius:12px;background:#fff;animation:cicard 2.3s cubic-bezier(.2,1.5,.4,1) forwards}
.ci-title{font-family:var(--display);font-size:clamp(36px,10vw,68px);line-height:1.05;letter-spacing:.04em;animation:cititle 2.3s cubic-bezier(.2,1.4,.4,1) forwards}
.ci-sub{font-size:clamp(14px,3.6vw,18px);font-weight:700;color:#fff;text-shadow:0 2px 6px #000;animation:cisub 2.3s ease forwards}
.ci-spark{position:absolute;left:50%;top:55%;width:9px;height:9px;border-radius:50%;animation:cispark 1.7s ease-out forwards}
/* 太陽のお守り：金色の光と回る光線 */
.ci.sun .ci-bg{background:radial-gradient(circle at 50% 48%,rgba(255,244,190,.95) 0%,rgba(255,196,70,.6) 28%,rgba(120,60,0,.35) 55%,rgba(26,15,29,.1) 80%);animation:cisun 2.3s ease forwards}
.ci.sun .ci-rays{background:repeating-conic-gradient(from 0deg,rgba(255,230,140,.55) 0deg 5deg,transparent 5deg 15deg);animation:cispin 2.3s linear forwards}
.ci.sun .ci-card{box-shadow:0 0 0 3px #ffe08a,0 0 70px 16px rgba(255,210,90,.85)}
.ci.sun .ci-title{color:#fff6cf;text-shadow:0 0 26px rgba(255,190,60,1),0 3px 0 #8a5200}
.ci.sun .ci-spark{background:#ffe27a;box-shadow:0 0 12px 3px #ffc53a}
/* 昇天弓：白い閃光と雷光の矢 */
.ci.bow .ci-bg{background:radial-gradient(circle at 50% 50%,rgba(60,30,90,.2) 0%,rgba(10,4,20,.88) 75%);animation:cibow 2.3s ease forwards}
.ci.bow .ci-rays{background:repeating-conic-gradient(from 0deg,rgba(255,217,77,.35) 0deg 2deg,transparent 2deg 22deg);animation:cispin 2.3s linear reverse forwards}
.ci.bow .ci-card{box-shadow:0 0 0 3px var(--el-thunder),0 0 70px 14px rgba(255,217,77,.7)}
.ci.bow .ci-title{color:var(--el-thunder);text-shadow:0 0 22px rgba(255,217,77,.95),0 3px 0 #5a3d00}
.ci.bow .ci-spark{background:#fff;box-shadow:0 0 10px 3px var(--el-thunder)}
.ci-flash{position:absolute;inset:0;background:#fff;animation:ciflash .5s ease-out forwards}
.ci-streak{position:absolute;left:-30vw;top:50%;width:160vw;height:6px;border-radius:6px;transform:rotate(-14deg);
  background:linear-gradient(90deg,transparent,#fff 40%,var(--el-thunder) 70%,transparent);box-shadow:0 0 24px 6px rgba(255,217,77,.8);animation:cistreak 2.3s ease-out forwards}
.quake{animation:quake .6s ease}
@keyframes quake{0%,100%{transform:none}15%{transform:translate(-8px,4px)}30%{transform:translate(7px,-5px)}45%{transform:translate(-6px,3px)}60%{transform:translate(5px,-2px)}80%{transform:translate(-2px,1px)}}
@keyframes ciout{0%{opacity:0}8%{opacity:1}82%{opacity:1}100%{opacity:0}}
@keyframes cisun{0%{transform:scale(.3);opacity:0}15%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:1}}

.float.hp{color:var(--hp)} .float.heal{color:var(--good)} .float.draw{color:var(--ink);font-size:14px} .float.rose{color:var(--rose)}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,4,14,.74);display:grid;place-items:center;padding:16px}
.sheet{
  width:min(640px,100%);max-height:calc(100% - 32px);overflow-y:auto;background:var(--bg2);border:1px solid var(--rose-dim);
  border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px
}
.sheet h2{margin:0;font-family:var(--display);font-weight:400;color:var(--rose);font-size:24px;text-wrap:balance}
.sheet h3{margin:6px 0 0;font-size:14px;color:var(--holy)}
.sheet p,.sheet li{margin:0;font-size:13px;max-width:66ch}
.sheet ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.sheet .muted{color:var(--muted)}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.sheet .hand{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.bigrole{font-family:var(--display);font-size:40px;line-height:1.1}

.plist{display:flex;flex-direction:column;gap:6px}
.plist button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);cursor:pointer;text-align:left}
.plist button:hover{border-color:var(--rose)}
.tbl-wrap{overflow-x:auto}
table.score{border-collapse:collapse;font-size:13px;width:100%;font-variant-numeric:tabular-nums}
table.score th,table.score td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;white-space:nowrap}
table.score td.nm{white-space:normal;min-width:5.5em}
table.score th{color:var(--muted);font-weight:500}
table.score td.num{text-align:right}
.plus{color:var(--good)} .minus{color:var(--hp)}

@media (max-width:760px){
  .field{grid-template-columns:1fr}
  .log{height:130px}
  .stage{min-height:170px}

  .who .gem{width:52px;height:52px}
  .art{height:150px}
  .pname{font-size:11.5px}
  .stats{gap:5px;font-size:10px}
  .hand{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
}

function parseTSV(text){
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i + 1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"' && cell === '') q = true;
    else if (ch === '\t'){ row.push(cell); cell = ''; }
    else if (ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (ch !== '\r') cell += ch;
  }
  if (cell !== '' || row.length){ row.push(cell); rows.push(row); }
  return rows;
}
const num = v => { v = String(v ?? '').trim(); if (v === '' || v === '-') return null; const n = Number(v); return isNaN(n) ? null : n; };
function parseRange(s){
  s = String(s || '').trim();
  if (!s || s === '単体') return { kind:'single' };
  if (s === '全体') return { kind:'all' };
  if (s === '自分') return { kind:'self' };
  const set = s.split(/[,，、\s]+/).filter(Boolean);
  return { kind:'random', set };
}
function parseCost(s){
  s = String(s || '').trim();
  let m = s.match(/HP-(\d+)/); if (m) return { hp:+m[1] };
  m = s.match(/生存[✕×xX*](\d+)/); if (m) return { perAlive:+m[1] };
  return null;
}
function parseKw(t){
  const k = {};
  if (/《吸収》(?!による)/.test(t)) k.drain = true;
  if (/《即死》/.test(t)) k.instakill = true;
  if (/《追撃不可》/.test(t)) k.noChain = true;
  if (/《追撃》/.test(t)) k.chain = true;
  if (/《全反射》/.test(t)) k.reflectAll = true;
  else if (/《反射》/.test(t)) k.reflectMagic = true;
  const nm = t.match(/《無効》((?:〔.〕)+)属性/);
  if (nm) k.nullify = [...nm[1].matchAll(/〔.〕/g)].map(m => EL_KEY[m[0]]);
  if (/《除去》/.test(t)) k.remove = true;
  if (/《反撃》/.test(t)) k.counter = /受けたダメージ\}×2/.test(t) ? 2 : 1;
  if (/《活力》/.test(t)) k.vigor = true;
  if (/防御に使ったら、?カードを1枚引く/.test(t)) k.drawOnDef = true;
  const ce = t.match(/属性を(〔.〕)に変えてもよい/); if (ce) k.changeEl = EL_KEY[ce[1]];
  const hm = t.match(/HPを(\d+)回復する/); if (hm) k.heal = +hm[1];
  if (/続けてもう1枚☆?カードを/.test(t)) k.extra = true;
  return k;
}
function makeFace(kind, name, range, el, atk, def, cost, text){
  const marks = String(kind).split(/[,，、\s]+/).filter(Boolean);
  text = String(text || '').trim(); if (text === '-') text = '';
  name = String(name).trim();
  const f = {
    name, marks, range:parseRange(range), el:EL_KEY[String(el || '').trim()] || 'none',
    atk:num(atk), def:num(def), cost:parseCost(cost), text, kw:parseKw(text), sp:SPECIAL[name] || null,
  };
  f.isAtk = marks.includes('▲');
  f.isDef = marks.includes('○') || f.def !== null;
  f.isMagic = marks.includes('☆');
  f.isSupport = marks.includes('△');
  f.isJudge = marks.includes('†');
  f.isHeart = marks.includes('♥');
  return f;
}
function buildCardDefs(){
  const defs = [];
  for (const r of parseTSV(CARD_TSV.trim())){
    if (String(r[0]).trim().toUpperCase() !== 'TRUE') continue;
    const top = makeFace(r[3], r[4], r[5], r[6], r[7], r[8], r[11], r[12]);
    const heart = r[14] && String(r[14]).includes('♥') ? makeFace(r[14], r[15], r[16], r[17], r[18], r[19], r[20], r[21]) : null;
    defs.push({ id:+r[2], trig:String(r[10] || '').trim(), top, heart });
  }
  return defs;
}

}
const isSucc = p => p.role === 'succubus' && p.revealed;
const handMax = p => isSucc(p) ? HAND_BASE + 1 + (p.char.key === 'miyomi' ? 1 + (G.players.some(q => q.role === 'fallen' && !q.alive) ? 1 : 0) : 0) : HAND_BASE;
const faceFor = (p, c) => (c.def.heart && p.role === 'succubus') ? c.def.heart : c.def.top;
function knownRole(viewer, q){ if (q.revealed || viewer === q) return q.role; return viewer.known[q.i] || null; }

async function wait(ms){
  const id = gameId;
  await new Promise(r => setTimeout(r, ms * speed));
  if (id !== gameId) throw ABORT;
}
// 集計用のフック（シミュレーター sim/ から使う。通常のプレイでは何もしない）
function emit(type, data){ if (typeof window.onGameEvent === 'function') window.onGameEvent(type, data); }
function log(text, cls = ''){ G.log.push({ text, cls }); if (G.log.length > 200) G.log.shift(); }

/* ================================================================
   マッチ（3戦）とゲームの準備
   ================================================================ */
function startMatch(){
  if (Net.role) netLeave();
  gameId++;
  const n = UI.setup.count, ci = UI.setup.char;
  const pool = shuffle(CHARACTERS.map((c, i) => i).filter(i => i !== ci));
  M = { game:0, players:Array.from({ length:n }, (_, k) => {
    const char = CHARACTERS[k === 0 ? ci : pool[k - 1]];
    return { i:k, human:k === 0, char, name:k === 0 ? 'あなた' : char.short, vp:0, history:[] };
  }) };
  nextGame();
}

function nextGame(){
  gameId++;
  M.game++;
  const n = M.players.length;
  const roles = ['succubus', ...Array(fallenCount(n)).fill('fallen')];
  while (roles.length < n) roles.push('sister');
  shuffle(roles);
  const deck = shuffle(CARD_DEFS.map(def => ({ uid:++uidSeq, def })));
  G = {
    players: M.players.map((mp, k) => Object.assign(mp, {
      role:roles[k], hp:HP_START, hand:[], field:[], revealed:false, manifested:false, alive:true,
      heartSealed:false, known:{}, sus:{}, hitAt:0,
    })),
    deck, trash:[], removed:[], round:1, turn:0, start:rand(n), ending:null, judgeSuccess:new Set(),
    stage:null, log:[], ts:{}, lastUsed:[], curUsed:[], pendingConfession:false, result:null, bowFiring:0,
  };
  G.turn = G.start;
  G.players.forEach(p => { for (let k = 0; k < HAND_BASE; k++) p.hand.push(G.deck.pop()); });
  log(`第${M.game}戦。神託が配られた。スタートは${G.players[G.start].name}。`, 'turn');
  UI.mode = 'wait'; UI.sel = []; UI.fsel = []; UI.target = null; UI.focus = null;
  render();
  run();
}

function roleIntro(p){
  const n = G.players.length;
  const fallenN = fallenCount(n);
  const cast = `この戦いはサキュバス1人${fallenN ? `・堕天使${fallenN}人` : ''}・シスター${n - 1 - fallenN}人。`;
  const goal = {
    sister:'サキュバスを昇天させればシスター陣営の勝ち。誰がサキュバスかはまだわからない。',
    succubus:'最後の1人まで生き残れば勝ち。オラクルで【顕現】するとHPが30に戻り、手札上限＋1、すべての攻撃が《吸収》になる。',
    fallen:'サキュバスと同じ陣営。サキュバスが顕現したら【告解】して正体を明かし、手札を渡す【供与】で支えられる。',
  }[p.role];
  return { role:p.role, body:`${cast}\n${goal}` };
}

/* ================================================================
   ゲーム進行
   ================================================================ */
async function run(){
  try {
    await Promise.all(G.players.filter(p => p.human).map(p => {
      const intro = roleIntro(p);
      return askP(p, 'notice', { title:`第${M.game}戦　あなたの神託`, role:intro.role, body:intro.body, art:artSrc(p.char, intro.role === 'succubus' ? 'oni' : 'hito') });
    }));
    while (!G.ending){
      const p = G.players[G.turn];
      if (p.alive) await takeTurn(p);
      if (G.ending) break;
      advance();
      if (G.round > ROUND_LIMIT){ G.ending = 'deck'; log('決着がつかないまま時間切れ（山札切れとして扱う）', 'turn'); }
    }
    await finishGame();
  } catch (e){ if (e !== ABORT) console.error(e); }
}

function advance(){
  const n = G.players.length;
  for (let k = 0; k < n; k++){
    G.turn = (G.turn + 1) % n;
    if (G.turn === G.start) G.round++;
    if (G.players[G.turn].alive) return;
  }
}

function checkEnd(){
  if (G.ending) return true;
  const alive = alivePlayers();
  const succ = G.players.find(p => p.role === 'succubus');
  // サキュバスと堕天使だけが残ったら、その時点でサキュバス陣営の勝ち
  if (!succ.alive || alive.length <= 1 || alive.every(p => p.role !== 'sister')) G.ending = 'done';
  return !!G.ending;
}

async function takeTurn(p){
  G.lastUsed = G.curUsed; G.curUsed = [];
  G.ts = { played:false, gifted:false, freeMagic:false, kurehaFire:false };
  p.heartSealed = false;
  G.stage = { src:p, title:`${p.name}のターン` };
  log(`― ${p.name}のターン（${G.round}巡目） ―`, 'turn');
  render(); await wait(p.human ? 250 : 450);

  if (isSucc(p)) await turnStartAbilities(p);
  if (G.ending || !p.alive) return;
  await drawPhase(p);
  if (G.ending) return;
  await actionPhase(p);
}

async function drawPhase(p){
  if (G.ts.skipDraw){ log(`${p.name}はドローフェイズをスキップした`); return; }
  const need = handMax(p) - p.hand.length;
  if (need <= 0) return;
  if (G.deck.length < need){ G.ending = 'deck'; log('山札が足りず、手札を補充できない。ゲーム終了。', 'turn'); return; }
  draw(p, need);
  if (p.human) log(`${p.name}はカードを${need}枚引いた`);
  render();
}

function draw(p, n){
  let got = 0;
  for (let k = 0; k < n && G.deck.length; k++){ p.hand.push(G.deck.pop()); got++; }
  if (got) fx(p, `+${got}枚`, 'draw');
  return got;
}
function flip(){ const c = G.deck.pop(); if (c) G.trash.push(c); return c || null; }
function takeFromHand(p, cards){ const ids = new Set(cards.map(c => c.uid)); p.hand = p.hand.filter(c => !ids.has(c.uid)); }
function discard(p, cards){ if (!cards || !cards.length) return; takeFromHand(p, cards); G.trash.push(...cards); log(`${p.name}は${cards.length}枚捨てた`); }

function damage(p, n){
  if (n <= 0 || !p.alive) return;
  p.hp = Math.max(0, p.hp - n);
  p.hitAt = Date.now();
  fx(p, `-${n}`, 'hp');
}
function heal(p, n){
  if (!p.alive) return 0;
  const b = p.hp; p.hp = Math.min(HP_CAP, p.hp + n);
  if (p.hp > b) fx(p, `+${p.hp - b}`, 'heal');
  return p.hp - b;
}

async function actionPhase(p){
  let remaining = 1, magicOnly = false;
  while (remaining > 0 && p.alive && !G.ending){
    const act = p.human ? await askP(p, 'action', { magicOnly }) : cpuPlan(p, magicOnly);
    if (!act || act.type === 'pass'){
      if (act && act.discard){ discard(p, [act.discard]); render(); }
      if (!p.human) log(`${p.name}はパスした`);
      break;
    }
    if (act.type === 'manifest'){ await manifest(p, {}); await handleConfessions(); continue; }
    if (act.type === 'gift'){ G.ts.gifted = true; await doGift(p, p.human); continue; }
    remaining--;
    const r = await playAction(p, act) || {};
    await handleConfessions();
    checkEnd();
    if (r.extra){ remaining++; magicOnly = !!r.magicOnly; } else magicOnly = false;
  }
}

/* ---------- 正体・顕現 ---------- */
function reveal(p, why = ''){
  if (p.revealed) return;
  p.revealed = true;
  log(`${why}${p.name}の正体は【${ROLE[p.role]}】`, p.role === 'sister' ? 'holy' : 'rose');
}
async function revealSelf(p){
  if (p.revealed) return;
  if (p.role === 'succubus') await manifest(p, {});
  else { reveal(p); G.stage = { src:p, title:'正体を明かした', result:{ text:ROLE[p.role], cls:p.role === 'sister' ? 'gold' : 'rose' } }; render(); await wait(700); }
}
async function manifest(p, o){
  emit('manifest', { p, o });
  p.revealed = true; p.manifested = true;
  log(`${p.name}が顕現した！ 正体はサキュバス（${p.char.name}）`, 'rose');
  if (!o.noHpReset){ p.hp = HP_START; log(`HPが${p.hp}になった`, 'rose'); }
  else log('断罪によりHPは戻らない', 'judge');
  if (!o.noRefill){ const n = handMax(p) - p.hand.length; if (n > 0) draw(p, n); }
  else log('断罪により手札は補充されない', 'judge');
  log(`サキュバス能力：${p.char.text}`, 'rose');
  G.pendingConfession = true;
  G.stage = { src:p, title:'顕現', art:artSrc(p.char, 'oni'), result:{ text:`${p.name}はサキュバス！`, cls:'rose' } };
  render(); await wait(1200);
}
async function handleConfessions(){
  if (!G.pendingConfession) return;
  G.pendingConfession = false;
  const succ = G.players.find(p => p.role === 'succubus');
  if (!succ.alive) return;
  for (const f of G.players.filter(p => p.role === 'fallen' && p.alive && !p.revealed)){
    const yes = f.human
      ? await askP(f, 'option', { title:'告解', body:'サキュバスが顕現した。あなたも堕天使として正体を明かしますか？ 明かすと、手札をサキュバスに渡す【供与】ができるようになる。', options:[{ label:'告解する', value:true, cls:'' }, { label:'黙っている', value:false, cls:'sub' }] })
      : f.hand.some(c => c.def.heart) || Math.random() < 0.65;
    if (!yes) continue;
    reveal(f, '告解。');
    render(); await wait(600);
    await doGift(f, true);
  }
}
function canGift(p){
  const succ = G.players.find(q => q.role === 'succubus');
  return p.role === 'fallen' && p.revealed && !!succ && succ.alive && succ.revealed && p.hand.length > 0;
}
async function doGift(p, optional){
  if (!canGift(p)) return;
  const succ = G.players.find(q => q.role === 'succubus');
  let pick;
  if (p.human){
    const r = await askP(p, 'cards', { title:'供与', body:`${succ.name}（サキュバス）に渡すカードを1枚選ぶ。${optional ? '渡さないなら選ばずに決定。' : ''}`, cards:p.hand, owner:p, min:optional ? 0 : 1, max:1 });
    pick = r[0];
  } else {
    const hearts = p.hand.filter(c => c.def.heart);   // ♥カードを優先して渡す
    pick = (hearts.length ? hearts : p.hand).slice().sort((a, b) => cardValue(succ, b) - cardValue(succ, a))[0];
  }
  if (!pick) return;
  takeFromHand(p, [pick]); succ.hand.push(pick);
  log(`${p.name}は${succ.name}にカードを1枚供与した`, 'rose');
  fx(succ, '+1枚', 'draw');
  render(); await wait(500);
}

/* ---------- ターン開始時のサキュバス能力 ---------- */
async function turnStartAbilities(p){
  const k = p.char.key;
  if (k === 'kururu' && othersClockwise(p).length){
    const skip = p.human
      ? await askP(p, 'option', { title:'クルルの能力', body:`ドローフェイズを飛ばすと、自分以外の全員に3ダメージ。（いまの手札 ${p.hand.length}/${handMax(p)}枚）`, options:[{ label:'飛ばして3ダメージ', value:true, cls:'' }, { label:'普通に引く', value:false, cls:'sub' }] })
      : (handMax(p) - p.hand.length <= 2 || othersClockwise(p).some(q => q.hp <= 3 && enemyScore(p, q) > 0));
    if (skip){
      G.ts.skipDraw = true;
      log(`${p.name}はドローフェイズを飛ばし、全員に3ダメージ`, 'rose');
      for (const q of othersClockwise(p)) damage(q, 3);
      G.stage = { src:p, title:'クルルの能力', result:{ text:'全員に3ダメージ', cls:'bad' } };
      render(); await wait(800);
      await settle();
      if (G.ending) return;
    }
  }
  if (k === 'pine'){ const h = heal(p, 10); if (h) log(`${p.name}はHPを${h}回復（パイン）`, 'good'); render(); }
  if ((k === 'tsubaki' || k === 'botan') && p.hand.length){
    const pick = p.human
      ? await askP(p, 'cards', { title:`${p.char.short}の能力`, body:'手札補充の前に、手札を1枚まで捨てられる。捨てないなら選ばずに決定。', cards:p.hand, owner:p, min:0, max:1 })
      : (p.hand.length >= handMax(p) ? [lowest(p, p.hand)] : []);
    discard(p, pick);
  }
  if (k === 'jasui'){
    const top = G.deck[G.deck.length - 1];
    if (top){
      const drop = p.human
        ? await askP(p, 'option', { title:'ジャスイの能力', body:'山札の一番上のカード。捨てますか？', card:top, options:[{ label:'捨てる', value:true, cls:'' }, { label:'そのまま', value:false, cls:'sub' }] })
        : cardValue(p, top) < 6;
      if (drop){ G.trash.push(G.deck.pop()); log(`${p.name}は山札の一番上を捨てた`); }
    }
    const used = G.lastUsed.filter(c => G.trash.includes(c));
    if (used.length && p.hand.length >= 1){
      let take = null;
      if (p.human){
        const r = await askP(p, 'cards', { title:'ジャスイの能力', body:'前の手番の人が使ったカードを1枚取る（代わりに手札を1枚捨てる）。取らないなら選ばずに決定。', cards:used, owner:p, min:0, max:1 });
        take = r[0] || null;
      } else {
        const best = used.slice().sort((a, b) => cardValue(p, b) - cardValue(p, a))[0];
        if (cardValue(p, best) >= 13) take = best;
      }
      if (take){
        const drop = p.human
          ? await askP(p, 'cards', { title:'ジャスイの能力', body:'捨てるカードを1枚選ぶ。', cards:p.hand, owner:p, min:1, max:1 })
          : lowestN(p, p.hand, 1);
        discard(p, drop);
        G.trash = G.trash.filter(c => c !== take); p.hand.push(take);
        log(`${p.name}は捨て札から${take.def.top.name}を取った`);
      }
    }
    render();
  }
}

/* ================================================================
   カードの使用
   ================================================================ */
function magicCost(p, f){
  if (!f.cost) return 0;
  if (G.ts.freeMagic && G.players[G.turn] === p) return 0;
  return f.cost.hp ?? f.cost.perAlive * alivePlayers().length;
}
function playProblem(p, c, magicOnly){
  const f = faceFor(p, c);
  if (G.round === 1 && (c.def.heart || f.isJudge)) return '1巡目は♥カード・†カードを使えない';
  if (c.def.heart && p.heartSealed) return '♥カードを封じられている';
  if (f.isJudge && p.role !== 'sister') return 'シスターだけが使える';
  if (magicOnly && !f.isMagic) return 'いまは☆魔法だけ使える';
  if (f.sp === 'amulet') return 'HPが0になったとき自動で使われる';
  if (!(f.isAtk || f.isSupport)) return '攻撃されたときに防御として使う';
  if (f.isMagic && magicCost(p, f) >= p.hp) return 'HPが足りない';
  return '';
}
function chainable(p, c){
  const f = faceFor(p, c);
  return f.isAtk && !f.isMagic && !f.kw.instakill && !f.kw.noChain && !f.isJudge && playProblem(p, c, false) === '';
}
function usableField(p){
  const own = p.field.slice();
  if (isSucc(p) && p.char.key === 'malariya') G.players.forEach(q => { if (q !== p) own.push(...q.field); });
  return own;
}
function fieldProblem(p, c, magicOnly){
  const f = faceFor(p, c);
  if (!f.isAtk) return '攻撃されたときに防御として使う';
  if (c.def.heart && p.heartSealed) return '♥カードを封じられている';
  if (magicCost(p, f) >= p.hp) return 'HPが足りない';
  return '';
}
// 何を対象に取るか：other=自分以外1人 / any=誰でも1人 / none=対象を選ばない
function targetKind(faces){
  const f0 = faces[0], last = faces[faces.length - 1];
  if (f0.isAtk) return last.range.kind === 'single' ? 'other' : 'none';
  if (['donation', 'peek', 'broom'].includes(f0.sp)) return 'other';
  if (f0.sp === 'tears') return 'any';   // 回復カードは自分にだけ使える（対象を選ばない）
  return 'none';
}

async function playAction(p, act){
  const cards = act.cards;
  if (!p.revealed && cards.some(c => c.def.heart || faceFor(p, c).isJudge)) await revealSelf(p);
  if (G.ending || !p.alive) return {};
  const faces = cards.map(c => faceFor(p, c));
  const f0 = faces[0];
  if (f0.isMagic){
    const cost = magicCost(p, f0);
    if (cost){ p.hp -= cost; emit('cost', { p, face:f0, hp:cost }); fx(p, `HP-${cost}`, 'hp'); log(`${p.name}はHPを${cost}払った`); }
  }
  if (!act.fromField){
    takeFromHand(p, cards);
    cards.forEach((c, i) => faces[i].isMagic ? p.field.push(c) : G.trash.push(c));
    G.curUsed.push(...cards);
  }
  G.ts.played = true;
  emit('play', { p, faces });
  if (f0.isAtk){ await doAttack(p, cards, faces, act.target); return {}; }
  return await doSupport(p, f0, act.target);
}

async function doSupport(p, f, target){
  const t = target || p;
  G.stage = { src:p, dst:t !== p ? t : null, title:f.name, faces:[f] };
  log(`${p.name}は${f.name}を使った${t !== p ? `（対象：${t.name}）` : ''}`);
  render(); await wait(650);
  const res = (text, cls = 'ok') => { G.stage.result = { text, cls }; };

  switch (f.sp){
    case 'tears': {
      const c = flip();
      if (!c){ res('山札がない', 'gold'); break; }
      G.stage.flips = [{ t, c, ok:['B', 'D'].includes(c.def.trig) }];
      if (['B', 'D'].includes(c.def.trig)){ const h = heal(t, 10); res(`HP+${h}`); log(`${t.name}のめくったカードは〔${c.def.trig}〕。HPが${h}回復`, 'good'); }
      else { damage(t, 10); res('HP-10', 'bad'); log(`${t.name}のめくったカードは〔${c.def.trig}〕。HPが10減った`, 'hit'); }
      break;
    }
    case 'broom': {
      if (t.field.length){ G.trash.push(...t.field); log(`${t.name}の場の魔法${t.field.length}枚が破棄された`, 'hit'); t.field = []; res('魔法を破棄', 'bad'); }
      else if (t.hand.length){
        const pick = t.human ? await askP(t, 'cards', { title:'夜魔のホウキ', body:'場に魔法がないので、手札を1枚選んで捨てる。', cards:t.hand, owner:t, min:1, max:1 }) : [lowest(t, t.hand)];
        discard(t, pick); res('手札を1枚破棄', 'bad');
      } else res('何も起きない', 'gold');
      break;
    }
    case 'prayer': {
      const pick = p.human
        ? await askP(p, 'cards', { title:'誓いの祈り', body:'捨てるカードを好きな枚数選ぶ。捨てた枚数だけ山札から引く。', cards:p.hand, owner:p, min:0, max:p.hand.length })
        : p.hand.filter(c => cardValue(p, c) < 7);
      discard(p, pick);
      const n = draw(p, pick.length);
      res(`${n}枚引き直し`, 'gold');
      return { extra:true };
    }
    case 'donation': {
      if (!p.hand.length || !t.hand.length){ res('交換できない', 'gold'); return { extra:true }; }
      const mine = p.human ? (await askP(p, 'cards', { title:'寄進の行い', body:`${t.name}に渡すカードを1枚選ぶ。`, cards:p.hand, owner:p, min:1, max:1 }))[0] : lowest(p, p.hand);
      const theirs = t.human ? (await askP(t, 'cards', { title:'寄進の行い', body:`${p.name}とカードを1枚交換する。渡すカードを選ぶ。`, cards:t.hand, owner:t, min:1, max:1 }))[0] : lowest(t, t.hand);
      takeFromHand(p, [mine]); takeFromHand(t, [theirs]); p.hand.push(theirs); t.hand.push(mine);
      log(`${p.name}の${mine.def.top.name}と${t.name}の${theirs.def.top.name}が入れ替わった`);
      res('交換', 'gold');
      return { extra:true };
    }
    case 'confess': {
      await revealSelf(p);
      draw(p, 1);
      res('告白して1枚引く', 'gold');
      return { extra:true };
    }
    case 'peek': {
      p.known[t.i] = t.role;
      if (p.human) await askP(p, 'notice', { title:'秘密の懺悔', role:t.role, body:`${t.name}の神託をこっそり確認した。` });
      else log(`${p.name}は${t.name}の神託をこっそり確認した`);
      if (p.hand.length){
        const give = p.human ? (await askP(p, 'cards', { title:'秘密の懺悔', body:`${t.name}に渡すカードを1枚選ぶ。`, cards:p.hand, owner:p, min:1, max:1 }))[0] : lowest(p, p.hand);
        takeFromHand(p, [give]); t.hand.push(give);
        log(`${p.name}は${t.name}にカードを1枚渡した`);
      }
      res('確認した', 'gold');
      break;
    }
    default: {
      if (f.kw.vigor){ G.ts.freeMagic = true; log('このターン、魔法を消費HP無しで使える', 'good'); res('《活力》', 'gold'); render(); await wait(500); return { extra:true, magicOnly:true }; }
      if (f.kw.heal){ const h = heal(t, f.kw.heal); emit('heal', { p, t, face:f, amount:h }); log(`${t.name}のHPが${h}回復`, 'good'); res(`HP+${h}`); }
    }
  }
  render(); await wait(800);
  await settle();
  return { extra:!!f.kw.extra };
}

/* ---------- 攻撃 ---------- */
function atkLabel(a){ return `〔${EL[a.el]}〕${a.power}${a.instakill ? '《即死》' : ''}${a.magic ? '・魔法' : ''}`; }

async function doAttack(p, cards, faces, target){
  const f0 = faces[0], last = faces[faces.length - 1];
  const atk = {
    name:faces.map(f => f.name).join('＋'), power:faces.reduce((s, f) => s + (f.atk || 0), 0), el:f0.el,
    magic:f0.isMagic, heart:cards.some(c => !!c.def.heart), judge:f0.isJudge ? f0.sp : null,
    instakill:!!f0.kw.instakill, cardDrain:faces.some(f => f.kw.drain), range:last.range,
    kiss:faces.some(f => f.sp === 'kiss'), noAbsorb:faces.some(f => f.sp === 'noAbsorb'), jashin:faces.some(f => f.sp === 'jashin'), faces,
  };
  for (const f of faces.slice(1)) if (f.kw.changeEl) atk.el = f.kw.changeEl;
  if (!atk.instakill && !atk.judge) await attackAbilities(p, atk);
  if (atk.judge){ await doJudge(p, atk, target); return; }
  let targets = atk.range.kind === 'single' ? [target] : othersClockwise(p);
  if (atk.range.kind === 'random') targets = await rollRandom(p, atk, targets);
  for (const t of targets){ if (G.ending) break; if (t && t.alive) await strike(atk, p, t); }
}

async function attackAbilities(p, atk){
  if (!isSucc(p)) return;
  const k = p.char.key;
  if (k === 'miroku'){
    const x = G.players.filter(q => q.role === 'sister' && q.revealed).length;   // 判明しているシスターの数（昇天した人も含む）
    atk.power = Math.max(0, atk.power - x); atk.range = { kind:'all' };
    if (x) log(`判明しているシスター${x}人ぶん、攻撃が−${x}`, 'rose');
  }
  if (k === 'kureha'){
    if (!G.ts.kurehaFire && atk.el !== 'fire' && p.hand.length >= 3){
      const pick = p.human
        ? await askP(p, 'cards', { title:'紅刃の能力', body:'手札を3枚捨てると、このターンの攻撃はすべて〔火〕属性になる。捨てないなら選ばずに決定。', cards:p.hand, owner:p, min:0, max:3 })
        : (p.hand.length >= 5 && Math.random() < 0.5 ? lowestN(p, p.hand, 3) : []);
      if (pick.length === 3){ discard(p, pick); G.ts.kurehaFire = true; }
    }
    if (G.ts.kurehaFire) atk.el = 'fire';
  }
  if (k === 'kagiko' && atk.el === 'none') atk.power += 7;
  if (k === 'botan' && atk.el !== 'none') atk.power += 5;
  if (k === 'chiamo' && p.hand.length && G.deck.length){
    const pick = p.human
      ? await askP(p, 'cards', { title:'チアモの能力', body:'手札を1枚捨てて山札を1枚めくる。同じトリガーなら、この攻撃の攻撃力が2倍になる。捨てないなら選ばずに決定。', cards:p.hand, owner:p, min:0, max:1 })
      : (atk.power >= 6 && cardValue(p, lowest(p, p.hand)) < 7 ? [lowest(p, p.hand)] : []);
    if (pick.length){
      discard(p, pick);
      const c = flip();
      const hit = c && c.def.trig === pick[0].def.trig;
      log(`${p.name}は〔${pick[0].def.trig}〕を捨てて山札をめくった：${c ? `${c.def.top.name}〔${c.def.trig}〕` : 'なし'} → ${hit ? 'ダメージ2倍！' : '不一致'}`, hit ? 'rose' : '');
      if (hit) atk.power *= 2;   // 攻撃ダメージ（防御の前）を2倍
    }
  }
  if (k === 'joka' && p.hand.length){
    const pick = p.human
      ? await askP(p, 'cards', { title:'ジョウカの能力', body:'手札を1枚捨てると、この攻撃に＋10ダメージ。捨てないなら選ばずに決定。', cards:p.hand, owner:p, min:0, max:1 })
      : (cardValue(p, lowest(p, p.hand)) < 8 ? [lowest(p, p.hand)] : []);
    if (pick.length){ discard(p, pick); atk.power += 10; log(`${p.name}の攻撃が＋10された`, 'rose'); }
  }
}

async function rollRandom(p, atk, cands){
  const hits = [], flips = [];
  for (const t of cands){
    const c = flip();
    if (!c){ log('山札がなく、めくれない'); continue; }
    const ok = atk.range.set.includes(c.def.trig);
    flips.push({ t, c, ok });
    log(`${t.name}がめくった：${c.def.top.name}〔${c.def.trig}〕→ ${ok ? '命中' : '外れ'}`);
    if (ok) hits.push(t);
  }
  G.stage = { src:p, title:atk.name, atk, faces:atk.faces, flips };
  render(); await wait(1300);
  return hits;
}

async function doJudge(p, atk, t){
  const J = JUDGE[atk.judge];
  G.stage = { src:p, dst:t, title:'断罪', atk, faces:atk.faces };
  log(`${p.name}の断罪！ ${t.name}は正体を明かさなければならない`, 'judge');
  render(); await wait(900);
  if (t.role === 'succubus'){
    G.judgeSuccess.add(p);
    log('断罪成功！', 'holy');
    G.stage.result = { text:'断罪成功', cls:'gold' }; render(); await wait(800);
    if (!t.manifested) await manifest(t, J.success);
    if (J.noHeartDef) atk.noHeartDef = true;
    await strike(atk, p, t);
    return;
  }
  reveal(t, '断罪で');
  log(`断罪失敗…`, 'judge');
  G.stage.result = { text:`断罪失敗（${ROLE[t.role]}）`, cls:'bad' };
  render(); await wait(1000);
  if (J.fail.self) await strike({ name:'断罪失敗の反動', power:J.fail.self.power, el:'none', instakill:!!J.fail.self.instakill, range:{ kind:'single' }, faces:[] }, p, p);
  if (J.fail.discard && p.alive && p.hand.length){
    const n = Math.min(J.fail.discard, p.hand.length);
    const pick = p.human ? await askP(p, 'cards', { title:'断罪失敗', body:`手札を${n}枚選んで捨てる。`, cards:p.hand, owner:p, min:n, max:n }) : lowestN(p, p.hand, n);
    discard(p, pick);
  }
}

/* ---------- 防御と解決 ---------- */
function defUsable(t, c, atk){
  const f = faceFor(t, c);
  if (!f.isDef) return false;
  if (G.round === 1 && (c.def.heart || f.isJudge)) return false;
  if (c.def.heart && (t.heartSealed || (atk.noHeartDef && t.role === 'succubus'))) return false;
  if (f.isJudge && t.role !== 'sister') return false;
  if (f.isMagic && magicCost(t, f) >= t.hp) return false;
  return true;
}
function validDef(f, atk, el){
  if (!f.isDef) return false;
  if (f.sp === 'putInPlace') return !!atk.heart;
  if (f.sp === 'choose' || f.kw.reflectAll || f.kw.remove) return true;
  if (f.kw.reflectMagic && atk.magic) return true;
  if (f.kw.nullify && f.kw.nullify.includes(el)) return true;
  return el === 'none' || f.el === el;
}
function effectiveEl(atk, faces){ return faces.some(f => f.kw.remove || f.sp === 'choose') ? 'none' : atk.el; }

// 防御の結果を予想する（プレビュー表示とCPUの判断に使う）
function predict(t, atk, faces, mode){
  let el = atk.el;
  if (faces.some(f => f.kw.remove && f.sp !== 'choose') || mode === 'remove') el = 'none';
  if (atk.heart && faces.some(f => f.sp === 'putInPlace')) return { text:'無効にする', dmg:0 };
  if (faces.some(f => f.kw.reflectAll) || (atk.magic && (faces.some(f => f.kw.reflectMagic && f.sp !== 'choose') || mode === 'reflect'))) return { text:'跳ね返す', dmg:0 };
  if (faces.some(f => f.kw.nullify && f.kw.nullify.includes(el))) return { text:'無効にする', dmg:0 };
  const def = faces.filter(f => f.def && validDef(f, atk, el)).reduce((s, f) => s + f.def, 0);
  let dmg = Math.max(0, atk.power - def);
  if (isSucc(t) && t.char.key === 'chinon') dmg = Math.max(0, dmg - 3);
  if (isSucc(t) && t.char.key === 'tsubaki' && el !== 'none') dmg = Math.max(0, dmg - 5);
  if (atk.instakill && dmg > 0) return { text:'即死する', dmg:999 };
  return { text:dmg ? `${dmg}ダメージ受ける` : 'ダメージ0', dmg };
}

async function strike(atk, src, t, depth = 0){
  if (!t.alive || (G.ending && !G.bowFiring)) return;
  G.stage = { src, dst:t, title:atk.name, atk, faces:atk.faces };
  log(`${src.name} → ${t.name}：${atk.name}（${atkLabel(atk)}）`);
  if (t !== src && atk.range.kind === 'single') t.sus[src.i] = (t.sus[src.i] || 0) + 1;
  render(); await wait(t.human ? 300 : 750);

  if (isSucc(t) && t.char.key === 'malariya' && atk.magic && await malariyaAbility(t, atk)){
    G.stage.result = { text:'無効！', cls:'ok' }; log(`${t.name}は魔法を無効にした（マラリヤ）`, 'good'); render(); await wait(700); return;
  }

  const d = t.human ? await askP(t, 'defend', { atk, src }) : cpuDefend(t, atk, src);
  if (!t.revealed && d.cards.some(c => c.def.heart || faceFor(t, c).isJudge)) await revealSelf(t);
  const faces = [...d.cards, ...d.field].map(c => faceFor(t, c));
  for (const f of faces) if (f.isMagic){ const cost = magicCost(t, f); if (cost){ const b = t.hp; t.hp = Math.max(1, t.hp - cost); emit('cost', { p:t, face:f, hp:b - t.hp }); fx(t, `HP-${cost}`, 'hp'); } }
  takeFromHand(t, d.cards);
  d.cards.forEach(c => faceFor(t, c).isMagic ? t.field.push(c) : G.trash.push(c));
  G.stage.def = faces;
  if (faces.some(f => f.kw.drawOnDef)) draw(t, faces.filter(f => f.kw.drawOnDef).length);
  if (faces.length) log(`${t.name}は${faces.map(f => f.name).join('・')}で防御${d.mode ? `（${{ reflect:'反射', remove:'除去', counter:'反撃' }[d.mode]}）` : ''}`);

  let el = atk.el;
  if (faces.some(f => f.kw.remove && f.sp !== 'choose') || d.mode === 'remove') el = 'none';

  if (atk.heart && faces.some(f => f.sp === 'putInPlace')){
    if (src.role === 'succubus'){ src.heartSealed = true; log(`${src.name}は次の自分のターンまで♥カードを使えない`, 'judge'); }
    emit('strike', { atk, src, t, faces, dmg:0, prevented:atk.power, by:faces.find(f => f.sp === 'putInPlace') });
    G.stage.result = { text:'立場をわからせた', cls:'gold' }; log(`${t.name}は♥攻撃を無効にした`, 'good');
    render(); await wait(900); return;
  }
  const reflect = faces.some(f => f.kw.reflectAll) || (atk.magic && (faces.some(f => f.kw.reflectMagic && f.sp !== 'choose') || d.mode === 'reflect'));
  if (reflect){
    let to = src;
    if (faces.some(f => f.sp === 'freeReflect') && othersClockwise(t).length) to = t.human ? await askP(t, 'player', { title:'リリスミラージュ', body:'跳ね返す相手を選ぶ。', players:othersClockwise(t) }) : cpuPickEnemy(t);
    const rf = faces.find(f => f.kw.reflectAll) || faces.find(f => f.kw.reflectMagic && f.sp !== 'choose') || faces.find(f => f.sp === 'choose');
    emit('strike', { atk, src, t, faces, dmg:0, prevented:atk.power, by:rf });
    G.stage.result = { text:'反射！', cls:'gold' }; log(`${t.name}は攻撃を${to.name}へ跳ね返した`, 'good');
    render(); await wait(800);
    await reflectTo({ ...atk, reflectedBy:rf }, t, to, depth); return;
  }

  const nullified = faces.some(f => f.kw.nullify && f.kw.nullify.includes(el));
  const defSum = nullified ? 0 : faces.filter(f => f.def && validDef(f, atk, el)).reduce((s, f) => s + f.def, 0);
  let dmg = nullified ? 0 : Math.max(0, atk.power - defSum);
  if (!nullified && isSucc(t) && t.char.key === 'chinon') dmg = Math.max(0, dmg - 3);
  if (!nullified && isSucc(t) && t.char.key === 'tsubaki' && el !== 'none') dmg = Math.max(0, dmg - 5);
  const drain = atk.cardDrain || (isSucc(src) && !atk.noAbsorb);

  if (atk.instakill && dmg > 0){
    const lost = t.hp; t.hp = 0; t.hitAt = Date.now(); fx(t, '即死', 'hp');
    G.stage.result = { text:'即死！', cls:'bad' }; log(`${t.name}は即死した`, 'hit');
    dmg = lost;
  } else if (dmg > 0){
    damage(t, dmg); G.stage.result = { text:`${dmg}ダメージ`, cls:'bad' }; log(`${t.name}に${dmg}ダメージ`, 'hit');
  } else {
    G.stage.result = { text:nullified ? '無効！' : '防いだ！', cls:'ok' }; log(`${t.name}は${nullified ? '攻撃を無効にした' : '防ぎきった'}`, 'good');
  }
  emit('strike', { atk, src, t, faces, dmg, el, defSum, nullified, killed:t.hp <= 0 });
  render(); await wait(850);

  if (dmg > 0 && drain && src.alive && src !== t){ const h = heal(src, dmg); if (h) log(`${src.name}はHPを${h}吸収した`, 'rose'); }
  if (dmg > 0 && atk.jashin && src.alive){ damage(src, dmg); log(`${src.name}はじゃしんのつるぎの反動で${dmg}ダメージ`, 'hit'); }
  if (dmg > 0 && t.hp > 0 && isSucc(t) && t.char.key === 'kururu') draw(t, 1);
  if (!nullified && atk.power > 0 && defSum === atk.power && isSucc(t) && t.char.key === 'pine') draw(t, 1);

  if (t.hp > 0 && depth < 6){
    const ctr = faces.find(f => f.kw.counter && f.sp !== 'choose');
    const counterable = othersClockwise(t).length > 0;   // 反撃できる相手が残っているか
    if (ctr && dmg > 0 && counterable){
      const to = t.human ? await askP(t, 'player', { title:ctr.name, body:`受けた${dmg}ダメージを、プレイヤー1人に与える。`, players:othersClockwise(t) }) : cpuPickEnemy(t);
      damage(to, dmg); emit('counter', { p:t, to, face:ctr, dmg }); log(`${t.name}の反撃！ ${to.name}に${dmg}ダメージ`, 'hit'); render(); await wait(700);
    }
    if (d.mode === 'counter' && dmg > 0 && counterable){
      const to = t.human ? await askP(t, 'player', { title:'反撃', body:`${dmg * 2}ダメージ（〔無〕・防御可能）を与える相手を選ぶ。`, players:othersClockwise(t) }) : cpuPickEnemy(t);
      await settle();
      await strike({ name:'反撃', power:dmg * 2, el:'none', range:{ kind:'single' }, faces:[] }, t, to, depth + 1);
    }
    const ds = faces.find(f => f.sp === 'drainShield');
    if (ds && dmg === 0 && src.alive && src !== t){
      await strike({ name:ds.name, power:5, el:ds.el, range:{ kind:'single' }, faces:[ds] }, t, src, depth + 1);
    }
  }
  await settle();
}

async function reflectTo(atk, from, to, depth){
  if (depth >= 6 || !to || !to.alive){ log('攻撃は消えた'); return; }
  await strike({ ...atk, noHeartDef:false, range:{ kind:'single' } }, from, to, depth + 1);
}

async function malariyaAbility(t, atk){
  const atks = t.hand.filter(c => faceFor(t, c).isAtk);
  if (atks.length < 2) return false;
  const pick = t.human
    ? await askP(t, 'cards', { title:'マラリヤの能力', body:'▲カードを2枚捨てると、この魔法攻撃を無効にできる。やめるなら選ばずに決定。', cards:atks, owner:t, min:0, max:2 })
    : (atk.power >= 7 ? lowestN(t, atks, 2) : []);
  if (pick.length !== 2) return false;
  discard(t, pick);
  return true;
}

/* ---------- 昇天 ---------- */
// 太陽のお守り・昇天弓が発動したときの全画面カットイン
async function cutin(kind, p, card){
  if (Net.role === 'host') netBroadcast({ t:'cutin', kind, p:p.i, d:card.def.id });
  const el = $('#cutin');
  if (!el) return;
  const sparks = Array.from({ length:18 }, (_, i) => {
    const a = (i / 18) * Math.PI * 2 + Math.random() * .3, r = 160 + Math.random() * 180;
    return `<i class="ci-spark" style="--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r - (kind === 'sun' ? 80 : 0)}px;animation-delay:${.15 + Math.random() * .35}s"></i>`;
  }).join('');
  const text = kind === 'sun'
    ? { title:'太陽のお守り', sub:`${p.name}はHP10で踏みとどまった！` }
    : { title:'昇天弓', sub:`${p.name}の最後の一矢！ 〔無〕30ダメージ` };
  el.innerHTML = `<div class="ci ${kind}"><div class="ci-bg"></div><div class="ci-rays"></div>${kind === 'bow' ? '<div class="ci-streak"></div><div class="ci-flash"></div>' : ''}${sparks}
    <div class="ci-body"><img class="ci-card" src="${cardSrc(card.def)}" alt="" onerror="this.remove()"><div class="ci-title">${text.title}</div><div class="ci-sub">${esc(text.sub)}</div></div></div>`;
  if (kind === 'bow'){ const app = $('#app'); app.classList.remove('quake'); void app.offsetWidth; app.classList.add('quake'); }
  try { await wait(2200); }
  finally { el.innerHTML = ''; $('#app').classList.remove('quake'); }
}
async function settle(){
  for (const p of G.players) if (p.alive && p.hp <= 0) await die(p);
  checkEnd();
}
async function die(p){
  const amulet = p.hand.find(c => faceFor(p, c).sp === 'amulet');
  if (amulet){
    takeFromHand(p, [amulet]); G.removed.push(amulet);
    emit('amulet', { p, face:amulet.def.top });
    p.hp = 10;
    log(`${p.name}の太陽のお守りが輝いた！ HP10で踏みとどまる`, 'good');
    G.stage = { src:p, title:'太陽のお守り', result:{ text:'HP10で復活', cls:'gold' } };
    render(); await cutin('sun', p, amulet);
    fx(p, '+10', 'heal'); render(); await wait(400);
    return;
  }
  p.alive = false; p.hp = 0; p.revealed = true;
  log(`${p.name}は昇天した（${ROLE[p.role]}）`, 'ko');
  const bow = p.hand.find(c => faceFor(p, c).sp === 'bow');
  G.trash.push(...p.hand, ...p.field); p.hand = []; p.field = [];
  G.stage = { src:p, title:'昇天', result:{ text:`${p.name}：${ROLE[p.role]}`, cls:p.role === 'sister' ? 'gold' : 'rose' } };
  render(); await wait(1000);
  if (bow){
    // 昇天弓は手札にあれば必ず撃たれる（サキュバスの昇天でゲームが終わる場合も撃ち切る）
    log(`${p.name}の昇天弓が放たれる！`, 'hit');
    emit('bowfire', { p, face:bow.def.top });
    G.stage = { src:p, title:'昇天弓', result:{ text:'最後の一矢', cls:'bad' } };
    render(); await cutin('bow', p, bow);
    const atk = { name:'昇天弓', power:30, el:'none', range:{ kind:'random', set:['B', 'D'] }, faces:[bow.def.top] };
    G.bowFiring++;
    try {
      const hits = await rollRandom(p, atk, othersClockwise(p));
      for (const t of hits) if (t.alive) await strike(atk, p, t);
    } finally { G.bowFiring--; }
  }
  checkEnd();
}

/* ---------- 勝利点 ---------- */
async function finishGame(){
  const alive = alivePlayers();
  const succ = G.players.find(p => p.role === 'succubus');
  let reason, text;
  if (!alive.length){ reason = 'none'; text = '全員が昇天した。勝利点の計算はない。'; }
  else if (!succ.alive){ reason = 'succubus'; text = 'サキュバスが昇天した。シスター陣営の勝ち。'; }
  else if (alive.length === 1){ reason = 'last'; text = '最後まで残ったのはサキュバス。サキュバス陣営の勝ち。'; }
  else if (alive.every(p => p.role !== 'sister')){ reason = 'last'; text = '生き残ったのはサキュバスと堕天使だけ。サキュバス陣営の勝ち。'; }
  else { reason = 'deck'; text = '山札が尽きてゲーム終了。'; }
  const gain = new Map(G.players.map(p => [p, []]));
  const add = (p, v, why) => gain.get(p).push({ v, why });
  if (reason === 'last') G.players.filter(p => p.role !== 'sister').forEach(p => add(p, 3, `${ROLE[p.role]}の勝利`));
  if (reason === 'succubus'){
    alive.forEach(p => add(p, 1, '生存'));
    G.players.filter(p => p.role !== 'sister').forEach(p => add(p, -2, `${ROLE[p.role]}の敗北`));
    G.judgeSuccess.forEach(p => add(p, 1, '断罪成功'));
    if (alive.length === 1) add(alive[0], 3, 'ただ1人の生存者');
  }
  if (reason === 'deck'){ alive.forEach(p => add(p, 1, '生存')); add(succ, -2, 'サキュバス'); }
  G.players.forEach(p => {
    const d = gain.get(p).reduce((s, x) => s + x.v, 0);
    p.vp += d; p.history.push(d);
    p.revealed = true;
  });
  G.result = { reason, text, gain };
  emit('end', { reason, gain });
  log(text, 'turn');
  UI.mode = 'wait'; render();
  await Promise.all(G.players.filter(p => p.human).map(p => askP(p, 'result')));
  if (M.game < GAMES) nextGame();
  else { UI.mode = 'final'; render(); netNotifyAll('final'); }
}

/* ================================================================
   CPU
   ================================================================ */
function cardValue(p, c){
  // 堕天使にとって♥カードはサキュバスに渡すための札（手放さない）
  const keep = p.role === 'fallen' && c.def.heart && G.players.some(q => q.role === 'succubus' && q.alive) ? 15 : 0;
  return keep + baseValue(p, c);
}
function baseValue(p, c){
  const f = faceFor(p, c);
  if (f.isJudge) return p.role === 'sister' ? 14 : 1;
  if (f.sp === 'amulet') return 12;
  if (f.sp === 'bow') return 9;
  if (f.kw.reflectAll) return 16;
  if (f.kw.reflectMagic || f.kw.nullify || f.sp === 'choose') return 11 + (f.def || 0) / 2;
  if (f.isAtk) return (f.atk || 0) * (f.kw.instakill ? 1.6 : 1) + (f.kw.chain ? 3 : 0) + (f.el !== 'none' ? 2 : 0) + (f.isMagic ? -2 : 0);
  if (f.isDef) return (f.def || 0) + (f.el !== 'none' ? 1 : 0);
  if (f.kw.heal) return f.kw.heal * (p.hp < 20 ? 1.2 : 0.6);
  return 6;
}
const lowest = (p, cards) => cards.slice().sort((a, b) => cardValue(p, a) - cardValue(p, b))[0];
const lowestN = (p, cards, n) => cards.slice().sort((a, b) => cardValue(p, a) - cardValue(p, b)).slice(0, n);

function enemyScore(p, q){
  const r = knownRole(p, q);
  let s = (p.sus[q.i] || 0) * 4 + Math.random() * 8;
  const onlyAllies = othersClockwise(p).every(o => { const k = knownRole(p, o); return p.role === 'sister' ? k === 'sister' : (k === 'succubus' || k === 'fallen'); });
  if (p.role === 'sister'){
    if (r === 'succubus') s += 100; else if (r === 'fallen') s += 60; else if (r === 'sister') s -= 60;
  } else if (p.role === 'succubus'){
    if (r === 'sister') s += 40; else if (r === 'fallen') s -= onlyAllies ? 0 : 80;
    s += (HP_CAP - q.hp) / 3;
  } else {
    if (r === 'succubus') s -= onlyAllies ? 0 : 120; else if (r === 'sister') s += 40; else if (r === 'fallen') s -= 30;
  }
  return s;
}
function cpuPickEnemy(p){
  const foes = othersClockwise(p);
  let best = foes[0], bs = -1e9;
  for (const q of foes){ const s = enemyScore(p, q); if (s > bs){ bs = s; best = q; } }
  return best;
}
function wantManifest(p){
  if (p.role !== 'succubus' || p.revealed || G.round === 1) return false;
  return p.hp <= 14 || alivePlayers().length <= 3 || Math.random() < 0.08;
}
function heartOK(p, c){
  if (!c.def.heart) return true;
  if (p.role === 'sister') return true;
  if (p.role === 'fallen') return p.revealed && !G.players.some(q => q.role === 'succubus' && q.alive);
  return p.revealed || p.hp <= 20 || Math.random() < 0.25;
}

function cpuPlan(p, magicOnly){
  const hand = p.hand;
  const F = c => faceFor(p, c);
  const ok = c => playProblem(p, c, magicOnly) === '' && heartOK(p, c);
  const playable = hand.filter(ok);

  if (!magicOnly && !G.ts.played && G.round > 1){
    if (wantManifest(p)) return { type:'manifest' };
    if (!G.ts.gifted && canGift(p) && (p.hand.some(c => c.def.heart) || (p.hand.length > 2 && Math.random() < 0.7))) return { type:'gift' };
  }
  // 回復
  if (p.hp <= 15){
    const h = playable.filter(c => F(c).kw.heal && !F(c).sp).sort((a, b) => F(b).kw.heal - F(a).kw.heal)[0];
    if (h) return { type:'play', cards:[h], target:p };
    const cf = playable.find(c => F(c).sp === 'confess');
    if (cf && p.role === 'succubus' && !p.revealed) return { type:'play', cards:[cf] };
  }
  if (!magicOnly){
    const vigor = playable.find(c => F(c).kw.vigor);
    const hasMagic = hand.some(c => F(c).isMagic && F(c).isAtk) || usableField(p).some(c => F(c).isAtk);
    if (vigor && hasMagic) return { type:'play', cards:[vigor] };
  }

  const target = cpuPickEnemy(p);
  // 断罪
  if (p.role === 'sister'){
    const judges = playable.filter(c => F(c).isJudge && F(c).isAtk);
    if (judges.length){
      const known = alivePlayers().find(q => q.role === 'succubus' && q.revealed);
      const unknown = othersClockwise(p).filter(q => !knownRole(p, q));
      let jt = null;
      if (known) jt = known;
      else if (unknown.length && (unknown.length <= 2 || Math.random() < 0.12)) jt = unknown.sort((a, b) => (p.sus[b.i] || 0) - (p.sus[a.i] || 0))[0];
      if (jt) return { type:'play', cards:[judges.sort((a, b) => F(b).atk - F(a).atk)[0]], target:jt };
    }
  }
  // 攻撃
  const atkCards = playable.filter(c => F(c).isAtk && !F(c).isJudge && (!F(c).isMagic || p.hp - magicCost(p, F(c)) >= 10));
  const options = [];
  for (const c of atkCards) options.push({ cards:[c], v:(F(c).atk || 0) + (F(c).kw.instakill ? 6 : 0) + (F(c).el !== 'none' ? 2 : 0) });
  const chainers = atkCards.filter(c => chainable(p, c) && F(c).kw.chain).sort((a, b) => F(b).atk - F(a).atk);
  if (chainers.length){
    const fin = atkCards.filter(c => chainable(p, c) && !F(c).kw.chain).sort((a, b) => F(b).atk - F(a).atk)[0];
    const seq = fin ? [...chainers, fin] : chainers;
    options.push({ cards:seq, v:seq.reduce((s, c) => s + (F(c).atk || 0), 0) + 1 });
  }
  for (const c of usableField(p)) if (fieldProblem(p, c, magicOnly) === '' && p.hp - magicCost(p, F(c)) >= 12) options.push({ cards:[c], fromField:true, v:(F(c).atk || 0) + 1 });
  options.sort((a, b) => b.v - a.v);
  if (options.length && options[0].v > 0){
    const o = options[0];
    return { type:'play', cards:o.cards, fromField:!!o.fromField, target };
  }
  if (magicOnly) return { type:'pass' };

  // 補助
  const sp = name => playable.find(c => F(c).sp === name);
  if (sp('prayer') && !atkCards.length) return { type:'play', cards:[sp('prayer')] };
  if (sp('confess') && p.role === 'sister' && !p.revealed && Math.random() < 0.5) return { type:'play', cards:[sp('confess')] };
  if (sp('broom')){ const t = othersClockwise(p).filter(q => q.field.length && enemyScore(p, q) > 0)[0]; if (t) return { type:'play', cards:[sp('broom')], target:t }; }
  if (sp('peek')){ const t = othersClockwise(p).find(q => !knownRole(p, q)); if (t && Math.random() < 0.6) return { type:'play', cards:[sp('peek')], target:t }; }
  if (sp('tears') && Math.random() < 0.4) return { type:'play', cards:[sp('tears')], target };
  if (sp('donation') && Math.random() < 0.4) return { type:'play', cards:[sp('donation')], target };
  if (p.hp <= 28){ const h = playable.find(c => F(c).kw.heal && !F(c).sp); if (h) return { type:'play', cards:[h], target:p }; }
  // 何もできないときは1枚捨ててパス（手札を回すための仮ルール）
  if (hand.length >= handMax(p)) return { type:'pass', discard:lowest(p, hand) };
  return { type:'pass' };
}

function cpuDefend(t, atk, src){
  const F = c => faceFor(t, c);
  const hand = t.hand.filter(c => defUsable(t, c, atk) && (heartOKDef(t, c)));
  const field = usableField(t).filter(c => defUsable(t, c, atk) && t.hp - magicCost(t, F(c)) >= 8);
  const all = [...hand, ...field];
  const out = cards => ({ cards:cards.filter(c => hand.includes(c)), field:cards.filter(c => !hand.includes(c)) });
  const big = atk.instakill || atk.power >= 8;

  if (atk.heart){ const x = hand.find(c => F(c).sp === 'putInPlace'); if (x && big) return out([x]); }
  const ra = all.find(c => F(c).kw.reflectAll); if (ra && big) return out([ra]);
  if (atk.magic){ const m = all.find(c => F(c).kw.reflectMagic && F(c).sp !== 'choose'); if (m && atk.power >= 5) return out([m]); }
  const nl = all.find(c => F(c).kw.nullify && F(c).kw.nullify.includes(atk.el)); if (nl && (big || atk.power >= 6)) return out([nl]);
  const ch = hand.find(c => F(c).sp === 'choose'); if (ch && atk.magic && big) return { cards:[ch], field:[], mode:'reflect' };
  if (atk.power <= 0 && !atk.instakill) return out([]);
  if (!atk.instakill && atk.power <= 2 && t.hp > 20 && Math.random() < 0.5) return out([]);

  let el = atk.el, prefix = [];
  let shields = all.filter(c => F(c).def > 0 && validDef(F(c), atk, el)).sort((a, b) => F(a).def - F(b).def);
  if (!shields.length && el !== 'none' && big && !atk.kiss){
    const rm = hand.find(c => F(c).kw.remove && F(c).sp !== 'choose');
    if (rm){ el = 'none'; prefix = [rm]; shields = all.filter(c => c !== rm && F(c).def > 0 && validDef(F(c), atk, 'none')).sort((a, b) => F(a).def - F(b).def); }
  }
  if (!shields.length) return out([]);
  const need = atk.power;
  const single = shields.find(c => F(c).def >= need);
  let chosen;
  if (single) chosen = [single];
  else if (atk.kiss) chosen = [shields[shields.length - 1]];
  else { chosen = []; let s = 0; for (const c of shields.slice().reverse()){ chosen.push(c); s += F(c).def; if (s >= need) break; } }
  return out([...prefix, ...chosen]);
}
function heartOKDef(t, c){
  if (c.def.heart && t.role === 'fallen' && G.players.some(q => q.role === 'succubus' && q.alive)) return false;   // 堕天使は♥カードを供与用に取っておく
  if (!c.def.heart || t.revealed) return true;
  if (t.role === 'sister') return true;
  if (t.role === 'succubus') return G.round > 1 && (t.hp <= 18 || Math.random() < 0.3);
  return false;
}

/* ================================================================
   ネットワーク対戦

   PeerJS（WebRTC）でブラウザどうしを直接つなぐ。部屋コードはホストの Peer ID の末尾。

const NET_PREFIX = 'succsis-v1-';

const store = {

  set(k, v){ try { localStorage.setItem(k, v); } catch {} },
};

const randToken = () => Array.from({ length:16 }, () => CODE_CHARS[rand(CODE_CHARS.length)]).join('');
const makeCode = () => Array.from({ length:5 }, () => CODE_CHARS[rand(CODE_CHARS.length)]).join('');
const myName = () => cleanName(UI.setup.name) || 'プレイヤー';
const inviteURL = () => `${location.origin}${location.pathname}?room=${Net.code}`;

/* ---------- 送受信する値の変換（プレイヤー・カード・カード面は番号にする） ---------- */
function enc(v){
  if (v === null || typeof v !== 'object') return v;
  if (Array.isArray(v)) return v.map(enc);
  if (FACE_REF.has(v)) return { $f:FACE_REF.get(v) };
  if (v.def && 'uid' in v) return { $c:[v.uid, v.def.id] };
  if ('char' in v && 'hp' in v && 'i' in v) return { $p:v.i };
  const o = {};
  for (const k of Object.keys(v)){ const x = v[k]; if (typeof x !== 'function' && !(x instanceof Map) && !(x instanceof Set)) o[k] = enc(x); }
  return o;
}
// 画面の class 名や画像パスに入る文字列は、記号を含まないものだけ通す
const ATTR_KEYS = new Set(['cls', 'role', 'el', 'art', 'mode', 'kind', 'reason', 'type', 'trig']);
function dec(v, ctx, key){
  if (typeof v === 'string') return ATTR_KEYS.has(key) && !/^[\w\/.\- ]{0,80}$/.test(v) ? '' : v;
  if (v === null || typeof v !== 'object') return v;
  if (Array.isArray(v)) return v.map(x => dec(x, ctx));
  if (v.$p !== undefined) return ctx.player(v.$p);
  if (v.$f){ const d = DEF_BY_ID[v.$f[0]]; return d ? (v.$f[1] ? d.heart : d.top) : null; }
  if (v.$c) return ctx.card(v.$c[0], v.$c[1]);
  const o = {};
  for (const k of Object.keys(v)) if (k !== '__proto__' && k !== 'constructor' && k !== 'prototype') o[k] = dec(v[k], ctx, k);
  return o;
}

/* ---------- 接続 ---------- */
function loadPeerJS(){
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PEERJS_SRC; s.onload = () => res(); s.onerror = () => rej(new Error('load'));
    document.head.appendChild(s);
  });
}
function peerOptions(){
  // ?peerserver=host:port で自前の PeerJS サーバーを使う（動作確認用）
  const q = new URLSearchParams(location.search).get('peerserver');
  if (!q) return { debug:0 };
  const [host, port] = q.split(':');
  return { host, port:+port || 9000, path:'/', secure:false, debug:0 };
}
function netErrText(e){
  const t = e && e.type;
  if (t === 'peer-unavailable') return '部屋が見つからなかった。部屋コードを確かめてほしい。';
  if (t === 'browser-incompatible') return 'このブラウザはオンライン対戦に対応していない。';
  if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return '接続サーバーにつながらなかった。ネットワークを確かめて、もう一度試してほしい。';
  return '接続に失敗した。もう一度試してほしい。';
}
function netReset(){
  clearTimeout(Net.joinTimer); clearTimeout(Net.syncTimer); clearInterval(Net.beat);
  try { if (Net.peer) Net.peer.destroy(); } catch {}
  Object.assign(Net, { role:null, seat:0, code:'', peer:null, status:'', members:[], lobby:null, host:null, syncTimer:0, joinTimer:0, beat:0, lastHost:0 });
  Net.pending.clear();
}
function netFail(msg){
  netReset(); Net.error = msg;
  gameId++; G = null; UI.mode = 'setup'; UI.setup.online = true;
  render();
}
function netLeave(){
  if (Net.role === 'host') netBroadcast({ t:'bye' });
  else if (Net.host) send(Net.host, { t:'bye' });
  netReset(); Net.error = '';
}

/* ---------- ホスト ---------- */
async function netHost(){
  netReset(); Net.error = ''; Net.status = '部屋を作っています…'; render();
  try { await loadPeerJS(); } catch { return netFail('通信ライブラリを読み込めなかった。ネットワークを確かめてほしい。'); }
  const open = () => {
    Net.code = makeCode();
    const peer = new Peer(NET_PREFIX + Net.code, peerOptions());
    Net.peer = peer; Net.role = 'host'; Net.seat = 0;
    peer.on('open', () => { Net.status = ''; render(); });
    peer.on('connection', conn => netAccept(conn));
    clearInterval(Net.beat);
    Net.beat = setInterval(netHostBeat, BEAT_MS);
    peer.on('disconnected', () => { if (Net.peer === peer) setTimeout(() => { try { if (Net.peer === peer && !peer.destroyed) peer.reconnect(); } catch {} }, 1500); });
    peer.on('error', e => {
      if (Net.peer !== peer) return;
      if (e.type === 'unavailable-id'){ peer.destroy(); open(); return; }
      if (e.type === 'peer-unavailable') return;
      if (!G) netFail(netErrText(e));
    });
  };
  open();
}
function netAccept(conn){
  conn.seen = Date.now();
  conn.on('data', d => { conn.seen = Date.now(); netHostData(conn, d); });
  conn.on('close', () => netDrop(conn));
  conn.on('error', () => netDrop(conn));
}
function lobbyInfo(){
  return { t:'lobby', code:Net.code, count:UI.setup.count,
    members:[{ name:myName(), char:UI.setup.char, host:true }, ...Net.members.map(m => ({ name:m.name, char:m.char }))] };
}
function netLobbyBroadcast(){
  if (Net.role !== 'host') return;
  const info = lobbyInfo();
  Net.members.forEach((m, k) => send(m.conn, { ...info, you:k + 1 }));
  render();
}
function send(conn, msg){ try { if (conn && conn.open) conn.send(msg); } catch {} }
function netBroadcast(msg){
  if (Net.role !== 'host') return;
  if (M && G) M.players.forEach(p => { if (p.remote) send(p.remote, msg); });
  else Net.members.forEach(m => send(m.conn, msg));
}
function netHostData(conn, d){
  if (!d || typeof d !== 'object') return;
  if (d.t === 'hello'){
    const name = cleanName(d.name) || 'プレイヤー', token = String(d.token || '').slice(0, 32);
    const char = Number.isInteger(d.char) && CHARACTERS[d.char] ? d.char : 0;
    if (M && G){
      // 対戦中：切れた人の席に戻る
      const seat = M.players.find(p => p.token && p.token === token && !p.remote);
      if (!seat){ send(conn, { t:'refuse', why:'started' }); setTimeout(() => conn.close(), 300); return; }
      seat.remote = conn; seat.human = true; seat.name = seat.baseName;
      Net.members.push({ conn, name:seat.baseName, char:CHARACTERS.indexOf(seat.char), token });
      log(`${seat.name}がもどってきた`, 'good');
      send(conn, { t:'start', seat:seat.i }); netSyncNow(); render();
      return;
    }
    if (Net.members.some(m => m.conn === conn)) return;
    if (Net.members.length >= 5){ send(conn, { t:'refuse', why:'full' }); setTimeout(() => conn.close(), 300); return; }
    Net.members.push({ conn, name, char, token });
    if (UI.setup.count < Net.members.length + 1) UI.setup.count = Math.max(3, Net.members.length + 1);
    netLobbyBroadcast();
    return;
  }
  if (d.t === 'bye'){ netDrop(conn); try { conn.close(); } catch {} return; }
  if (d.t === 'char'){
    const m = Net.members.find(m => m.conn === conn);
    if (m && Number.isInteger(d.char) && CHARACTERS[d.char]){ m.char = d.char; netLobbyBroadcast(); }
    return;
  }
  if (d.t === 'answer'){
    const e = Net.pending.get(d.id);
    if (!e || e.p.remote !== conn) return;
    Net.pending.delete(d.id);
    e.res(sanitizeAnswer(e, decHost(d.v, e)));
  }
}
// ホスト：参加者に生存確認を送り、しばらく何も届かない人は切れたとみなす
function netHostBeat(){
  if (Net.role !== 'host') return;
  const conns = new Set(Net.members.map(m => m.conn));
  if (M) M.players.forEach(p => p.remote && conns.add(p.remote));
  for (const c of conns){
    if (Date.now() - (c.seen || 0) > LOST_MS){ netDrop(c); try { c.close(); } catch {} }
    else send(c, { t:'ping' });
  }

function netDrop(conn){
  if (Net.role !== 'host' || conn.dropped) return;

  const m = Net.members.find(m => m.conn === conn);
  if (m && !(M && G)){ Net.members = Net.members.filter(x => x !== m); netLobbyBroadcast(); return; }
  Net.members = Net.members.filter(x => x.conn !== conn);
  if (!M) return;
  const p = M.players.find(q => q.remote === conn);
  if (!p) return;
  p.remote = null; p.human = false; p.name = `${p.baseName}（CPU）`;
  log(`${p.baseName}の接続が切れた。CPUが代わりに操作する`, 'judge');

  render();
}

  const seats = humans.map(h => ({ human:true, remote:h.conn, token:h.token, char:charOf(h.char), name:h.name }));

    name:s.name || `${s.char.short}（CPU）`, baseName:s.name || s.char.short, vp:0, history:[] })) };

/* ホスト → 各プレイヤー：その人から見える状態だけを送る */
function snapshotFor(v){

// 届いた返事を、ゲームのルールで受け付けられる形に直す（おかしなものはパス扱い）
function sanitizeAnswer(e, v){
  const { p, mode, extra:x } = e;
  const inHand = c => !!c && p.hand.includes(c);
  const uniq = (c, k, a) => a.indexOf(c) === k;
  try {
    switch (mode){
      case 'action': {
        const pass = { type:'pass', discard:v && !x.magicOnly && inHand(v.discard) ? v.discard : undefined };
        if (!v || v.type === 'pass') return pass;
        const free = !x.magicOnly && !G.ts.played && G.round > 1;
        if (v.type === 'manifest') return free && p.role === 'succubus' && !p.revealed ? { type:'manifest' } : { type:'pass' };
        if (v.type === 'gift') return free && !G.ts.gifted && canGift(p) ? { type:'gift' } : { type:'pass' };
        if (v.type !== 'play') return { type:'pass' };
        const cards = Array.isArray(v.cards) ? v.cards.filter(uniq) : [];
        const pool = v.fromField ? usableField(p) : p.hand;
        if (!cards.length || !cards.every(c => c && pool.includes(c))) return { type:'pass' };
        if (v.fromField ? fieldProblem(p, cards[0], x.magicOnly) : playProblem(p, cards[0], x.magicOnly)) return { type:'pass' };
        if (v.fromField && cards.length > 1) return { type:'pass' };
        for (let k = 1; k < cards.length; k++) if (!(faceFor(p, cards[k - 1]).kw.chain && faceFor(p, cards[0]).isAtk && chainable(p, cards[k]))) return { type:'pass' };
        const tk = targetKind(cards.map(c => faceFor(p, c)));
        let target = v.target;
        if (tk === 'other' && (!target || target === p || !target.alive)) return { type:'pass' };
        if (tk === 'any' && (!target || !target.alive)) target = p;
        if (tk === 'none') target = null;
        return { type:'play', cards, fromField:!!v.fromField, target };
      }
      case 'defend': {
        const field0 = usableField(p);
        let cards = (v && Array.isArray(v.cards) ? v.cards : []).filter(uniq).filter(c => inHand(c) && defUsable(p, c, x.atk));
        let field = (v && Array.isArray(v.field) ? v.field : []).filter(uniq).filter(c => c && field0.includes(c) && defUsable(p, c, x.atk));
        if (x.atk.kiss && cards.length + field.length > 1){ if (cards.length){ cards = cards.slice(0, 1); field = []; } else field = field.slice(0, 1); }
        const mode = ['reflect', 'remove', 'counter'].includes(v && v.mode) && cards.some(c => faceFor(p, c).sp === 'choose') ? v.mode : null;
        return { cards, field, mode };
      }
      case 'cards': {
        let pick = (Array.isArray(v) ? v : []).filter(uniq).filter(c => c && x.cards.includes(c)).slice(0, x.max);
        if (pick.length < x.min) pick = lowestN(p, x.cards, x.min);
        return pick;
      }
      case 'player': return x.players.includes(v) ? v : x.players[0];
      case 'option': return x.options.some(o => o.value === v) ? v : x.options[x.options.length - 1].value;
      default: return true;
    }
  } catch { return fallbackAnswer(e); }
}
// 返事が来ないまま接続が切れたとき：CPUの判断で代わりに答える
function fallbackAnswer(e){
  const { p, mode, extra:x } = e;
  try {
    if (mode === 'action') return cpuPlan(p, !!x.magicOnly);
    if (mode === 'defend') return cpuDefend(p, x.atk, x.src);
    if (mode === 'cards') return x.min ? lowestN(p, x.cards, x.min) : [];
    if (mode === 'player'){ const q = cpuPickEnemy(p); return x.players.includes(q) ? q : x.players[0]; }
    if (mode === 'option') return x.options[x.options.length - 1].value;
  } catch {}
  return mode === 'action' ? { type:'pass' } : mode === 'defend' ? { cards:[], field:[], mode:null } : mode === 'cards' ? [] : true;
}

async function netJoin(code){
